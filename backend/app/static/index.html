}
function infoItem(k,v){ return `<div class="info-item"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`; }

/* ============================= MASTER RENDER ============================= */
let renderedView = null;
function render(){
  state.formDirty = false;
  if(state.view==='detail' && !historyFor(state.selectedSwatId).length) state.view='database';
  if(state.view==='accounts' && !state.isSysAdmin) state.view='home';
  if(state.view!=='detail'){
    state.detailEditMode = false;
    state.editBuffer = null;
    clearCaseHash();
  }
  const viewKey = state.view==='detail' ? 'detail:'+state.selectedSwatId : state.view;
  const tableKey = table=>(table.tHead?.textContent||'').replace(/[▲▼\s]+/g,' ').trim();
  const scrollPositions = new Map();
  if(renderedView===viewKey){
    document.querySelectorAll('#app .table-scroll > table').forEach(table=>{
      scrollPositions.set(tableKey(table),table.parentElement.scrollLeft);
    });
  }
  renderNav();
  const app = document.getElementById('app');
  app.classList.toggle('wide', state.view==='database');
  app.parentElement.classList.toggle('is-wide', state.view==='database');
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='database') app.innerHTML = renderDatabase();
  else if(state.view==='dashboard') app.innerHTML = renderDashboard();
  else if(state.view==='followups') app.innerHTML = renderFollowups();
  else if(state.view==='detail') app.innerHTML = renderDetail();
  else if(state.view==='submit') app.innerHTML = renderSubmit();
  else if(state.view==='accounts') app.innerHTML = renderAccounts();
  else if(state.view==='approvals') app.innerHTML = renderApprovals();
  wireEvents();
  wireScrollRegions();
  // 展开提醒、排序等局部操作保留横向位置，避免右侧操作按钮突然跳出视野。
  document.querySelectorAll('#app .table-scroll > table').forEach(table=>{
    table.parentElement.scrollLeft = scrollPositions.get(tableKey(table)) || 0;
  });
  renderedView = viewKey;
}

/* ============================= EVENTS ============================= */
function goToDetail(swatId){
  try{ history.replaceState(null, '', '#case/'+encodeURIComponent(swatId)); }catch(e){}
  state.selectedSwatId = swatId;
  state.selectedEntryIndex = historyFor(swatId).length-1;
  state.view='detail';
  state.detailEditMode = false;
  state.editBuffer = null;
  render();
  window.scrollTo(0,0);
}
function clearCaseHash(){
  if(location.hash.startsWith('#case/')){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }
}
function canRefresh(){
  return !state.detailEditMode && !state.remindOpenId && !state.followupEditId && !state.pendingDeleteId && !state.adminLoginOpen && !state.feedbackOpenId && !state.decisionOpenId
    && !state.formDirty && !state.uploading && !API.pendingWrites && state.view!=='submit'
    && !document.querySelector('.reject-box.show')
    && !document.activeElement?.matches('input, textarea, select');
}
function applyKpiFilter(key){
  if(key==='open' || key==='overdue' || key==='closedaction'){
    state.view='followups'; state.followupTag=''; state.followupOwner=''; state.followupFunction='';
    state.followupStatus = key==='open' ? 'Open' : key==='overdue' ? 'Overdue' : 'Closed';
    state.followupYear = String(state.dashYear || '');
    render(); window.scrollTo(0,0); return;
  }
  state.view='database'; state.searchQuery='';
  state.filters = {year:'',weekFrom:'',weekTo:'',region:'',cluster:'',commodity:'',supplier:'',decision:'',status:''};
  if(key==='pending') state.filters.decision='PENDING';
  else if(key==='approved') state.filters.decision='APPROVED';
  else if(key==='rejected') state.filters.decision='REJECTED';
  else if(key==='conditional') state.filters.decision='CONDITIONAL APPROVAL';
  else if(key==='closedcases'){ /* case-level closed: no single row filter, leave unfiltered by decision/status */ }
  render();
  window.scrollTo(0,0);
}

function wireEvents(){
  const val0 = id => (document.getElementById(id)||{}).value || '';
  document.querySelectorAll('.form-field').forEach(field=>{
    const label = field.querySelector('label');
    const control = field.querySelector('input[id], select[id], textarea[id]');
    if(label && control) label.htmlFor = control.id;
  });
  document.querySelectorAll('[data-kpi], tr[data-swat], [data-swat-link], .tl-item, #backToDb, #dropzone').forEach(el=>{
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.onkeydown = e=>{ if(e.target===el && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); el.click(); } };
  });
  document.querySelectorAll('[data-kpi]').forEach(el=>{
    el.onclick = ()=> applyKpiFilter(el.dataset.kpi);
  });
  document.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick = ()=>{ state.dashPeriod = el.dataset.period; render(); };
  });
  const dys = document.getElementById('dashYearSelect');
  if(dys) dys.onchange = ()=>{ state.dashYear = Number(dys.value); state.dashWeek = null; render(); };
  const dws = document.getElementById('dashWeekSelect');
  if(dws) dws.onchange = ()=>{ state.dashWeek = Number(dws.value); render(); };
  const dashExportBtn = document.getElementById('dashExportBtn');
  if(dashExportBtn) dashExportBtn.onclick = ()=>{
    const {periodCases, label} = dashScope();
    downloadCasesCsv(periodCases, `sourcing_committee_dashboard_${label}.csv`);
  };
  for(const [id, kind] of [['dashAgendaBtn','agenda'],['dashMinutesBtn','minutes']]){
    bindExportButton(id, kind, ()=>({week: state.dashWeek, year: state.dashYear}));
  }

  // Home view: weekly Excel import (v3 Phase-17)
  const dz = document.getElementById('dropzone'), importInput = document.getElementById('importFiles');
  if(dz && importInput){
    dz.onclick = ()=> importInput.click();
    importInput.onchange = ()=>{ queueImportFiles([...importInput.files]); importInput.value=''; };
    dz.ondragover = e=>{ e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = ()=> dz.classList.remove('over');
    dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove('over'); queueImportFiles([...(e.dataTransfer?.files||[])]); };
  }
  const libSelect = document.getElementById('importLibrarySelect');
  const libAdd = document.getElementById('importLibraryAdd');
  if(libAdd && libSelect) libAdd.onclick = ()=>{ if(libSelect.value) queueLibraryFiles([libSelect.value]); };
  const libAddAll = document.getElementById('importLibraryAddAll');
  if(libAddAll) libAddAll.onclick = ()=>{ queueLibraryFiles((state.importLibrary||[]).filter(f=>!f.imported).map(f=>f.path)); };
  document.querySelectorAll('[data-import-include]').forEach(el=>{ el.onchange = ()=>{ state.importQueue[Number(el.dataset.importInclude)].include = el.checked; refreshImportQueue(); }; });
  document.querySelectorAll('[data-import-remove]').forEach(el=>{ el.onclick = ()=>{ state.importQueue.splice(Number(el.dataset.importRemove),1); refreshImportQueue(); }; });
  document.querySelectorAll('[data-import-warn]').forEach(el=>{ el.onclick = ()=>{ const e = state.importQueue[Number(el.dataset.importWarn)]; e.showWarnings = !e.showWarnings; refreshImportQueue(); }; });
  document.querySelectorAll('[data-import-date]').forEach(el=>{ el.onchange = ()=>{ const e = state.importQueue[Number(el.dataset.importDate)]; e.meetingDate = el.value; if(e.meetingDate) previewImportFile(e); }; });
  // v3 Phase-20：首页 Presentations 区
  const presAttachOne = document.getElementById('presAttachOne'), presSelect = document.getElementById('presSelect');
  if(presAttachOne && presSelect) presAttachOne.onclick = ()=>{
    if(!presSelect.value){ toast('Choose a presentation first.'); return; }
    presAttachOne.disabled = true; attachPresentations([presSelect.value]);
  };
  const presAttachAll = document.getElementById('presAttachAll');
  if(presAttachAll) presAttachAll.onclick = ()=>{
    const paths = libraryFiles().filter(f=>f.match && !f.match.attached).map(f=>f.path);
    if(paths.length){ presAttachAll.disabled = true; attachPresentations(paths); }
  };
  const presUploadBtn = document.getElementById('presUploadBtn'), presUploadInput = document.getElementById('presUploadInput');
  if(presUploadBtn && presUploadInput){
    presUploadBtn.onclick = ()=> presUploadInput.click();
    presUploadInput.onchange = ()=>{ const list = [...presUploadInput.files]; presUploadInput.value=''; if(list.length){ presUploadBtn.disabled = true; uploadPresentations(list); } };
  }
  const importSourceUrl = document.getElementById('importSourceUrl');
  if(importSourceUrl) importSourceUrl.oninput = ()=>{ state.importSourceUrl = importSourceUrl.value; };
  const importRun = document.getElementById('importRunBtn');
  if(importRun) importRun.onclick = runImport;
  const importClear = document.getElementById('importClearBtn');
  if(importClear) importClear.onclick = ()=>{ state.importQueue = []; state.importResults = null; refreshImportQueue(); };
  const goSubmit = document.getElementById('goToSubmit');
  if(goSubmit) goSubmit.onclick = ()=>{ state.view='submit'; render(); window.scrollTo(0,0); };
  const hsi = document.getElementById('homeSearchInput');
  if(hsi){
    hsi.oninput = (e)=>{ };
    hsi.onkeydown = (e)=>{ if(e.key==='Enter'){ state.searchQuery=hsi.value; state.view='database'; render(); } };
  }
  document.querySelectorAll('.activity-row').forEach((el,i)=>{
    // recent activity click -> open that case
  });

  // Database view
  const dbSearch = document.getElementById('dbSearch');
  if(dbSearch){
    dbSearch.oninput = ()=>{ state.searchQuery = dbSearch.value; refreshDbTableOnly(); };
  }
  ['fYear','fWeekFrom','fWeekTo','fRegion','fCluster','fCommodity','fSupplier','fDecision','fStatus'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{
      const map={fYear:'year',fWeekFrom:'weekFrom',fWeekTo:'weekTo',fRegion:'region',fCluster:'cluster',fCommodity:'commodity',fSupplier:'supplier',fDecision:'decision',fStatus:'status'};
      state.filters[map[id]] = el.value;
      if(id==='fYear'){ state.filters.weekFrom=''; state.filters.weekTo=''; }  // 换年份后周范围重选
      // v3 Phase-25：只选 From week 时默认只看这一周（To 留空曾等于"之后所有周"，KW43 混进 KW42 的议程）
      if(id==='fWeekFrom' && el.value && (!state.filters.weekTo || Number(state.filters.weekTo) < Number(el.value))) state.filters.weekTo = el.value;
      render();
    };
  });
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      state.dbSort = {key, dir: state.dbSort.key===key ? (state.dbSort.dir==='asc'?'desc':'asc') : (key==='week'||key==='date'||key==='spend' ? 'desc' : 'asc')};
      refreshDbTableOnly();
    };
  });
  const filteredDbRows = ()=> dbRows();
  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.onclick = ()=>downloadCasesCsv(filteredDbRows(), 'sourcing_committee_export.csv');
  // 议程 / 纪要按当前筛选结果导出（Database 页，2026-09-24 用户要求）
  bindExportButton('dbAgendaBtn', 'agenda', ()=>({ids: filteredDbRows().map(c=>c.id)}));
  bindExportButton('dbMinutesBtn', 'minutes', ()=>({ids: filteredDbRows().map(c=>c.id)}));
  const clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.onclick = ()=>{
    state.filters = {year:'',weekFrom:'',weekTo:'',region:'',cluster:'',commodity:'',supplier:'',decision:'',status:''};
    state.searchQuery='';
    render();
  };
  document.querySelectorAll('tr[data-swat]').forEach(row=>{
    row.onclick = ()=> goToDetail(row.dataset.swat);
  });

  // Admin delete (two-step: ask → confirm)
  document.querySelectorAll('[data-delete-ask]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); if(!state.isAdmin) return; state.pendingDeleteId = el.dataset.deleteAsk; render(); };
  });
  document.querySelectorAll('[data-delete-cancel]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); state.pendingDeleteId = null; render(); };
  });
  document.querySelectorAll('[data-delete-confirm]').forEach(el=>{
    el.onclick = async (e)=>{ e.stopPropagation(); if(!state.isAdmin || el.disabled) return;
      const swat = el.dataset.deleteConfirm;
      el.disabled = true; // 防双击：第二击会撞 404 "No case rows" 弹红色误报
      let removed = 0;
      try{ const resp = await API.del('/api/cases/'+encodeURIComponent(swat)); applySnapshot(resp.snapshot); removed = resp.filesRemoved||0; }
      catch(err){ el.disabled = false; toast('⚠ Delete failed: '+(err.detail||err.message)); return; }
      deleteCase(swat); // arrays are already fresh from the snapshot; this resets selection/edit state
      render(); window.scrollTo(0,0);
      toast(`Case ${swat} deleted${removed ? ` with ${removed} attached file${removed===1?'':'s'}` : ''}.`); };
  });

  // Submit page login gate (stopPropagation: the document click handler would close the panel just opened)
  const gateLogin = document.getElementById('submitLoginBtn');
  if(gateLogin) gateLogin.onclick = e=>{ e.stopPropagation(); showAdminLogin('login'); };
  const gateRegister = document.getElementById('submitRegisterBtn');
  if(gateRegister) gateRegister.onclick = e=>{ e.stopPropagation(); showAdminLogin('register'); };

  // Accounts page (Sourcing admin)
  const updateAccount = async (email, patch, control)=>{
    if(!state.isSysAdmin) return;
    if(control) control.disabled = true;
    try{
      const resp = await API.put('/api/users/'+encodeURIComponent(email), patch);
      state.accounts = resp.users || state.accounts;
      const mine = state.user && (resp.users||[]).find(u=>u.email===state.user.email);
      if(mine && mine.name!==state.user.name) setCurrentUser({...state.user, name: mine.name});  // 改了自己的名字：提交页立刻用新名字
      if(resp.temporaryPassword){ state.accountsNotice = {email, temporaryPassword: resp.temporaryPassword}; window.scrollTo(0,0); }  // 提升为管理员：临时密码只显示这一次
      toast('✓ Account updated.');
    }catch(err){ toast('⚠ '+(err.detail||err.message)); }
    if(state.view==='accounts') render();
  };
  document.querySelectorAll('[data-user-role]').forEach(sel=>{
    sel.onchange = ()=> updateAccount(sel.dataset.userRole, {role: sel.value}, sel);
  });
  document.querySelectorAll('[data-user-name]').forEach(input=>{
    input.onchange = ()=>{
      const name = input.value.trim(), old = (state.accounts||[]).find(u=>u.email===input.dataset.userName);

      if(old && name===old.name){ input.value = name; return; }
      updateAccount(input.dataset.userName, {name}, input);
    };
  });
  document.querySelectorAll('[data-user-disable]').forEach(btn=>{
    btn.onclick = ()=> updateAccount(btn.dataset.userDisable, {disabled: btn.dataset.disabled!=='1'}, btn);
  });
  document.querySelectorAll('[data-user-reset]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!state.isSysAdmin || btn.disabled) return;
      const email = btn.dataset.userReset;
      if(!confirm(`Reset the admin password for ${email}?\nThey are logged out everywhere and must choose a new password with the temporary one you pass on.`)) return;
      btn.disabled = true;
      try{
        const resp = await API.post('/api/users/'+encodeURIComponent(email)+'/reset-password');
        state.accounts = resp.users || state.accounts;
        state.accountsNotice = {email, temporaryPassword: resp.temporaryPassword};

      if(state.view==='accounts'){ render(); window.scrollTo(0,0); }

  const accountsRetry = document.getElementById('accountsRetry');
  if(accountsRetry) accountsRetry.onclick = ()=>{ state.accountsError = null; state.accounts = null; render(); };

      problems.push('A Sourcing Decision cannot be saved without the Sourcing Presentation — enter the Sourcing Presentation Link, or add the presentation file under Sourcing Presentation Files.');
    if(b.sourcingPresentationLink && !isUrl(b.sourcingPresentationLink)) problems.push('The Sourcing Presentation Link must be a full URL (starting with http:// or https://).');
    if(!regionList(b).length) problems.push('Select at least one Region.');
    // Rule 0: a Pending case has not been reviewed — it cannot carry post-decision follow-up tasks.
    if(b.meetingDecision==='PENDING' && b.followUps.length>0) problems.push('A case that is Pending for Sourcing Committee Review cannot have follow-up tasks. Record the Sourcing Decision first, or remove the tasks.');
    // 未关闭的待办要能收到提醒：必须填写收件邮箱（系统不再按姓名猜测）。
    b.followUps.forEach((t,i)=>{ if(t.status!=='Closed' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t.notifyEmail||'')) problems.push(`Follow-up task ${i+1}: enter a valid "Send reminder to" email, so the reminder reaches someone.`); });
    // Rule 2: closing the case (every follow-up action closed) requires the Final PPT / Supporting Document Link.
    if(rollupActionStatus(b.followUps)==='Closed' && !b.finalDocLink) problems.push('All follow-up actions are now Closed, which closes the case — enter the Final PPT / Supporting Document Link first.');
    if(b.finalDocLink && !isUrl(b.finalDocLink)) problems.push('The Final PPT / Supporting Document Link must be a full URL (starting with http:// or https://).');
    if(problems.length){ state.editError = problems.join('\n'); render(); return; }
    if(!state.isSysAdmin) delete b.meetingDate;  // 改周只给 Sourcing admin（服务端同样强制）
    // Server is the authority: it re-runs the same three rules, merges, recomputes rollups and persists.
    saveCaseBtn.disabled = true; // 防双击（两条路径随后都会 render 重建按钮，无需手工恢复）
    try{
      const resp = await API.put('/api/cases/'+encodeURIComponent(c.id), {...b, partNumbers: pnRead.rows});

  // Submit Case
  const submitBtn = document.getElementById('submitCaseBtn');

    function recomputePnTotals(){
      const cur = submitCurrency(), rate = fxRate(cur);
      const totalPeak = Number((document.getElementById('fBundlePeak')||{}).value)||0;
      const totalLife = Number((document.getElementById('fBundleLife')||{}).value)||0;
      // 与服务端一致按除法取整（最终金额以服务端 Decimal 计算为准，这里只是预览）
      const eurPeak = rate ? eurPreview(totalPeak, cur) : 0, eurLife = rate ? eurPreview(totalLife, cur) : 0;
      // 第一行按录入币种，第二行固定欧元对照（领导 2026-09-29：要一眼看到欧元）；没有汇率时对照行提示去设汇率
      const pd = document.getElementById('totalPeakDisplay'); if(pd) pd.textContent = fmtMoney(totalPeak, cur);
      const ld = document.getElementById('totalLifetimeDisplay'); if(ld) ld.textContent = fmtMoney(totalLife, cur);
      const pe = document.getElementById('totalPeakEur'); if(pe) pe.textContent = rate ? fmtMoney(eurPeak,'EUR') : '—';
      const le = document.getElementById('totalLifetimeEur'); if(le) le.textContent = rate ? fmtMoney(eurLife,'EUR') : '—';
      const rl = document.getElementById('bundleEurRate');
      if(rl) rl.textContent = cur==='EUR' ? '' : (rate ? `(1 EUR = ${rate} ${cur})` : `(no ${cur} rate set)`);
      // 超过 3 Mio EUR：BPG 问题从"可不答"变成"必答"
      const bpgHint = document.getElementById('bpgHint');
      if(bpgHint){
        const over = (rate ? eurLife : totalLife) > BPG_THRESHOLD_EUR;
        bpgHint.textContent = over ? 'Lifetime Spend is above 3 Mio EUR — a BPG must be available to register this case.' : '';
        bpgHint.classList.toggle('missing', over);
      }
    }
    ['fBundlePeak','fBundleLife'].forEach(id=>{ const el = document.getElementById(id); if(el) el.oninput = recomputePnTotals; });
    const currencyEl = document.getElementById('fCurrency');
    if(currencyEl) currencyEl.onchange = ()=>{
      const cur = submitCurrency(), hint = fxHintText(cur), el = document.getElementById('fxHint');
      if(el){ el.textContent = hint.text; el.classList.toggle('missing', hint.missing); }
      document.querySelectorAll('.cur-label').forEach(span=>{ span.textContent = cur; });
      // 换币种后，格子里写着别的货币的值要重新判断
      pnGrid.querySelectorAll('.pn-cell').forEach(cell=>validatePnCell(pnGrid, cell));
      refreshPnGrid(pnGrid);
      recomputePnTotals();
    };
  }

  const caseNoEl = document.getElementById('fExistingSwat');

  if(submitBtn) submitBtn.onclick = async ()=>{
    if(submitBtn.disabled) return;

    const banner = document.getElementById('submitBanner');

    const name = val('fSubmitter'), email = val('fSubmitterEmail');
    // v3 Phase-30：零件行从表格读（件价 / 模具费为字符串，服务端按 Decimal 折算；产量整数；留空为 null），缺项与读不准的格子标红
    const pnGrid = checkPnGrid(document.querySelector('[data-pn-grid="submit"]'), {required:true});

    const problems = [];

    const missPn = pnGrid.emptyRows(['partNumber','partDescription']), missRow = pnGrid.emptyRows(ROW_BUNDLE_KEYS);

    if(missRow.length) need('⚠ Please fill in Project, Sourcing Type and Recommended Supplier for every part number row before submitting.'+inRows(missRow));

    if(problems.length){ showError(problems); return; }

    const payload = {

      partNumbers: pnRows,

  // 提交页演示文件：拖拽或选择 → 排队（先在浏览器里检查类型与大小），提交成功后再上传

  const keepEdits = ()=>{ if(state.detailEditMode && state.editBuffer) syncEditBufferFromDom(); };

      const reason = reasonEl ? reasonEl.value.trim() : '';
      if(!reason){ reasonEl.style.borderColor='var(--red)'; reasonEl.placeholder='A reason is required before returning this to the submitter.'; return; }
      const sub = SUBMISSIONS.find(s=>s.subId===id);
      if(!state.isAdmin || !sub || sub.status!=='Waiting for Registration Confirmation') return;
      el.disabled = true; // 防双击：第二击会撞 422 "already processed" 弹红色误报
      try{
        const resp = await API.post('/api/submissions/'+encodeURIComponent(id)+'/reject', {reason});
        applySnapshot(resp.snapshot);
      }catch(err){ el.disabled = false; toast('⚠ '+(err.detail||err.message)); return; }
      render();
      window.scrollTo(0,0);
    };
  });
}
function refreshDbTableOnly(){
  // lightweight re-render preserving focus in search box
  const scrollY = window.scrollY;
  const app = document.getElementById('app');
  const hadFocus = document.activeElement && document.activeElement.id==='dbSearch';
  app.innerHTML = renderDatabase();
  wireEvents();
  if(hadFocus){
    document.getElementById('dbSearch').focus();
    const v = document.getElementById('dbSearch').value;
    document.getElementById('dbSearch').value=v;
    document.getElementById('dbSearch').selectionStart = document.getElementById('dbSearch').selectionEnd = v.length;
  }
  window.scrollTo(0,scrollY);
}

// ---- 周会 Excel 导入（v3 Phase-17）：预览 → 勾选 → 导入；服务端同一周重导会替换上次导入的案例
function refreshImportQueue(){
  const box = document.getElementById('importQueue');
  if(!box) return;
  box.innerHTML = importQueueHtml();
  const lib = document.getElementById('importLibrary');
  if(lib) lib.innerHTML = importLibraryHtml();
  wireEvents();
}
function importUrl(e, commit){
  const params = new URLSearchParams({name: e.name, commit: commit ? 'true' : 'false'});
  if(e.meetingDate) params.set('meetingDate', e.meetingDate);
  if(commit && (state.importSourceUrl||'').trim()) params.set('sourceUrl', state.importSourceUrl.trim());
  return '/api/import/excel?' + params.toString();
}
// 上传的文件走文件字节接口；库里的文件只传相对路径
function importRequest(e, commit){
  if(e.libraryPath) return API.post('/api/import/library', {path: e.libraryPath, commit, sourceUrl: commit ? (state.importSourceUrl||'').trim() : ''});
  return uploadFile(importUrl(e, commit), e.file, {'X-Session-Token': API.sessionToken()});
}
function queueLibraryFiles(paths){
  if(!state.isSysAdmin) return;
  state.importQueue = state.importQueue || [];
  state.importResults = null;
  const fresh = [];
  for(const path of paths){
    const f = (state.importLibrary||[]).find(x=>x.path===path);
    if(!f || state.importQueue.some(e=>e.libraryPath===path && e.status!=='done')) continue;
    const e = {name:f.name, libraryPath:path, status:'checking', include:true, meetingDate:'', preview:null, error:''};
    state.importQueue.push(e); fresh.push(e);
  }
  refreshImportQueue();
  fresh.forEach(previewImportFile);
}
async function previewImportFile(e){
  e.status = 'checking'; e.error = ''; refreshImportQueue();
  try{
    e.preview = await importRequest(e, false);
    e.status = 'ready'; e.needsDate = false;
    if(e.include===undefined) e.include = true;
  }catch(err){
    e.status = 'error'; e.error = err.detail || err.message;
    e.needsDate = /meeting date/i.test(e.error);
  }
  refreshImportQueue();
}
function queueImportFiles(files){
  if(!state.isSysAdmin) return;
  state.importQueue = state.importQueue || [];
  state.importResults = null;
  const fresh = [];
  for(const f of files){
    if(!/\.xlsx$/i.test(f.name)){ toast(`${f.name}: only .xlsx workbooks can be imported.`); continue; }
    if(state.importQueue.some(e=>e.name===f.name && e.status!=='done')) continue;
    const e = {name:f.name, file:f, status:'checking', include:true, meetingDate:'', preview:null, error:''};
    state.importQueue.push(e); fresh.push(e);
  }
  refreshImportQueue();
  fresh.forEach(previewImportFile);
}
async function runImport(){
  const todo = (state.importQueue||[]).filter(e=>e.status==='ready' && e.include);
  if(!todo.length || state.importing) return;
  state.importing = true; refreshImportQueue();
  let added = 0, replaced = 0, failed = 0, snapshot = null;
  for(const e of todo){
    try{
      const resp = await importRequest(e, true);
      e.status = 'done'; e.result = resp; added += resp.added||0; replaced += resp.replaces||0; snapshot = resp.snapshot || snapshot;
      if(e.libraryPath && state.importLibrary){ const f = state.importLibrary.find(x=>x.path===e.libraryPath); if(f) f.imported = true; }
    }catch(err){ e.status = 'error'; e.error = err.detail || err.message; failed++; }
    refreshImportQueue();
  }
  state.importing = false;
  if(snapshot) applySnapshot(snapshot);
  state.importResults = `✓ ${added} case${added===1?'':'s'} imported from ${todo.length - failed} file${todo.length-failed===1?'':'s'}${replaced?`, ${replaced} earlier import${replaced===1?'':'s'} replaced`:''}${failed?`; ${failed} file${failed===1?'':'s'} failed — see the list`:''}. Open Database to review them.`;
  render(); window.scrollTo(0,0);
}

// Startup: load the shared state from the server, then render. The daily reminder check
// runs server-side (on startup and hourly); this page only refreshes the snapshot hourly,
// skipping the re-render while a form, editor or confirm panel is in use so nothing typed gets wiped.
(async function init(){
  // 登录状态由 bootstrap 的 currentUser 恢复；清掉共享口令时代留在本标签页的旧令牌
  try{ sessionStorage.removeItem('sc_admin_token'); }catch(e){}
  setCurrentUser(null);
  try{ applySnapshot(await API.get('/api/bootstrap')); setNetStatus(true); }catch(e){ setNetStatus(false); /* server unreachable — empty state, banner shown */ }
  if(!openFromHash()) render();
  setInterval(async ()=>{
    if(!canRefresh()) return;
    const version = API.writeVersion;
    try{
      const j = await API.get('/api/bootstrap');
      setNetStatus(true);
      if(canRefresh() && version===API.writeVersion){ applySnapshot(j); render(); }
    }catch(e){ setNetStatus(false); }
  }, 60*60*1000);
})();
// Direct case links (e.g. from a reminder): #case/SWAT-12345
function openFromHash(){
  const m = /^#case\/(.+)$/.exec(location.hash||'');
  if(!m) return false;
  let id;
  try{ id = decodeURIComponent(m[1]); }catch(e){ toast('This case link is invalid.'); return false; }
  if(!ALL_CASES.some(c=>c.swatId===id)){ toast('This case is unavailable or has been deleted.'); return false; }
  goToDetail(id);
  return true;
}
window.addEventListener('hashchange', openFromHash);
document.getElementById('app').addEventListener('input', ()=>{ state.formDirty = true; });
document.getElementById('app').addEventListener('change', ()=>{ state.formDirty = true; });
</script>
