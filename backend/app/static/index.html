// v3 Phase-26（用户）：顶部导航按功能分组，点组名进入组内页面，组内各页列在左侧侧边栏。
// 案例详情页不显示侧边栏，顶部高亮 Data（案例记录属于 Database）。
const NAV_GROUPS = {
  workflow:{label:'Case Workflow', items:[
    ['submit','Submit Case','Register a case for the weekly committee'],
    ['approvals','Approval','Confirm or return registrations'],
    ['followups','Follow-ups','Track the actions decided in the meeting']]},
  data:{label:'Data', items:[
    ['database','Database','Every case, with filters and exports'],
    ['dashboard','Dashboard','Status and statistics by year or week']]},
};
// 线条图标：14px，颜色跟随文字（currentColor）
const svgIcon = d=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS = {
  table: svgIcon('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/>'),
  chart: svgIcon('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  download: svgIcon('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'),
  sheet: svgIcon('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
};
const NAV_ICONS = {database:ICONS.table, dashboard:ICONS.chart};
const navLastView = {workflow:'submit', data:'database'};
// 侧边栏收起为窄条：每台电脑自己的偏好，存浏览器本地（读不到就默认展开）
let navCollapsed = false;
try{ navCollapsed = localStorage.getItem('sc_nav_collapsed')==='1'; }catch(e){}
// 侧边栏每项下面的一行实时状态（数据，不是说明）：哪里有事要处理一眼可见
function navMeta(view, pendingCount){
  if(view==='submit'){
    const next = getEarliestSelectableWednesday(), cut = registrationCutoffFor(next);
    const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][cut.getDay()];
    return `KW${String(dateToWeekNum(next)).padStart(2,'0')} · by ${day} ${REGISTRATION_SETTINGS.cutoffTime||'23:59'}`;  // 最近能登记的会议与截止时间
  }
  if(view==='approvals') return pendingCount>0 ? `${pendingCount} waiting` : 'Nothing waiting';
  if(view==='followups'){
    const tasks = latestByCase().flatMap(c=>c.followUps||[]);
    const open = tasks.filter(t=>t.status==='Open').length, overdue = tasks.filter(t=>t.status==='Overdue').length;
    if(!open && !overdue) return 'No open tasks';
    return [open ? `${open} open` : '', overdue ? `<span class="sn-warn">${overdue} overdue</span>` : ''].filter(Boolean).join(' · ');
  }
  if(view==='database') return `${ALL_CASES.length} case${ALL_CASES.length===1?'':'s'}`;
  if(view==='dashboard'){ const years = yearsPresent(); return `${state.dashYear || years[years.length-1] || weekYear()} overview`; }  // 还没打开过 Dashboard 时按它的默认年份
  return '';
}  // 回到某组时打开上次看的那页
// 字段说明用小号：fieldTip('…') 放在 <label> 里字段名后面
const fieldTip = html=>infoTip(html, 'sm');
// 板块说明收进 ⓘ：悬停或 Tab 聚焦时弹出（手机上点一下即聚焦）；读屏软件从 aria-label 读到同样的文字
function infoTip(html, size=''){
  const text = html.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  return `<span class="info-tip ${size}" tabindex="0" role="note" aria-label="${escapeAttr(text)}"><span class="info-i" aria-hidden="true">i</span><span class="info-pop" aria-hidden="true">${html}</span></span>`;
}
// 弹框默认从 ⓘ 左侧展开；靠近窗口边缘时（如 Dashboard 导出按钮旁、手机窄屏）左右平移，整个弹框留在窗口内
function placeInfoPop(tip){
  const pop = tip?.querySelector('.info-pop');
  if(!pop) return;
  const tipLeft = tip.getBoundingClientRect().left;
  const left = Math.max(8, Math.min(tipLeft - 10, window.innerWidth - 8 - pop.offsetWidth));
  pop.style.left = (left - tipLeft) + 'px';
}
document.addEventListener('mouseover', e=>placeInfoPop(e.target.closest?.('.info-tip')));
document.addEventListener('focusin', e=>placeInfoPop(e.target.closest?.('.info-tip')));
function navGroupOf(view){
  if(view==='detail') return 'data';
  return Object.keys(NAV_GROUPS).find(g=>NAV_GROUPS[g].items.some(([k])=>k===view)) || null;
}
function groupLanding(group, pendingCount){
  // 有待审登记时，能审批的人点 Case Workflow 直接到 Approval
  if(group==='workflow' && state.isAdmin && pendingCount>0) return 'approvals';
  return navLastView[group];
}
// v3 Phase-27：删除案例会一并删掉的附件数（与服务端 logic.case_attachments 同口径），用于删除确认文案
function caseAttachmentCount(swat){
  const ids = new Set();
  const add = list=>(list||[]).forEach(f=>f && f.id && ids.add(f.id));
  ALL_CASES.filter(c=>c.swatId===swat).forEach(c=>{ add(c.files); (c.followUps||[]).forEach(t=>(t.feedback||[]).forEach(fb=>add(fb.files))); });
  SUBMISSIONS.filter(s=>s.approvedSwatId===swat).forEach(s=>add(s.files));
  return ids.size;
}
function goToView(view){
  const changed = state.view!==view;
  state.view=view; state.dashFilter=null; state.pendingDeleteId=null; state.feedbackOpenId=null; state.decisionOpenId=null;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  render();
  if(changed) window.scrollTo(0,0);
}
function renderNav(){
  const pendingCount = SUBMISSIONS.filter(s=>s.status==='Waiting for Registration Confirmation').length;
  const group = navGroupOf(state.view);
  if(group && state.view!=='detail') navLastView[group] = state.view;
  const badge = g=>g==='workflow'&&pendingCount>0 ? `<span class="count-badge" title="${pendingCount} waiting for confirmation">${pendingCount}</span>` : '';
  const groupBtn = g=>`<button data-nav-group="${g}" class="${group===g?'active':''}">${NAV_GROUPS[g].label}${badge(g)}</button>`;
  document.getElementById('navtabs').innerHTML =
    `<button data-nav="home" class="${state.view==='home'?'active':''}">Home</button>${groupBtn('workflow')}${groupBtn('data')}`
    + (state.isSysAdmin ? `<button data-nav="accounts" class="${state.view==='accounts'?'active':''}">Accounts</button>` : '');
  const side = document.getElementById('sidenav');
  side.hidden = !group || state.view==='detail';
  if(!side.hidden){
    side.setAttribute('aria-label', NAV_GROUPS[group].label);
    side.classList.toggle('is-sequence', group==='workflow');  // 只有流程组画步骤连线
    side.classList.toggle('is-collapsed', navCollapsed);
    side.innerHTML = `<div class="sn-title">${NAV_GROUPS[group].label}</div>` + NAV_GROUPS[group].items.map(([k,l,hint],i)=>{
      const count = k==='approvals' && pendingCount>0 ? `<span class="count-badge" title="${pendingCount} waiting for confirmation">${pendingCount}</span>` : '';
      const node = group==='workflow' ? i+1 : NAV_ICONS[k];
      const meta = navMeta(k, pendingCount);
      // 说明不常驻（用户：板块描述要精简），悬停时以提示框显示；收起时提示框带上名称与状态
      const tip = navCollapsed ? `${l} — ${meta.replace(/<[^>]*>/g,'')}` : hint;
      return `<button data-nav="${k}" class="${state.view===k?'active':''}" title="${escapeAttr(tip)}" ${state.view===k?'aria-current="page"':''}><span class="sn-node" aria-hidden="true">${node}</span><span class="sn-text"><span class="sn-label">${l}${count}</span><span class="sn-meta">${meta}</span></span></button>`;
    }).join('') + `<button type="button" class="sn-collapse" id="navCollapse" aria-expanded="${!navCollapsed}" title="${navCollapsed?'Expand the sidebar':'Collapse the sidebar'}">${svgIcon(navCollapsed?'<path d="M9 6l6 6-6 6"/>':'<path d="M15 6l-6 6 6 6"/>')}<span>Collapse</span></button>`;
    document.getElementById('navCollapse').onclick = ()=>{
      navCollapsed = !navCollapsed;
      try{ localStorage.setItem('sc_nav_collapsed', navCollapsed ? '1' : ''); }catch(e){}
      renderNav();
      document.getElementById('navCollapse')?.focus({preventScroll:true});
    };
  } else side.innerHTML = '';
  const nt = document.getElementById('navtabs');
  wireNavPan(nt);
  requestAnimationFrame(()=>revealNavButton(nt.querySelector('.active')));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    goToView(b.dataset.nav);
    document.querySelector('[data-nav="'+state.view+'"]')?.focus({preventScroll:true});
  });
  nt.querySelectorAll('[data-nav-group]').forEach(b=>b.onclick=()=>{
    goToView(groupLanding(b.dataset.navGroup, pendingCount));
    document.querySelector(`[data-nav-group="${b.dataset.navGroup}"]`)?.focus({preventScroll:true});
  });
  const at = document.getElementById('adminToggle');
  if(at){
    at.textContent = state.user ? `${state.user.name} · ${state.user.roleLabel||state.user.role}` : 'Log in / Register';
    at.classList.toggle('on', state.isAdmin);
    at.onclick = ()=>{
      if(document.getElementById('adminLoginPanel')){ if(!(state.user && state.user.mustChangePassword)) hideAdminLogin(); return; }
      showAdminLogin();
    };
    if(state.adminLoginOpen && !document.getElementById('adminLoginPanel')) showAdminLogin();
  }
}

// v3 Phase-17：周会 Excel 导入队列（管理员）。每个文件先预览（不写库），勾选后一次导入；文件名猜不出会议日期的要手填
function importQueueHtml(){

  const rows = q.map((e,i)=>{
    const status = e.status==='checking' ? '<span class="fmeta">Checking…</span>'

      : `<span class="fmeta">${esc(e.preview.meetingYear)}-KW${String(e.preview.weekNum).padStart(2,'0')} · ${esc(e.preview.meetingDateLabel)} · ${e.preview.cases} case${e.preview.cases===1?'':'s'}, ${e.preview.rows} part row${e.preview.rows===1?'':'s'}${e.preview.replaces?` · replaces ${e.preview.replaces} imported before`:''}${e.preview.warnings.length?` · <button type="button" class="link-btn" data-import-warn="${i}">${e.preview.warnings.length} note${e.preview.warnings.length===1?'':'s'}</button>`:''}</span>`;
    const dateField = (e.needsDate || e.meetingDate) && e.status!=='done'

// Database 表排序（v3 Phase-18，领导：所有列表头都要能排序）。默认仍是周 / 案例号倒序。
const DB_SORT_KEYS = {
  week: c=>weekKey(c)*1000 + Number(c.caseNumber||0),
  date: c=>c.meetingDateISO || '',
  caseNumber: c=>Number(c.caseNumber||0),
  swat: c=>c.swatId||'', pn: c=>c.partNumber||'', project: c=>c.project||'',
  cluster: c=>(c.cluster||'')+' '+(c.commodity||''),
  supplier: c=>c.recommendedSupplier||'', presenter: c=>c.presenter||'', level: c=>c.decisionLevel||'',
  spend: c=>Number(c.peakYearSpend||0), decision: c=>c.meetingDecision||'',
  action: c=>c.meetingDecision==='PENDING' ? '' : (c.actionStatus||'No action'),
};
const levelRank = c => { const i = DECISION_LEVELS.indexOf(c.decisionLevel); return i<0 ? DECISION_LEVELS.length : i; };
// 多区域案例（"EU + NA"）按勾选里最靠前的地区归组，与服务端 exports._region_rank 一致
const regionRank = c => Math.min(REGIONS.length, ...String(c.region||'').split('+').map(r=>REGIONS.indexOf(r.trim())).filter(i=>i>=0));
function sortDbRows(rows){
  const {key, dir} = state.dbSort;
  const keyFn = DB_SORT_KEYS[key] || DB_SORT_KEYS.week, sign = dir==='asc' ? 1 : -1;
  // v3 Phase-28：按周排时，每周内 L2 → L3 → L4 → 未填、同级 AP → EU → NA（不论升降序），和导出的 Agenda / MM 一致
  if(!DB_SORT_KEYS[key] || key==='week'){
    return rows.sort((a,b)=>sign*(weekKey(a)-weekKey(b)) || (levelRank(a)-levelRank(b)) || (regionRank(a)-regionRank(b))
      || sign*(Number(a.caseNumber||0)-Number(b.caseNumber||0)));
  }
  return rows.sort((a,b)=>{
    const ka = keyFn(a), kb = keyFn(b);
    const cmp = (typeof ka==='number' && typeof kb==='number') ? ka-kb : String(ka).localeCompare(String(kb), undefined, {numeric:true, sensitivity:'base'});
    return sign*cmp || (weekKey(b)-weekKey(a)) || (b.caseNumber-a.caseNumber);
  });
}

// HTML-escape free-text data before it lands in innerHTML template strings (escapes & and <,
// which is enough to prevent element/textarea breakout). Apply to every user-entered value.
function esc(v){ return (v===null||v===undefined) ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function isHttpUrl(value){
  if(typeof value!=='string' || !/^https?:\/\/\S+$/i.test(value)) return false;
  try{ const url = new URL(value); return (url.protocol==='http:' || url.protocol==='https:') && !!url.hostname; }catch(e){ return false; }
}

/* ---- CSV export (replaces the old cumulative weekly-Excel habit) ---- */
// Excel formula-injection guard: a cell starting with = + - @ (or tab/CR) would be evaluated
// when the file is opened in Excel — prefix a ' so it stays text. Pure numbers are left alone.
// Used by both exports (CSV and the HTML-based .xls agenda).
function formulaGuard(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  return (/^[\t\r\n]/.test(s) || (/^\s*[=+\-@]/.test(s) && !Number.isFinite(Number(s)))) ? "'"+s : s;
}
function csvEscape(v){
  return '"' + formulaGuard(v).replace(/"/g,'""') + '"';
}
async function saveBlobFile(blob, filename){
  // Published-artifact runtime: offer the file via the platform's downloads capability.
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{ await downloads.save({filename, data:blob}); return; }
        catch(err){ /* viewer declined, or unavailable — fall through to the direct method below */ }
      }
    }catch(err){ /* capability not obtainable — fall through */ }
  }
  // Plain-HTML fallback (works when this file is opened directly, outside the Artifact runtime).
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function downloadCasesCsv(rows, filename){
  const anyDecided = rows.some(c=>c.meetingDecision!=='PENDING');
  const headers = ['Week','Case #','SWAT Case Number','Part Number(s)','Part Description(s)','Region','Project','Product Family','Cluster','Commodity',
    'Parent PF','Part Family Code','Sourcing Type','Recommended Supplier','Presenter','Decision Level',
    'Bundle Peak Year Spend','Bundle Lifetime Spend','Spend Currency','Pc Price CQA','Supplier Price (landed)','Tooling CQA','Supplier Tooling Cost','Average Volume','Lifetime Volume','Tooling Payment',
    'BPG available','FRA available','Sourcing Decision','Case Comments'].concat(anyDecided ? ['Action Status','Open Follow-up Tasks'] : []);
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(c=>{
    const pending = c.meetingDecision==='PENDING';
    const tasksSummary = pending ? '' : ((c.followUps||[]).map(t=>`${t.task} [${ownerLabel(t)}, due ${t.dueDate}, ${t.status}]`).join(' | ') || 'No action');
    const pnLines = partNumberLines(c);
    const pnSummary = pnLines.map(p=>p.partNumber).join(' | ');
    // 项目 / 类型 / 供应商按零件行（v3 Phase-15）；旧多零件案例的行上没有就用案例级值
    const pdSummary = pnLines.map(p=>`${p.partNumber}: ${p.partDescription} [${p.project||c.project} / ${p.sourcingType||c.sourcingType} / ${p.recommendedSupplier||c.recommendedSupplier}]`).join(' | ');
    const perRow = k => pnLines.map(p=>p[k]??'').join(' | ');  // 件价 / 模具费 / 产量按零件行，多行用 " | " 分隔
    lines.push([caseWeekLabel(c),c.caseNumber,c.swatId,pnSummary,pdSummary,c.region,c.project,c.family,c.cluster,c.commodity||'',
      c.parentPF,c.partFamilyCode,c.sourcingType,c.recommendedSupplier,c.presenter,c.decisionLevel,
      c.peakYearSpend,c.lifetimeSpend,spendCurrency(c),perRow('pcPriceCQA'),perRow('supplierPriceLanded'),perRow('toolingCQA'),perRow('supplierToolingCost'),perRow('averageVolume'),perRow('lifetimeVolume'),c.toolingPayment||'',
      c.bpgAvailable||'',c.fraAvailable||'',c.meetingDecision,c.submitterComments||''
    ].concat(anyDecided ? [(pending?'':(c.actionStatus===null?'No action':c.actionStatus)), tasksSummary] : []).map(csvEscape).join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'}); // BOM: Windows Excel opens UTF-8 CSV correctly
  await saveBlobFile(blob, filename);
}

// 议程 / 纪要导出（v3 Phase-4）：服务端用 openpyxl 生成真正的 .xlsx，这里只负责下载。
// selection = {week} 走 Dashboard 的按周接口；{ids} 走 Database 页的按筛选结果接口（同一版式）
async function downloadExport(kind, selection){
  const headers = API.sessionToken() ? {'X-Session-Token': API.sessionToken()} : {};
  const resp = selection.ids
    ? await fetch(`/api/exports/${kind}`, {method:'POST', headers:{...headers, 'Content-Type':'application/json'}, body: JSON.stringify({ids: selection.ids})})
    : await fetch(`/api/exports/${kind}?week=${encodeURIComponent(selection.week)}${selection.year ? `&year=${encodeURIComponent(selection.year)}` : ''}`, {headers});
  if(!resp.ok){
    let detail = resp.statusText;
    try{ const j = await resp.json(); detail = typeof j.detail==='string' ? j.detail : detail; }catch(e){}
    throw new Error(detail);
  }
  const m = /filename="([^"]+)"/.exec(resp.headers.get('content-disposition')||'');
  const filename = m ? m[1] : `${selection.ids ? '' : `KW${String(selection.week).padStart(2,'0')} ${selection.year||weekYear()}_`}SBS Sourcing Alignment Committee_${kind==='agenda'?'Agenda':'MM'}.xlsx`;
  await saveBlobFile(await resp.blob(), filename);
}

function bindExportButton(id, kind, selectionFn){
  const btn = document.getElementById(id);
  if(btn) btn.onclick = async ()=>{
    if(btn.disabled) return;
    btn.disabled = true;
    try{ await downloadExport(kind, selectionFn()); }
    catch(err){ toast('⚠ Export failed: '+(err.message||err)); }
    btn.disabled = false;

// v3 Phase-18：驾驶舱按年份选（领导：去掉 YTD，可以选 2025 / 2026）；周视图只列所选年份的周
function dashScope(){
  const years = yearsPresent();
  if(!years.includes(state.dashYear)) state.dashYear = years.length ? years[years.length-1] : weekYear();
  const yearCases = ALL_CASES.filter(c=>caseYear(c)===state.dashYear);
  const allWeeks = uniq(yearCases.map(c=>c.weekNum)).sort((a,b)=>a-b);
  if(!allWeeks.includes(state.dashWeek)) state.dashWeek = allWeeks[allWeeks.length-1] ?? dateToWeekNum(getNATime());
  // period-scoped case set:
  //  - By Year: current state of every unique case seen that year (one row per SWAT ID, its latest appearance in the year)
  //  - By Week: every case actually on the agenda in the selected week (row-level, not deduped)
  const periodCases = state.dashPeriod==='week' ? yearCases.filter(c=>c.weekNum===state.dashWeek) : latestByCase(yearCases);
  return {years, yearCases, allWeeks, periodCases, label: state.dashPeriod==='week' ? wk(state.dashWeek, state.dashYear) : String(state.dashYear)};
}
function renderDashboard(){
  const {years, yearCases, allWeeks, periodCases, label} = dashScope();

  const totalCount = periodCases.length;
  const approved = periodCases.filter(c=>c.meetingDecision==='APPROVED').length;
  const rejected = periodCases.filter(c=>c.meetingDecision==='REJECTED').length;
  const conditional = periodCases.filter(c=>c.meetingDecision==='CONDITIONAL APPROVAL').length;
  const pending = periodCases.filter(c=>c.meetingDecision==='PENDING').length;
  // 行动状态数真实的待办（领导：没有待办就是 0，不把"已决议但没待办"的案例算成 Closed）
  const tasks = decidedTasks(periodCases);
  const openTasks = tasks.filter(x=>x.t.status==='Open'), overdueTasks = tasks.filter(x=>x.t.status==='Overdue');
  const openA = openTasks.length, overdueA = overdueTasks.length, closedA = tasks.filter(x=>x.t.status==='Closed').length;
  const ownerKey = x => ownerLabel(x.t) || '—';
  const functionKey = x => x.t.ownerFunction || 'Function not set';
  const chart = (title, items, keyFn, empty) => {
    const rows = countBy(items, keyFn), max = Math.max(1, ...rows.map(r=>r[1]));
    return `<div class="card breakdown-card"><h4>${title}</h4>${rows.length ? rows.map(([k,v])=>barRow(k,v,max)).join('') : `<div class="breakdown-note" style="margin-top:0;">${empty}</div>`}</div>`;
  };

  // Cluster / commodity / region breakdowns: current state of the cases seen in the selected year
  const latest = latestByCase(yearCases);
  const byCluster = {}; latest.forEach(c=>{ byCluster[c.cluster||'—']=(byCluster[c.cluster||'—']||0)+1; });
  const byCommodity = {}; latest.forEach(c=>{ const k = c.commodity||c.cluster||'—'; byCommodity[k]=(byCommodity[k]||0)+1; });
  const byRegion = {}; latest.forEach(c=>{ const rs = regionList(c); (rs.length ? rs : ['—']).forEach(r=>{ byRegion[r]=(byRegion[r]||0)+1; }); });
  const multiRegion = latest.some(c=>regionList(c).length>1);
  const maxC = Math.max(1, ...Object.values(byCluster));
  const maxCo = Math.max(1, ...Object.values(byCommodity));
  const maxR = Math.max(1, ...Object.values(byRegion));

  return `
  <div class="pagehead">
    <h1>Management Cockpit</h1>${infoTip(`Status across all sourcing cases. Pick a year, then switch between the whole year and a single week's committee agenda. Click any number to see the underlying cases or actions.`)}
  </div>

  <div class="card" style="padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span style="font-size:12.5px;color:var(--ink-soft);font-weight:600;">Total Cases</span>
    <span style="font-size:22px;font-weight:700;">${totalCount}</span>
    <select class="dash-year-select" id="dashYearSelect" style="margin-left:auto;" aria-label="Year">${years.map(y=>`<option value="${y}" ${y===state.dashYear?'selected':''}>${y}</option>`).join('')}</select>
    <div class="period-toggle">
      <button data-period="year" class="${state.dashPeriod==='year'?'active':''}">Whole year</button>
      <button data-period="week" class="${state.dashPeriod==='week'?'active':''}">By Week</button>
    </div>
    ${state.dashPeriod==='week' ? `<select class="period-week-select" id="dashWeekSelect">${allWeeks.map(w=>`<option value="${w}" ${w===state.dashWeek?'selected':''}>${wk(w, state.dashYear)} — ${weekDateOf(w, state.dashYear)}</option>`).join('')}</select>` : ''}
    <button class="btn-tool" id="dashExportBtn">${ICONS.download}Export CSV (this scope)</button>
    ${state.dashPeriod==='week' ? `<span class="export-group"><button class="btn-tool" id="dashAgendaBtn">${ICONS.sheet}Export Agenda (.xlsx)</button><button class="btn-tool" id="dashMinutesBtn">${ICONS.sheet}Export Meeting Minutes (.xlsx)</button>${infoTip(`"Agenda" is the pre-meeting file: one row per case of ${esc(label)} with the commercial data, no decisions. "Meeting Minutes" is the post-meeting file: the same cases with Sourcing Decision, discussion and action status, plus an "Actions" sheet listing every follow-up task (owner, category, due date). Both open as real Excel workbooks.`)}</span>` : ''}
  </div>
  <div class="breakdown-row-title">Approval Status · ${esc(label)} — 4 states</div>
  <div class="tile-row four">
    ${tile('Approved', approved, 'g', 'approved')}
    ${tile('Rejected', rejected, rejected>0?'r':'g', 'rejected')}
    ${tile('Conditional Approval', conditional, 'y', 'conditional')}
    ${tile('Pending', pending, 'y', 'pending')}
  </div>

  <div class="breakdown-row-title">Action Status · ${esc(label)} — ${tasks.length} follow-up action${tasks.length===1?'':'s'}${infoTip('Follow-up actions of the decided cases; Pending cases have no actions yet. Each action is counted once by its own status: an action past its due date is Overdue, not Open, so the three numbers add up to the total.')}</div>
  <div class="tile-row three">
    ${tile('Open', openA, 'y', 'open')}
    ${tile('Overdue', overdueA, overdueA>0?'r':'g', 'overdue')}
    ${tile('Closed', closedA, 'g', 'closedaction')}
  </div>

  <div class="breakdown-grid" style="margin-top:18px;">
    ${chart('Open actions by function', openTasks, functionKey, 'No open actions in this scope.')}
    ${chart('Overdue actions by function', overdueTasks, functionKey, 'No overdue actions in this scope.')}
    ${chart('Open actions by owner', openTasks, ownerKey, 'No open actions in this scope.')}
    ${chart('Overdue actions by owner', overdueTasks, ownerKey, 'No overdue actions in this scope.')}
  </div>

  <div class="breakdown-grid" style="margin-top:16px;">
    <div class="card breakdown-card">
      <h4>Cases by Cluster · ${esc(String(state.dashYear))}</h4>
      ${Object.entries(byCluster).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,maxC)).join('')}
    </div>
    <div class="card breakdown-card">
      <h4>Cases by Region · ${esc(String(state.dashYear))}${multiRegion ? infoTip('A case covering several regions is counted once in each, so the bars can add up to more than the total.') : ''}</h4>
      ${Object.entries(byRegion).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,maxR)).join('')}
    </div>
    <div class="card breakdown-card" style="grid-column:1 / -1;">
      <h4>Cases by Commodity · ${esc(String(state.dashYear))}</h4>
      <div class="commodity-grid">${Object.entries(byCommodity).sort((a,b)=>b[1]-a[1]).map(([k,v])=>barRow(k,v,maxCo)).join('')}</div>
    </div>
  </div>
  ${state.isSysAdmin ? renderFxCard() + renderRegistrationCard() : ''}
  `;
}

function deliveryBadge(part){
  if(!part) return '';
  if(part==='sent') return '<span style="color:var(--green);font-weight:600;">✓ sent</span>';
  if(part==='skipped') return '<span style="color:var(--ink-faint);">— skipped</span>';
  return `<span style="color:var(--red);font-weight:600;" title="${escapeAttr(part)}">✗ failed</span>`;
}
function deliveryCell(d){
  if(!d || (!d.email && !d.teams)) return '<span style="color:var(--ink-faint);">—</span>';
  const parts = [];
  if('email' in d) parts.push('Email ' + deliveryBadge(d.email));
  if('teams' in d) parts.push('Teams ' + deliveryBadge(d.teams));
  return parts.join('<br/>');
}

// 自动提醒日志的一行对应哪条待办：新记录带 taskId，旧记录按案例号 + 任务原文找
function logTask(e){
  const c = latestByCase().find(x=>x.swatId===e.swatId);
  return c ? (c.followUps||[]).find(t=> e.taskId ? t.id===e.taskId : t.task===e.task) || null : null;
}
function renderFollowups(){
  const latest = latestByCase();
  // Flatten: one row per TASK (a case can carry several). Default: Open + Overdue; the Dashboard tiles open Closed too (v3 Phase-18).
  const statusOk = t => state.followupStatus==='all' ? true : state.followupStatus==='active' ? (t.status==='Open'||t.status==='Overdue') : t.status===state.followupStatus;
  let items = [];
  latest.forEach(c=>{
    if(state.followupYear && String(caseYear(c))!==String(state.followupYear)) return;
    (c.followUps||[]).forEach(t=>{ if(statusOk(t)) items.push({c, t}); });
  });

  // 分类由关键词自动判定（v3 Phase-18）；没命中任何分类的归 "Uncategorized"
  const catsOf = t => { const cats = taskCategories(t); return cats.length ? cats : ['Uncategorized']; };
  const tagOpts = [...ACTION_CATEGORIES, 'Uncategorized'];
  // 负责人 / 职能选项取自全部待办（不随状态筛选变化），否则切到 Closed 时筛选框会消失、选中的值卡住
  const allTasks = latest.flatMap(c=>c.followUps||[]);
  const ownerOpts = uniq(allTasks.map(ownerLabel)).filter(Boolean).sort();
  const functionOpts = uniq(allTasks.map(t=>t.ownerFunction||'')).filter(Boolean).sort();
  const yearOpts = yearsPresent();

  if(state.followupTag) items = items.filter(x=> catsOf(x.t).includes(state.followupTag));
  if(state.followupOwner) items = items.filter(x=> ownerLabel(x.t)===state.followupOwner);
  if(state.followupFunction) items = items.filter(x=> (x.t.ownerFunction||'')===state.followupFunction);

  items.sort((a,b)=>{
    const da = a.t.dueDate==='—' ? '9999-99-99' : a.t.dueDate;
    const db = b.t.dueDate==='—' ? '9999-99-99' : b.t.dueDate;
    return state.followupSortDir==='asc' ? da.localeCompare(db) : db.localeCompare(da);
  });

  const overdueCount = items.filter(x=>x.t.status==='Overdue').length;
  const pendingFeedback = items.reduce((n,x)=> n + (x.t.feedback||[]).filter(f=>f.status==='pending').length, 0);

  return `
  <div class="pagehead">
    <h1>Follow-ups to Track</h1>${infoTip(`Every follow-up task across all cases — a case can carry more than one — with owner, function, due date and category, so nothing gets missed before the next meeting. Categories are derived automatically from the task text and tags: ${ACTION_CATEGORIES.join(' · ')}.`)}
  </div>

  <div class="filters-bar">
    <select id="fFollowupStatus">${[['active','Status: Open + Overdue'],['Open','Open'],['Overdue','Overdue'],['Closed','Closed'],['all','Status: All']].map(([v,l])=>`<option value="${v}" ${state.followupStatus===v?'selected':''}>${l}</option>`).join('')}</select>
    <select id="fFollowupYear"><option value="">Year: All</option>${yearOpts.map(y=>`<option value="${y}" ${String(state.followupYear)===String(y)?'selected':''}>${y}</option>`).join('')}</select>
    <select id="fFollowupTag"><option value="">Category: All</option>${tagOpts.map(c=>`<option ${state.followupTag===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    ${(functionOpts.length || state.followupFunction) ? `<select id="fFollowupFunction"><option value="">Function: All</option>${uniq([...functionOpts, state.followupFunction]).filter(Boolean).map(o=>`<option ${state.followupFunction===o?'selected':''}>${esc(o)}</option>`).join('')}</select>` : ''}
    <select id="fFollowupOwner"><option value="">Owner: All</option>${ownerOpts.map(o=>`<option ${state.followupOwner===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <div class="resultcount">${items.length} ${state.followupStatus==='active'?'open ':''}task${items.length!==1?'s':''}${overdueCount>0?` · <span style="color:var(--red);font-weight:600;">${overdueCount} overdue</span>`:''}${pendingFeedback>0?` · <span style="color:var(--amber);font-weight:600;">${pendingFeedback} feedback to approve</span>`:''}</div>
  </div>

  <div class="card" style="overflow-x:auto;">
    ${items.length===0 ? emptyState() : `
    <table class="data-table">
      <thead><tr>
        <th>SWAT Case</th><th>Category</th><th>Task</th><th>Owner / Function</th><th>Reminder goes to</th>
        <th class="sortable-th" id="sortDueTh">Due Date <span class="arrow">${state.followupSortDir==='asc'?'▲':'▼'}</span></th>
        <th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${items.map(({c,t})=>{
          const overdue = t.status==='Overdue';
          const rc = taskRecipient(t);
          const open = state.remindOpenId===t.id;
          const last = t.lastReminder;
          const fbOpen = state.feedbackRowId===t.id, fbPending = (t.feedback||[]).filter(f=>f.status==='pending').length;
          const editOpen = state.followupEditId===t.id;
          return `<tr data-task-row="${escapeAttr(t.id)}">
            <td class="mono swat" style="cursor:pointer;" data-swat-link="${escapeAttr(c.swatId)}">${esc(c.swatId)}</td>

const PN_GRID_MAX_ROWS = 50;  // 与服务端 schemas.PartNumbers 的上限一致
const PN_CURRENCY_WORDS = {eur:'EUR', euro:'EUR', euros:'EUR', '€':'EUR', usd:'USD', 'us$':'USD', '$':'USD', cny:'CNY', rmb:'CNY', yuan:'CNY', '¥':'CNY'};
const PN_CURRENCY_RE = 'us\\$|euros?|eur|usd|cny|rmb|yuan|[€$¥]';

const pnOneLine = s=>String(s??'').replace(/\s*\n\s*/g,' ').trim();
function pnColumnForHeader(text){

// 与导入器 excel_import.normalize_type 同一规则；认不出返回 null
function normalizeSourcingType(text){
  const t = pnOneLine(text).toLowerCase().replace(/-/g,' ');
  if(!t) return '';
  if(t.includes('gcs')) return 'GCS';
  if(/carry|\bc\/o\b|\bco\b/.test(t)) return 'C/O';
  if(t.includes('new') || t.includes('family')) return 'New';
  return null;
}
// Excel 复制出来是制表符分隔；带换行、制表符或引号的格子用双引号包起来，"" 表示一个引号
function parseClipboardTable(text){
  const s = String(text||'').replace(/\r\n?/g,'\n'), rows = [];
  let row = [], cell = '', quoted = false;
  for(let i=0; i<s.length; i++){
    const ch = s[i];
    if(quoted){
      if(ch==='"' && s[i+1]==='"'){ cell += '"'; i++; }
      else if(ch==='"') quoted = false;
      else cell += ch;
    }
    else if(ch==='"' && cell==='') quoted = true;
    else if(ch==='\t'){ row.push(cell); cell = ''; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));  // Excel 末尾总带一个换行；空行一并去掉
}
// 一个数字串本身怎么读：小数点逗号、点号都认；只有一种分隔符且后面正好三位时，既可能是小数也可能是千分位 → 不猜，给出两种读法
function readNumberText(raw, integer){
  const bad = {error:`"${raw}" is not a number`};
  const groupsOk = (s, sep)=> s.split(sep).every((g,i)=> i===0 ? /^\d{1,3}$/.test(g) : /^\d{3}$/.test(g));
  const hasDot = raw.includes('.'), hasComma = raw.includes(',');
  let intPart = raw, frac = '';
  if(hasDot && hasComma){
    const dec = raw.lastIndexOf('.') > raw.lastIndexOf(',') ? '.' : ',', thou = dec==='.' ? ',' : '.';
    const parts = raw.split(dec);
    if(parts.length!==2 || parts[1].includes(thou) || !groupsOk(parts[0], thou)) return bad;
    intPart = parts[0].split(thou).join(''); frac = parts[1];
  } else if(hasDot || hasComma){
    const sep = hasDot ? '.' : ',', parts = raw.split(sep);
    if(parts.length>2){
      if(!groupsOk(raw, sep)) return bad;
      intPart = parts.join('');
    } else {
      const [a, b] = parts;
      if(b.length!==3 || /^0+$/.test(a) || a.length>3){ intPart = a; frac = b; }
      else if(integer) intPart = a+b;  // 产量列只收整数：378.979 只能是千分位
      else return {error:`"${raw}" could be ${a}.${b} or ${a}${b}`, choices:[`${a}.${b}`, `${a}${b}`]};
    }
  }
  // 小数位照原样保留（10.50 仍是 10.50）；超过 4 位时去掉末尾的 0 再看（服务端最多 4 位小数）
  intPart = intPart.replace(/^0+(?=\d)/,'');
  if(integer || frac.length>4) frac = frac.replace(/0+$/,'');
  if(integer && frac) return {error:`"${raw}" — use a whole number`};
  if(frac.length>4) return {error:`"${raw}" — use at most 4 decimal places`};
  const value = frac ? `${intPart}.${frac}` : intPart;
  return {value: integer ? Number(value) : value};
}
// 一个格子里的数：历史 Excel 常带单位和第二种货币（"0,0865 Euro/pc⏎0,0952 USD/pc"），取与表单币种一致的那个；
// 读不准的不猜，返回 error（有两种读法时附 choices，让人点选）
function parseGridNumber(text, {currency='EUR', integer=false}={}){
  const s = String(text??'').trim();
  if(!s) return {value:null};
  const nums = [...s.matchAll(/(?<![\w.,])-?\d(?:[\d.,]*\d)?/g)];
  if(!nums.length) return {error:`"${pnOneLine(s)}" is not a number`};
  const after = new RegExp(`^\\s*(${PN_CURRENCY_RE})(?![a-z])`, 'i'), before = new RegExp(`(${PN_CURRENCY_RE})\\s*$`, 'i');
  const cands = nums.map((m,i)=>{
    const end = m.index + m[0].length;
    const tail = s.slice(end, i+1<nums.length ? nums[i+1].index : s.length);
    const head = s.slice(i>0 ? nums[i-1].index + nums[i-1][0].length : 0, m.index);
    const word = (tail.match(after)||[])[1] || (head.match(before)||[])[1];
    return {raw:m[0], cur: word ? PN_CURRENCY_WORDS[word.toLowerCase()] : '', scaled:/^\s*(k|tsd|mio|mn|million|bn)(?![a-z])/i.test(tail)};
  });
  let pick = cands[0];
  if(cands.length>1){
    const mine = cands.filter(c=>c.cur===currency);
    if(mine.length!==1) return {error: integer || !mine.length ? `"${pnOneLine(s)}" has several numbers — keep only ${integer ? 'one' : 'the '+currency+' value'}` : `"${pnOneLine(s)}" has several ${currency} values — keep only one`};
    pick = mine[0];
  }
  if(!integer && pick.cur && pick.cur!==currency) return {error:`"${pnOneLine(s)}" is in ${pick.cur}, the form currency is ${currency} — enter the ${currency} value`};
  if(pick.scaled) return {error:`"${pnOneLine(s)}" — write the full number instead of K / Mio`};
  if(pick.raw.startsWith('-')) return {error:`"${pnOneLine(s)}" cannot be negative`};
  return readNumberText(pick.raw, integer);
}

// 一个格子的问题：数字读不准、零件号格里写了多个、粘贴来的类型认不出
function pnCellProblem(grid, cell){
  const col = PN_COL[cell.dataset.pnField], v = cell.value.trim();
  if(col.kind==='money' || col.kind==='int'){
    if(!v || v===cell.dataset.ok) return null;
    const r = parseGridNumber(v, {currency:pnGridCurrency(grid), integer:col.kind==='int'});
    return r.error ? r : null;
  }
  if(col.kind==='pn' && /[,;]/.test(v)) return {error:`"${v}" lists several part numbers — put each one on its own row`};
  if(col.kind==='type' && cell.dataset.typeBad) return {error:cell.dataset.typeBad};
  return null;
}
// live：边打字边校验时只清除已修好的红格，不在半截输入上报错（离开格子、粘贴、提交时才报）
function validatePnCell(grid, cell, {live=false}={}){
  const p = pnCellProblem(grid, cell);
  if(!p){ delete cell.dataset.bad; delete cell.dataset.choices; return; }
  if(live && !cell.dataset.bad) return;
  cell.dataset.bad = p.error;
  if(p.choices) cell.dataset.choices = JSON.stringify(p.choices); else delete cell.dataset.choices;
}
function addPnGridRow(grid){
  const tbody = grid.querySelector('tbody');
  if(tbody.rows.length >= PN_GRID_MAX_ROWS){ grid.dataset.note = `One registration holds at most ${PN_GRID_MAX_ROWS} part numbers.`; return null; }
  const mode = grid.dataset.pnGrid, i = Number(grid.dataset.nextRow) || tbody.rows.length;
  grid.dataset.nextRow = i+1;
  // 同一 bundle 的项目 / 类型 / 供应商多半一样：新行先带上一行的
  const last = tbody.rows[tbody.rows.length-1], seed = {};
  if(last) PN_GRID_COLUMNS.filter(c=>c.fill).forEach(c=>{ seed[c.key] = pnCell(last, c.key).value; });
  tbody.insertAdjacentHTML('beforeend', pnGridRowHtml(mode, i, seed));
  return tbody.rows[tbody.rows.length-1];
}
function setPnCellFromPaste(grid, tr, key, raw, prevTr){
  const col = PN_COL[key], cell = pnCell(tr, key);
  let text = String(raw??'');
  // 委员会 Excel 里同一 bundle 的 Type / Project / Supplier 常是合并格，复制出来下面几行是空的 → 沿用上一行
  if(!text.trim() && col.fill && prevTr) text = pnCell(prevTr, key).value;
  delete cell.dataset.ok; delete cell.dataset.typeBad;
  if(col.kind==='type'){
    const t = normalizeSourcingType(text);
    if(t===null) cell.dataset.typeBad = `"${pnOneLine(text)}" is not a sourcing type — pick New, C/O or GCS`;
    else if(t) cell.value = t;
  } else if(col.kind==='money' || col.kind==='int'){
    const r = parseGridNumber(text, {currency:pnGridCurrency(grid), integer:col.kind==='int'});
    if(r.error) cell.value = pnOneLine(text);
    else { cell.value = r.value===null ? '' : String(r.value); if(r.value!==null) cell.dataset.ok = String(r.value); }
  } else cell.value = col.kind==='pn' ? text.trim().split(/\s*\n\s*/).filter(Boolean).join(', ') : pnOneLine(text);
  validatePnCell(grid, cell);
}
function pastePnGrid(grid, cell, e){
  const table = parseClipboardTable(e.clipboardData ? e.clipboardData.getData('text/plain') : '');
  if(!table.length) return;
  if(table.length===1 && table[0].length===1 && cell.tagName==='INPUT') return;  // 单个格子照常粘贴，离开格子时再校验
  e.preventDefault();
  const tbody = grid.querySelector('tbody');
  const startRow = [...tbody.rows].indexOf(cell.closest('tr'));
  const startCol = PN_GRID_COLUMNS.findIndex(c=>c.key===cell.dataset.pnField);
  const header = table[0].map(pnColumnForHeader);
  const byHeader = header.filter(Boolean).length >= 2;
  const body = byHeader ? table.slice(1) : table;
  const width = Math.max(...table.map(r=>r.length));
  const seen = new Set();
  // 带表头：按表头名对列，其他列（Region、SWAT ID、Spend、Comment …）跳过；不带：从光标所在格往右按表格列顺序填
  const keys = Array.from({length:width}, (_,j)=>{
    const k = byHeader ? header[j] : (PN_GRID_COLUMNS[startCol+j]||{}).key;
    if(!k || seen.has(k)) return null;
    seen.add(k); return k;
  });
  const unused = keys.filter((k,j)=>!k && body.some(r=>(r[j]||'').trim())).length;
  if(!body.length){ grid.dataset.note = 'Only a header row was pasted — copy the part number rows as well.'; refreshPnGrid(grid); return; }
  let pasted = 0, cut = 0;
  body.forEach((cells, k)=>{
    const tr = tbody.rows[startRow+k] || addPnGridRow(grid);
    if(!tr){ cut++; return; }
    pasted++;
    const prev = k>0 ? tbody.rows[startRow+k-1] : null;
    keys.forEach((key,j)=>{ if(key && j<cells.length) setPnCellFromPaste(grid, tr, key, cells[j], prev); });  // 这一行没带到的格子不清空
  });
  const bad = [...tbody.querySelectorAll('.pn-cell')].filter(c=>c.dataset.bad).length;
  grid.dataset.note = `Pasted ${pasted} row${pasted===1?'':'s'}${byHeader ? ' (columns matched by their header)' : ''}.`
    + (unused ? ` ${unused} column${unused===1?'':'s'} not used.` : '')
    + (bad ? ` ${bad} cell${bad===1?' needs':'s need'} a look — marked red below.` : '')
    + (cut ? ` ${cut} row${cut===1?' was':'s were'} not pasted: one registration holds at most ${PN_GRID_MAX_ROWS} part numbers.` : '');
  refreshPnGrid(grid);
}
function fillPnColumn(grid, key){
  const rows = [...grid.querySelector('tbody').rows];
  const first = pnCell(rows[0], key);
  if(!first.value.trim()){ grid.dataset.note = `Fill in row 1's ${PN_COL[key].label} first — Fill all copies it to every row.`; refreshPnGrid(grid); return; }
  rows.slice(1).forEach(tr=>{ const c = pnCell(tr, key); c.value = first.value; delete c.dataset.typeBad; validatePnCell(grid, c); });
  delete first.dataset.typeBad; validatePnCell(grid, first);
  grid.dataset.note = `Copied ${PN_COL[key].label} "${first.value}" to all ${rows.length} rows.`;
  refreshPnGrid(grid);
}
// 重新标红 / 标黄并写提示区：数字问题（带点选按钮）、重复零件号（只提示，不拦：同一零件号按地区分给不同供应商时会出现两行）、
// 提交过一次以后的缺项
function refreshPnGrid(grid){
  const rows = [...grid.querySelector('tbody').rows];
  const checked = grid.dataset.checked==='1' && grid.dataset.pnGrid==='submit';
  const byPn = new Map();
  rows.forEach((tr,r)=>{ const v = pnCell(tr,'partNumber').value.trim().toUpperCase(); if(v) byPn.set(v, [...(byPn.get(v)||[]), r+1]); });
  const dups = [...byPn].filter(([,rs])=>rs.length>1), dupRows = new Set(dups.flatMap(([,rs])=>rs));
  const bads = [];
  rows.forEach((tr,r)=>{
    tr.querySelectorAll('.pn-cell').forEach(cell=>{
      const col = PN_COL[cell.dataset.pnField];
      const missing = checked && !col.optional && !cell.value.trim() && !cell.dataset.bad;
      cell.classList.toggle('pn-bad', !!cell.dataset.bad);
      cell.classList.toggle('pn-missing', missing);
      cell.title = cell.dataset.bad || (missing ? 'Required' : '');
      if(cell.dataset.bad) bads.push({row:r+1, col, cell});
    });
    pnCell(tr,'partNumber').classList.toggle('pn-dup', dupRows.has(r+1));
  });
  const count = grid.querySelector('.pn-count');
  if(count) count.textContent = `${rows.length} part number${rows.length===1?'':'s'}`;
  const add = grid.querySelector('#addPartNumberBtn, #addPnLineBtn');
  if(add) add.disabled = rows.length >= PN_GRID_MAX_ROWS;
  const items = [
    ...bads.slice(0,10).map(b=>`<li class="bad">Row ${b.row} · ${esc(b.col.label)}: ${esc(b.cell.dataset.bad)}${b.cell.dataset.choices ? ' — '+JSON.parse(b.cell.dataset.choices).map(v=>`<button type="button" class="pn-pick" data-pn-pick="${escapeAttr(b.cell.id)}" data-value="${escapeAttr(v)}">${esc(v)}</button>`).join(' ') : ''}</li>`),
    ...(bads.length>10 ? [`<li class="bad">… and ${bads.length-10} more cells marked red.</li>`] : []),
    ...dups.map(([pn,rs])=>`<li class="warn">${esc(pn)} is in rows ${rs.join(', ')} — check that this is intended (e.g. one row per region).</li>`),
  ];
  // 内容没变就不重写：点选按钮时上一个格子失焦会触发这里，重写会把正被点的按钮换掉，点击就落空
  const msg = grid.querySelector('.pn-grid-msg');
  const html = (grid.dataset.note ? `<div class="pn-msg-note">${esc(grid.dataset.note)}</div>` : '') + (items.length ? `<ul class="pn-msg-list">${items.join('')}</ul>` : '');
  if(msg && msg.dataset.html!==html){ msg.innerHTML = html; msg.dataset.html = html; }
}
function wirePnGrid(grid){
  if(!grid || grid.dataset.wired) return;
  grid.dataset.wired = '1';
  const tbody = grid.querySelector('tbody');
  const isCell = e=> e.target.closest && e.target.closest('.pn-cell');
  grid.addEventListener('click', e=>{
    const rm = e.target.closest('[data-remove-pn]');
    if(rm){ if(tbody.rows.length>1){ rm.closest('tr').remove(); grid.dataset.note = ''; refreshPnGrid(grid); } return; }
    const fill = e.target.closest('[data-pn-fill]');
    if(fill){ fillPnColumn(grid, fill.dataset.pnFill); return; }
    const pick = e.target.closest('[data-pn-pick]');
    if(pick){
      const cell = document.getElementById(pick.dataset.pnPick);
      if(cell){ cell.value = pick.dataset.value; cell.dataset.ok = pick.dataset.value; validatePnCell(grid, cell); refreshPnGrid(grid); }
      return;
    }
    if(e.target.closest('#addPartNumberBtn, #addPnLineBtn')){
      grid.dataset.note = '';
      const tr = addPnGridRow(grid);
      refreshPnGrid(grid);
      if(tr) tr.querySelector('.pn-cell').focus();
    }
  });
  // Enter 往下（最后一行再加一行），Shift+Enter 往上；Tab 往右走浏览器默认的顺序
  grid.addEventListener('keydown', e=>{
    const cell = isCell(e);
    if(!cell || e.key!=='Enter' || e.isComposing) return;
    e.preventDefault();
    const tr = cell.closest('tr'), col = [...tr.querySelectorAll('.pn-cell')].indexOf(cell);
    validatePnCell(grid, cell);
    let next = e.shiftKey ? tr.previousElementSibling : tr.nextElementSibling;
    if(!next && !e.shiftKey) next = addPnGridRow(grid);
    refreshPnGrid(grid);
    if(next){ const t = next.querySelectorAll('.pn-cell')[col]; t.focus(); if(t.select) t.select(); }
  });
  grid.addEventListener('paste', e=>{ const cell = isCell(e); if(cell) pastePnGrid(grid, cell, e); });
  grid.addEventListener('input', e=>{ const cell = isCell(e); if(cell){ validatePnCell(grid, cell, {live:true}); refreshPnGrid(grid); } });
  grid.addEventListener('change', e=>{ const cell = isCell(e); if(cell && cell.tagName==='SELECT'){ delete cell.dataset.typeBad; validatePnCell(grid, cell); refreshPnGrid(grid); } });
  grid.addEventListener('focusout', e=>{ const cell = isCell(e); if(cell && cell.tagName==='INPUT'){ validatePnCell(grid, cell); refreshPnGrid(grid); } });
  tbody.querySelectorAll('.pn-cell').forEach(cell=>validatePnCell(grid, cell));  // 编辑页重绘后，未修好的格子仍是红的
  refreshPnGrid(grid);
}
// 表格当前内容（原样文字 + 已确认写法），编辑页重绘前存回 editBuffer 用
function pnGridDomRows(grid){
  return [...grid.querySelector('tbody').rows].map(tr=>{
    const row = {_ok:{}};
    PN_GRID_COLUMNS.forEach(col=>{ const c = pnCell(tr, col.key); row[col.key] = c.value; if(c.dataset.ok!==undefined) row._ok[col.key] = c.dataset.ok; });
    return row;
  });
}
// 提交 / 保存前读表：数字按规则读成服务端要的写法（金额字符串、产量整数，空 = null），问题按"行 · 列"列出并标红
function checkPnGrid(grid, {required=false}={}){
  if(required) grid.dataset.checked = '1';
  const trs = [...grid.querySelector('tbody').rows], cur = pnGridCurrency(grid), errors = [];
  const rows = trs.map((tr,r)=>{
    const row = {};
    PN_GRID_COLUMNS.forEach(col=>{
      const cell = pnCell(tr, col.key), v = cell.value.trim();
      validatePnCell(grid, cell);
      if(cell.dataset.bad) errors.push(`Row ${r+1} · ${col.label}: ${cell.dataset.bad}.`);
      if(col.kind==='money' || col.kind==='int'){
        const p = !v ? {value:null} : v===cell.dataset.ok ? {value: col.kind==='int' ? Number(v) : v} : parseGridNumber(v, {currency:cur, integer:col.kind==='int'});
        row[col.key] = p.error ? null : p.value;
      } else row[col.key] = v;
    });
    return row;
  });
  refreshPnGrid(grid);
  const emptyRows = keys=> trs.map((tr,r)=> keys.some(k=>!pnCell(tr,k).value.trim()) ? r+1 : 0).filter(Boolean);
  return {rows, errors, emptyRows};
}

  const roleSelect = u => `<select class="edit-input" style="width:auto;min-width:130px;" data-user-role="${escapeAttr(u.email)}" ${u.email===me?'disabled title="Ask another Sourcing admin to change your own role"':''}>${ROLE_OPTIONS.map(([v,l])=>`<option value="${v}" ${u.role===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const rows = users.map(u=>`<tr>
      <td style="white-space:nowrap;"><input class="edit-input" style="width:auto;min-width:150px;" data-user-name="${escapeAttr(u.email)}" value="${escapeAttr(u.name)}" maxlength="80" aria-label="Name of ${escapeAttr(u.email)}"/>${u.email===me?' <span class="cat-tag">you</span>':''}</td>
      <td class="mono">${esc(u.email)}</td>
      <td>${roleSelect(u)}</td>
      <td>${u.disabled ? '<span class="badge noaction">Disabled</span>' : '<span class="badge approved">Active</span>'}${u.mustChangePassword ? '<div style="font-size:10.5px;color:var(--amber);font-weight:600;margin-top:3px;white-space:nowrap;">Temporary password</div>' : ''}</td>
      <td style="white-space:nowrap;">${esc(u.createdAt||'—')}</td>
      <td style="white-space:nowrap;">${esc(u.lastLoginAt||'—')}</td>
      <td style="white-space:nowrap;">
        ${u.email===me ? '' : `<button class="btn-secondary" style="padding:5px 10px;font-size:11.5px;" data-user-disable="${escapeAttr(u.email)}" data-disabled="${u.disabled?'1':'0'}">${u.disabled?'Enable':'Disable'}</button>
        ${u.role==='admin' ? `<button class="btn-secondary" style="padding:5px 10px;font-size:11.5px;margin-left:6px;" data-user-reset="${escapeAttr(u.email)}">Reset password</button>` : ''}`}
      </td>
    </tr>`).join('');
  return `
  <div class="pagehead">
    <h1>Accounts</h1>${infoTip(`Everyone registers with their company email (${esc(domains)}) — name and email only, no password — and starts as a <b>User</b>: submit and view cases. Correct a name here when it is not the person's real name — new registrations use it as the presenter. <b>Manager</b> (purchasing / NPI manager): also confirm or return registrations, edit and delete cases, record decisions and follow-ups, send reminders. <b>Sourcing admin</b>: also exchange rates, registration deadline, reminder settings and this page; admins are the only accounts with a password (issued here when you promote someone).`)}
  </div>
  ${notice}
  <div class="card" style="overflow-x:auto;">
    ${state.accountsError ? `<div style="padding:18px;color:var(--red);font-weight:600;font-size:12.5px;">Could not load the accounts: ${esc(state.accountsError)} <button type="button" class="link-btn" id="accountsRetry">Retry</button></div>`
    : state.accounts===null ? `<div style="padding:18px;color:var(--ink-faint);font-size:12.5px;">Loading accounts…</div>`
    : users.length===0 ? emptyState() : `
    <table class="data-table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Registered</th><th>Last login</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="padding:10px 12px;font-size:11.5px;color:var(--ink-faint);">Forgot password: reset it here and pass the temporary password on privately — the Cockpit has no mail channel for it yet. At least one active Sourcing admin must remain.</div>`}
  </div>
  `;
}

/* ============================= RENDER: APPROVALS ============================= */
function renderApprovals(){
  const pending = SUBMISSIONS.filter(s=>s.status==='Waiting for Registration Confirmation');
  const decided = SUBMISSIONS.filter(s=>s.status!=='Waiting for Registration Confirmation').sort((a,b)=> b.subId.localeCompare(a.subId));
  return `
  <div class="pagehead">
    <h1>Registration Confirmation</h1>${infoTip(`Confirm that a submitted case is accepted into the system, or reject it with a reason. This is <b>not</b> the Sourcing Committee decision — a confirmed case enters the Database with Sourcing Decision = Pending, and the committee decides later.`)}
  </div>

  ${pending.length===0 ? `<div class="card"><div class="empty-state">No submissions waiting for review.</div></div>` :
    pending.map(s=>`
    <div class="card appr-card">
      <div class="appr-top">
        <div>
          <div class="appr-title">${esc(s.partNumber)} — ${esc(s.partDescription)}${(s.partNumbers&&s.partNumbers.length>1)?` (+${s.partNumbers.length-1} more part number${s.partNumbers.length>2?'s':''})`:''}</div>
          <div class="who">Submitted by ${esc(s.submitterName)} (${esc(s.submitterEmail)}) · ${esc(s.submittedAt)}${(s.presenter && s.presenter!==s.submitterName)?` · Presenter: ${esc(s.presenter)}`:''}${s.caseId?` · <b style="color:${s.existingSwatId?'var(--accent)':'var(--green)'};">${s.existingSwatId?`Came back — existing case ${esc(s.existingSwatId)} (${s.priorEntries} previous entr${s.priorEntries===1?'y':'ies'}), will be linked to its history`:`New case ${esc(s.caseId)}`}</b>`:''}</div>
        </div>
        <span class="badge pending">Waiting for Registration Confirmation</span>
      </div>
      ${s.lateRegistration ? `<div class="block-warning" style="display:block;margin:0 0 12px;background:var(--amber-tint);border-color:#EAD3A0;color:var(--amber);">⏰ Late registration — exception requested. Deadline was ${esc(s.lateRegistration.deadline)}. Reason: ${esc(s.lateRegistration.reason)}. Confirming the registration approves the exception.</div>` : ''}
      ${(s.partNumbers&&s.partNumbers.length>1) ? `
      <div style="border:1px solid var(--border);border-radius:6px;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch;">
        <table class="data-table" style="font-size:12px;">
          <thead><tr><th>Part Number</th><th>Part Description</th><th>Project</th><th>Type</th><th>Recommended Supplier</th></tr></thead>
          <tbody>${s.partNumbers.map(r=>`<tr><td class="mono">${esc(r.partNumber)}</td><td>${esc(r.partDescription)}</td><td>${esc(r.project||s.project)}</td><td>${esc(r.sourcingType||s.sourcingType)}</td><td>${esc(r.recommendedSupplier||s.recommendedSupplier)}</td></tr>`).join('')}</tbody>
        </table>
      </div>` : ''}
      <div class="appr-grid">
        ${infoItem('Requested Meeting Date', s.meetingDateLabel||'—')}
        ${infoItem('Region', s.region)}
        ${infoItem('Project', s.project)}
        ${infoItem('Cluster', s.cluster)}
        ${infoItem('Sourcing Type', s.sourcingType)}
        ${infoItem('Recommended Supplier', s.recommendedSupplier)}
        ${infoItem('Decision Level', s.decisionLevel)}
        ${infoItem('Bundle Peak Year Spend', spendText(s,'peakYearSpend'))}
        ${infoItem('Bundle Lifetime Spend', spendText(s,'lifetimeSpend'))}
        ${isConverted(s) ? infoItem('Exchange Rate', fxLabel(s.fx)) : ''}
      </div>
      ${hasCommercial(s) ? `<div class="appr-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        ${commercialInfoItems(s)}
        ${optionalInfoItems(s)}
      </div>` : ''}
      <div class="info-item"><div class="k">Case Comments</div><div class="v" style="font-weight:400;">${esc(s.committeeDiscussion||'—')}</div></div>
      ${(s.files&&s.files.length) ? `<div class="info-item" style="margin-top:10px;"><div class="k">Sourcing Presentation Files</div>${filesListHtml(s.files, false)}</div>` : ''}
      <div class="appr-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        ${infoItem('Family Case?', s.isFamilyCase||'—')}
        ${infoItem('Family Alignment Done?', s.familyAligned||'—')}
        ${(s.familyEvidence && s.familyEvidence!=='—') ? infoItem('Family Alignment Evidence', s.familyEvidence) : ''}
        ${infoItem('Involves ECM?', s.involvesECM||'—')}
        ${infoItem('Passed CCB2?', s.ccbApproved||'—')}
      </div>
      ${state.isAdmin ? `<div class="appr-actions">
        <button class="btn-primary" data-approve="${escapeAttr(s.subId)}">Confirm Registration</button>
        <button class="btn-danger" data-reject-toggle="${escapeAttr(s.subId)}">Reject</button>
      </div>` : `<div style="font-size:11.5px;color:var(--ink-faint);margin-top:10px;">Confirm / Reject is available to Managers and the Sourcing admin.</div>`}
      ${String(s.sharepoint && s.sharepoint.result || '').startsWith('failed') ? `<div style="font-size:11px;color:var(--red);margin-top:6px;">📄 SharePoint item creation failed — see server log and the column contract in DEPLOY.md</div>` : ''}
      <div class="reject-box" id="rejectBox-${escapeAttr(s.subId)}">
        <textarea id="rejectReason-${escapeAttr(s.subId)}" placeholder="Reason for returning this to the submitter (required)..."></textarea>
        <div class="form-actions">
          <button class="btn-danger" data-reject-confirm="${escapeAttr(s.subId)}">Confirm Reject &amp; Notify Submitter</button>
        </div>
      </div>
    </div>
    `).join('')}

  ${decided.length>0 ? `
  <div class="card side-panel" style="margin-top:18px;padding:20px;">
    <h3>Recently Processed Registrations</h3>
    ${decided.slice(0,8).map(s=>`
      <div class="decided-row">
        <div>${esc(s.subId)} — ${esc(s.partDescription || s.partNumber)} <span style="color:var(--ink-faint);">(${esc(s.submitterName)})</span>${s.notify?`<div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">📧 Notified submitter ${esc(s.notify.when)} — ${esc(s.notify.result)}</div>`:''}${s.sharepoint?`<div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">📄 SharePoint: ${esc(s.sharepoint.result)}${s.sharepoint.itemId?` (item ${esc(s.sharepoint.itemId)})`:''}</div>`:''}</div>
        <span class="badge ${s.status==='Registration Confirmed'?'approved':s.status==='Deleted'?'noaction':'rejected'}">${esc(s.status)}</span>
      </div>
    `).join('')}
  </div>` : ''}
  `;
}


function renderDetail(){
  const hist = historyFor(state.selectedSwatId);
  if(hist.length===0){ state.view='database'; return renderDatabase(); }
  const idx = Math.min(state.selectedEntryIndex, hist.length-1);
  const c = hist[idx];
  const decClass = decisionBadgeClass(c.meetingDecision);
  const decColor = decClass==='approved'?'var(--green)':decClass==='rejected'?'var(--red)':decClass==='pending'?'#3E5A9C':'var(--amber)';
  const decBg = decClass==='approved'?'var(--green-tint)':decClass==='rejected'?'var(--red-tint)':decClass==='pending'?'#E8EDF7':'var(--amber-tint)';
  const editing = state.detailEditMode;
  const b = editing ? state.editBuffer : null;
  const ef = (id,val)=> `<input class="edit-input" id="${id}" value="${escapeAttr(val)}"/>`;
  const eta = (id,val)=> `<textarea class="edit-input" id="${id}" style="min-height:70px;">${esc(val)}</textarea>`;
  const esel = (id,val,opts)=> `<select class="edit-input" id="${id}">${opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  // 编辑页金额用"录入时的币种"：外币折算来的案例按原币编辑，其余按记录币种
  const editCur = isConverted(c) ? c.fx.currency : spendCurrency(c);
  const rolledUpStatus = editing ? rollupActionStatus(b.followUps) : c.actionStatus;
  const flash = state.flash; state.flash = null;

  return `
  ${flash ? `<div class="submit-banner show" style="margin:0 0 14px;">${esc(flash)}</div>` : ''}
  <div class="backlink" id="backToDb">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Database
  </div>

  <div class="detail-header">
    <div class="titles">
      <h1>${esc(c.partDescription || '(no part description)')}</h1>
      <div class="meta" style="margin-bottom:4px;">
        <span>Part Number: <b class="mono" style="color:var(--ink);">${esc(c.partNumber)}</b>${(c.partNumbers&&c.partNumbers.length>1)?` <span style="color:var(--ink-faint);">(+${c.partNumbers.length-1} more)</span>`:''}</span>
        <span>SWAT Case: <b class="mono" style="color:var(--ink);">${esc(c.swatId)}</b></span>
      </div>
      <div class="meta">
        <span class="mono">${caseWeekLabel(c)} · ${esc(caseDateLabel(c))} · Case #${c.caseNumber} · ${esc(c.decisionLevel)}</span>
      </div>
      ${(editing && state.isSysAdmin) ? `<div class="week-move" style="margin-top:8px;">
        <label for="editMeetingDate" style="font-size:12px;color:var(--ink-soft);font-weight:600;">Committee week (Sourcing admin)</label>
        <input type="date" class="edit-input" id="editMeetingDate" value="${escapeAttr(b.meetingDate||'')}"/>
        <span class="mono" id="editMeetingWeek" style="font-size:12px;">${esc(meetingWeekPreview(b.meetingDate, c))}</span>
      </div>` : ''}
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      ${editing ? `<span class="badge pending">Editing (Admin)</span>` : `
        <div class="decision-pill" style="background:${decBg};color:${decColor};">${esc(c.meetingDecision)}</div>
        ${state.isAdmin ? `<button class="btn-secondary" id="editCaseBtn">✎ Edit Case</button>` : ''}
        ${state.isAdmin ? (state.pendingDeleteId===c.swatId
            ? `<span class="confirm-inline">${(n=>`Delete this case${n ? ` and its ${n} attached file${n===1?'':'s'}` : ''}?`)(caseAttachmentCount(c.swatId))} <button class="btn-danger-sm" data-delete-confirm="${escapeAttr(c.swatId)}">Yes, delete</button><button class="btn-secondary" style="padding:4px 9px;font-size:11px;" data-delete-cancel="1">No</button></span>`
            : `<button class="btn-danger-sm" data-delete-ask="${escapeAttr(c.swatId)}">Delete Case</button>`) : ''}
      `}
    </div>
  </div>

  <div class="status-row">
    ${editing ? `
    <div class="status-tile"><div class="k">Sourcing Decision</div><select class="edit-input" id="editDecision">${DECISION_OPTIONS.map(o=>`<option value="${o.v}" ${b.meetingDecision===o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>
    <div class="status-tile" style="flex:2;"><div class="k">Sourcing Presentation Link ${(b.meetingDecision!=='PENDING' && !(c.files&&c.files.length))?'*':''}${fieldTip('A decision other than Pending needs this link, or a presentation file added under Sourcing Presentation Files below.')}</div>${ef('editPresentationLink', b.sourcingPresentationLink||'')}${(c.files&&c.files.length) ? `<div style="font-size:10px;color:var(--ink-faint);margin-top:4px;">Optional — ${c.files.length} file${c.files.length===1?'':'s'} attached below</div>` : ''}</div>
    <div class="status-tile"><div class="k">Action Status${fieldTip(b.meetingDecision==='PENDING' ? 'Blank until a Sourcing Decision is recorded.' : 'Computed from the task statuses below.')}</div>${b.meetingDecision==='PENDING' ? '<span class="no-action-txt">—</span>' : actionCell(rolledUpStatus)}</div>
    ` : `
    <div class="status-tile"><div class="k">Sourcing Decision</div><span class="badge ${decisionBadgeClass(c.meetingDecision)}">${esc(c.meetingDecision)}</span>${c.decisionText ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:5px;white-space:pre-line;">Excel: ${esc(c.decisionText)}</div>` : ''}</div>
    <div class="status-tile" style="flex:2;"><div class="k">Sourcing Presentation</div><div style="font-size:12px;word-break:break-all;">${c.sourcingPresentationLink ? documentLink(c.sourcingPresentationLink) : (c.files&&c.files.length) ? `<span>📎 ${c.files.length} file${c.files.length===1?'':'s'} under Sourcing Presentation Files</span>` : `<span style="color:var(--ink-faint);">Not yet provided — required when a decision is recorded</span>`}</div></div>
    <div class="status-tile"><div class="k">Action Status</div>${actionCellFor(c)}</div>
    `}
  </div>

  ${editing ? `
  <div class="card section-card">
    <h3>Part Numbers${infoTip('One row per part number. Copy rows from the committee Excel and paste them into the table: with the header row, columns are matched by name.')}</h3>
    ${projectDatalist('editProjectOptions')}
    ${pnGridHtml('edit', b.partNumbers, editCur)}
    <div class="form-grid" style="margin-top:12px;">
      <div class="form-field"><label>Bundle Peak Year Spend (${editCur})${fieldTip('One total for all part numbers of this case.')}</label>${ef('editBundlePeak', b.peakYearSpend)}</div>
      <div class="form-field"><label>Bundle Lifetime Spend (${editCur})${fieldTip('One total for all part numbers of this case.')}</label>${ef('editBundleLife', b.lifetimeSpend)}</div>
    </div>
    ${isConverted(c) ? `<div class="fx-hint">Enter amounts in ${esc(editCur)}. They are saved in EUR at ${esc(fxLabel(c.fx))} — ${esc(fxOrigin(c.fx))}.</div>` : ''}
  </div>
  ` : ''}

  <div class="detail-grid">
    <div>
      ${editing ? '' : `
      <div class="card section-card">
        <h3>Part Numbers</h3>
          ${partNumberLines(c).length>1 ? `
          <div style="overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch;">
            <table class="data-table">
              <thead><tr><th>Part Number</th><th>Part Description</th><th>Project</th><th>Type</th><th>Recommended Supplier</th></tr></thead>
              <tbody>${partNumberLines(c).map(p=>`<tr><td class="mono">${esc(p.partNumber)}</td><td>${esc(p.partDescription)}</td><td>${esc(p.project||c.project)}</td><td>${esc(p.sourcingType||c.sourcingType)}</td><td>${esc(p.recommendedSupplier||c.recommendedSupplier)}</td></tr>`).join('')}</tbody>
            </table>
          </div>
          <div style="font-size:12.5px;font-weight:600;">Bundle Peak Year Spend: ${esc(spendText(c,'peakYearSpend'))} &nbsp;|&nbsp; Bundle Lifetime Spend: ${esc(spendText(c,'lifetimeSpend'))}</div>
          ${isConverted(c) ? `<div class="fx-hint">Exchange rate: ${esc(fxLabel(c.fx))}${c.fx.convertedAt ? ' — converted from USD on '+esc(c.fx.convertedAt) : ' — recorded at submission'}</div>` : ''}
          ` : `
          <div class="info-grid">
            ${infoItem('Part Number', c.partNumber)}
            ${infoItem('Part Description', c.partDescription)}
            ${infoItem('Peak Year Spend', spendText(c,'peakYearSpend'))}
            ${infoItem('Lifetime Spend', spendText(c,'lifetimeSpend'))}
            ${isConverted(c) ? infoItem('Exchange Rate', fxLabel(c.fx)) : ''}
          </div>
          `}
      </div>
      `}

      <div class="card section-card">
        <h3>Case Information${editing ? infoTip('Project, Sourcing Type and Recommended Supplier are edited per part number above.') : ''}</h3>
        ${editing ? `
        <div class="form-grid">
          <div class="form-field"><label>Region (select all that apply)</label>${regionChecks('editRegion', b.region)}</div>
          <div class="form-field"><label>Product Family</label>${esel('editFamily', b.family, uniq([...FAMILY_OPTIONS, b.family].filter(Boolean)))}</div>
          <div class="form-field"><label>Cluster</label>${esel('editCluster', b.cluster, uniq([...CLUSTERS, b.cluster]))}</div>
          <div class="form-field"><label>Parent PF</label>${ef('editParentPF', b.parentPF)}</div>
          <div class="form-field"><label>Part Family Code</label>${ef('editPartFamilyCode', b.partFamilyCode)}</div>
          <div class="form-field"><label>Presenter</label>${ef('editPresenter', b.presenter)}</div>
          <div class="form-field"><label>Decision Level</label>${esel('editDecisionLevel', b.decisionLevel, DECISION_LEVELS)}</div>
          <div class="form-field span2">
            <label>Final PPT / Supporting Document Link ${rollupActionStatus(b.followUps)==='Closed'?'*':''}${fieldTip('Required once every follow-up action is Closed (that closes the case). Paste the SharePoint / OneDrive link — the file itself stays there.')}</label>
            ${ef('editFinalDocLink', b.finalDocLink||'')}
          </div>
        </div>
        ` : `
        <div class="info-grid">
          ${infoItem('SWAT Case Number', c.swatId)}
          ${c.source && c.source.kind==='excel' ? infoItem('Imported from', `${c.source.file} (row ${c.source.row}${c.source.importedAt?`, ${c.source.importedAt}`:''})`) : ''}
          ${c.createdDate ? infoItem('Case Created', c.createdDate) : ''}
          ${c.lateRegistration ? infoItem('Late Registration', `Exception approved at confirmation — deadline was ${c.lateRegistration.deadline}. Reason: ${c.lateRegistration.reason}`) : ''}
          ${infoItem('Region', c.region)}
          ${infoItem('Project', c.project)}
          ${infoItem('Product Family', c.family)}
          ${infoItem('Cluster', c.cluster)}
          ${c.commodity ? infoItem('Commodity', c.commodity + ((c.commodityRaw && c.commodityRaw!==c.commodity) ? ` (Excel: ${c.commodityRaw})` : '')) : ''}
          ${infoItem('Parent PF', c.parentPF)}
          ${infoItem('Part Family Code', c.partFamilyCode)}
          ${infoItem('Sourcing Type', c.sourcingType)}
          ${infoItem('Recommended Supplier', c.recommendedSupplier)}
          ${infoItem('Presenter', c.presenter)}
          ${infoItem('Decision Level', c.decisionLevel)}
          <div class="info-item" style="grid-column:1/-1;"><div class="k">Final PPT / Supporting Document</div>
            <div class="v" style="font-weight:400;word-break:break-all;">${c.finalDocLink ? documentLink(c.finalDocLink) : `<span style="color:var(--ink-faint);">Not yet provided${c.actionStatus==='Closed'?'':' — required before the case can be closed'}</span>`}</div>
          </div>
        </div>
        `}
      </div>

      <div class="card section-card">
        <h3>Commercial Information${editing ? infoTip('Pc Price CQA, Supplier Price (landed), tooling and volumes are edited per part number in the Part Numbers section above.') : ''}</h3>
        ${editing ? `
        <div class="form-grid">
          <div class="form-field"><label>Tooling Payment</label>${esel('editToolingPayment', b.toolingPayment||'', ['', ...TOOLING_PAYMENTS])}</div>

          <div class="form-field"><label>BPG available?</label>${esel('editBpgAvailable', b.bpgAvailable||'', ['','Yes','No'])}</div>
          <div class="form-field"><label>Below CQA?</label>${esel('editBelowCQA', b.belowCQA||'', ['','Yes','No'])}</div>
          <div class="form-field span2"><label>Justification (when not below CQA)</label>${ef('editCqaJustification', b.cqaJustification||'')}</div>
          <div class="form-field"><label>Strategic / approved supplier?</label>${esel('editStrategicSupplier', b.strategicSupplier||'', ['','Yes','No'])}</div>
          <div class="form-field"><label>LTA available?</label>${esel('editLtaAvailable', b.ltaAvailable||'', ['','Yes','No'])}</div>
          <div class="form-field"><label>FOT lead time (weeks from KO)</label>${ef('editFotLeadTimeWeeks', b.fotLeadTimeWeeks ?? '')}</div>
          <div class="form-field"><label>PPAP lead time (weeks from KO)</label>${ef('editPpapLeadTimeWeeks', b.ppapLeadTimeWeeks ?? '')}</div>
          <div class="form-field"><label>Amortization total (${editCur})</label>${ef('editAmortizationTotal', b.amortizationTotal ?? '')}</div>
          <div class="form-field"><label>Amortization pieces</label>${ef('editAmortizationPcs', b.amortizationPcs ?? '')}</div>
          <div class="form-field"><label>USMCA eligible?</label>${esel('editUsmcaEligible', b.usmcaEligible||'', ['','Yes','No'])}</div>
          <div class="form-field"><label>Annual capacity (pcs)</label>${ef('editAnnualCapacity', b.annualCapacity ?? '')}</div>
