<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Inline SVG favicon (brand mark): avoids the /favicon.ico 404 without shipping a binary file -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23E8580A'/><text x='16' y='22' font-family='Arial,sans-serif' font-size='14' font-weight='800' fill='%23fff' text-anchor='middle'>SC</text></svg>">
<title>Seat Belt Sourcing Committee Cockpit</title>
<style>
  :root{
    --topbar-height:52px;
    --bg:#F3F4F6;
    --surface:#FFFFFF;
    --ink:#23262B;
    --ink-soft:#666B76;
    --ink-faint:#9AA0AA;
    --border:#E1E3E8;
    --border-strong:#CBCFD6;
    --accent:#E8580A;
    --accent-dark:#C24A08;
    --accent-tint:#FCE9DE;
    --green:#1E8E5A;
    --green-tint:#E4F5EC;
    --amber:#B8790A;
    --amber-tint:#FCF1DA;
    --red:#C13A2E;
    --red-tint:#FBEAE7;
    --gray:#8A909B;
    --gray-tint:#EDEEF1;
    --header:#23262B;
    --radius:8px;
    --shadow: 0 1px 2px rgba(20,20,22,0.04), 0 1px 8px rgba(20,20,22,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-padding-top:calc(var(--topbar-height) + 12px);}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  ::selection{background:var(--accent-tint);}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--header);
    color:#fff;
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 20px;
    height:52px;
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;letter-spacing:.2px;white-space:nowrap;}
  .brand .mark{
    min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.3px;
  }
  .brand .sub{color:#B7BBC3;font-weight:400;font-size:12px;border-left:1px solid #454951;padding-left:10px;margin-left:2px;}
  .navtabs{display:flex;gap:2px;margin-left:6px;min-width:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#777D88 transparent;overscroll-behavior-x:contain;}
  .navtabs::-webkit-scrollbar{height:4px;}
  .navtabs::-webkit-scrollbar-thumb{background:#777D88;border-radius:4px;}
  .navtabs.is-dragging,.navtabs.is-dragging button{cursor:grabbing;user-select:none;}
  .navtabs button{flex:none;}
  .navtabs button{
    position:relative;display:inline-flex;align-items:center;gap:7px;
    background:transparent;border:none;color:#C7CAD1;padding:8px 12px;border-radius:7px;
    font-size:13px;cursor:pointer;font-weight:500;transition:background .15s,color .15s;
  }
  .navtabs button:hover{background:#2F323A;color:#fff;}
  .navtabs button.active{background:#363941;color:#fff;font-weight:600;}
  /* 当前所在：文字下方一道短橙线（v3 Phase-26） */
  .navtabs button.active::after{content:'';position:absolute;left:50%;bottom:3px;width:16px;height:2px;margin-left:-8px;border-radius:2px;background:var(--accent);}
  .navtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  /* 待处理数量徽章：顶部组名与侧边栏共用 */
  .count-badge{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;
    font-size:10.5px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
  .admin-toggle{flex:none;margin-left:auto;height:30px;padding:0 11px;border-radius:15px;border:1px solid #4A4D56;background:#33353D;color:#C7CAD1;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .admin-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* 账号面板顶部的 登录 / 注册 切换 */
  .auth-tabs{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .auth-tabs button{flex:1;background:#fff;border:none;padding:7px 0;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .auth-tabs button+button{border-left:1px solid var(--border-strong);}
  .auth-tabs button.on{background:var(--accent);color:#fff;}
  .btn-danger-sm{background:#fff;color:var(--red);border:1px solid #EFC2BC;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;}
  .btn-danger-sm:hover{background:var(--red-tint);border-color:#E3A59D;}
  .confirm-inline{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--red);font-weight:600;white-space:nowrap;}

  /* ---------- Layout ---------- */
  .page{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  /* v3 Phase-26：顶部导航按功能分组，组内子页放左侧侧边栏；窄屏（≤900px）侧边栏变成内容上方的横向标签 */
  .shell{display:flex;align-items:flex-start;}
  .shell > .page{flex:1 1 auto;min-width:0;width:100%;}  /* width：纵向排列时 margin:auto 会取消拉伸，页面会被内容撑宽 */
  .sidenav{flex:none;width:184px;position:sticky;top:var(--topbar-height);height:calc(100vh - var(--topbar-height));overflow-y:auto;
    background:var(--surface);border-right:1px solid var(--border);padding:22px 12px;}
  .sidenav[hidden]{display:none;}
  .sidenav .sn-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:0 10px 12px;}
  .sidenav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;
    border-radius:8px;padding:7px 10px 7px 8px;margin:0 0 4px;cursor:pointer;color:var(--ink-soft);font-size:13px;font-weight:600;
    transition:background .15s,color .15s;}
  .sidenav button:hover{background:var(--bg);color:var(--ink);}
  .sidenav button.active{background:var(--accent-tint);color:var(--accent-dark);}
  .sidenav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  /* 节点：Case Workflow 是有先后的流程，节点写步骤号并用竖线连起来；Data 没有先后，节点放图标、不连线 */
  .sidenav .sn-node{position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);
    background:var(--surface);color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;}
  .sidenav button:hover .sn-node{border-color:var(--ink-faint);color:var(--ink);}
  .sidenav button.active .sn-node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(232,88,10,.16);}
  .sidenav.is-sequence button[data-nav]:has(+ button[data-nav])::after{content:'';position:absolute;left:19.25px;top:calc(50% + 12px);width:1.5px;height:calc(100% - 20px);background:var(--border-strong);}
  .sidenav{display:flex;flex-direction:column;}
  .sidenav .sn-text{flex:1;min-width:0;display:flex;flex-direction:column;}
  .sidenav .sn-label{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
  /* 每项下面的实时状态 */
  .sidenav .sn-meta{font-size:11px;font-weight:500;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidenav button.active .sn-meta{color:#C07A52;}
  .sidenav .sn-warn{color:var(--red);font-weight:600;}
  /* 收起按钮：贴在侧边栏底部 */
  .sidenav .sn-collapse{margin-top:auto;gap:8px;padding:8px 10px;font-size:12px;font-weight:600;color:var(--ink-faint);border-radius:8px;}
  .sidenav .sn-collapse:hover{color:var(--ink);background:var(--bg);}
  .sidenav .sn-collapse svg{flex:none;}
  /* 收起：只留编号 / 图标，宽度让给内容；待审数量缩成节点右上角的小圆点 */
  .sidenav.is-collapsed{width:64px;padding:22px 10px;}
  .sidenav.is-collapsed .sn-title{visibility:hidden;}
  .sidenav.is-collapsed .sn-text,.sidenav.is-collapsed .sn-collapse span{display:none;}
  .sidenav.is-collapsed button{justify-content:flex-start;}
  .sidenav.is-collapsed .sn-collapse{justify-content:center;}
  .sidenav.is-collapsed button:has(.count-badge) .sn-node::after{content:'';position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);}
  @media(max-width:900px){
    .shell{flex-direction:column;align-items:stretch;}
    .shell .sidenav{position:static;width:auto;height:auto;display:flex;flex-direction:row;gap:2px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px 12px 0;}
    .shell .sidenav[hidden]{display:none;}
    .shell .sidenav .sn-title{display:none;}
    .shell .sidenav button{flex:none;width:auto;margin:0;gap:8px;border-radius:7px 7px 0 0;border-bottom:3px solid transparent;padding:7px 12px 6px;}
    .shell .sidenav button.active{background:transparent;border-bottom-color:var(--accent);}
    .shell .sidenav button::after{display:none;}
    .shell .sidenav .sn-node{width:20px;height:20px;font-size:10px;}
    .shell .sidenav .sn-meta,.shell .sidenav .sn-collapse{display:none;}
    .shell .sidenav.is-collapsed{width:auto;padding:6px 12px 0;}
    .shell .sidenav.is-collapsed .sn-text{display:flex;}
    .shell .sidenav.is-collapsed button .sn-node::after{display:none;}
    .shell .sidenav button.active .sn-node{box-shadow:none;}
  }
  /* Database 表格列多（领导：一列不删、正常屏幕不出横向滚动条），窗口不到 1440px 时侧边栏让位给表格 */
  @media(max-width:1439px){
    body .shell.is-wide{flex-direction:column;align-items:stretch;}
    body .shell.is-wide .sidenav{position:static;width:auto;height:auto;display:flex;flex-direction:row;gap:2px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px 12px 0;}
    body .shell.is-wide .sidenav[hidden]{display:none;}
    body .shell.is-wide .sidenav .sn-title{display:none;}
    body .shell.is-wide .sidenav button{flex:none;width:auto;margin:0;gap:8px;border-radius:7px 7px 0 0;border-bottom:3px solid transparent;padding:7px 12px 6px;}
    body .shell.is-wide .sidenav button.active{background:transparent;border-bottom-color:var(--accent);}
    body .shell.is-wide .sidenav button::after{display:none;}
    body .shell.is-wide .sidenav .sn-node{width:20px;height:20px;font-size:10px;}
    body .shell.is-wide .sidenav .sn-meta,body .shell.is-wide .sidenav .sn-collapse{display:none;}
    body .shell.is-wide .sidenav.is-collapsed{width:auto;padding:6px 12px 0;}
    body .shell.is-wide .sidenav.is-collapsed .sn-text{display:flex;}
    body .shell.is-wide .sidenav.is-collapsed button .sn-node::after{display:none;}
    body .shell.is-wide .sidenav button.active .sn-node{box-shadow:none;}
  }
  /* 手机：横向标签再收紧，三个步骤放得下（:is 让优先级与上面 Database 的规则持平，靠先后顺序生效） */
  @media(max-width:480px){
    body .shell:is(.is-wide,:not(.is-wide)) .sidenav{padding:6px 6px 0;}
    body .shell:is(.is-wide,:not(.is-wide)) .sidenav button{padding:7px 8px 6px;gap:6px;font-size:12.5px;}
  }
  /* Database 页：列一个不删（领导 2026-09-30），改为用满窗口宽度 + 紧凑单元格，正常屏幕不出横向滚动条 */
  .page.wide{max-width:none;}
  .page.wide .data-table{font-size:12px;}
  .page.wide .data-table thead th{padding:9px 7px;white-space:normal;line-height:1.2;}
  .page.wide .data-table tbody td{padding:8px 7px;}
  /* 提交页顶部的只读信息卡：两张并排，窄屏叠放 */
  .submit-info{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .submit-info .section-card{margin:0 !important;}
  @media(max-width:1000px){.submit-info{grid-template-columns:1fr;}}
  .pagehead{margin-bottom:18px;}
  .pagehead h1{font-size:19px;margin:0 0 4px;font-weight:600;}
  .pagehead p{margin:0;color:var(--ink-soft);font-size:13px;}
  /* v3 Phase-26（用户）：板块说明默认收起，鼠标悬停或键盘聚焦 ⓘ 时弹出 */
  .pagehead:has(> .info-tip){display:flex;align-items:center;gap:8px;}
  .pagehead:has(> .info-tip) h1{margin:0;}
  .info-tip{position:relative;display:inline-flex;vertical-align:middle;margin-left:4px;cursor:help;outline:none;text-transform:none;letter-spacing:normal;}
  .info-i{width:17px;height:17px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);
    font:italic 700 11px/1 Georgia,'Times New Roman',serif;display:inline-flex;align-items:center;justify-content:center;}
  .info-tip:hover .info-i,.info-tip:focus-visible .info-i{border-color:var(--accent);color:var(--accent);}
  .info-tip:focus-visible .info-i{box-shadow:0 0 0 3px var(--accent-tint);}
  .info-pop{position:absolute;left:-10px;top:calc(100% + 8px);z-index:60;width:max-content;max-width:min(440px,calc(100vw - 40px));padding:10px 12px;
    background:var(--header);color:#E4E6EA;border-radius:8px;box-shadow:0 8px 24px rgba(20,20,22,.18);font-size:12.5px;font-weight:400;font-style:normal;
    line-height:1.5;text-transform:none;letter-spacing:normal;white-space:normal;text-align:left;display:none;pointer-events:none;}
  .info-pop b{color:#fff;}
  .info-pop .mono{color:#fff;}
  /* 字段名旁的小号 ⓘ */
  .info-tip.sm{margin-left:3px;}
  .info-tip.sm .info-i{width:14px;height:14px;font-size:9.5px;}
  .info-tip.sm .info-pop{max-width:min(340px,calc(100vw - 40px));font-size:12px;}
  .export-group{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap;}
  .info-tip:hover .info-pop,.info-tip:focus .info-pop{display:block;}  /* 隐藏时用 display:none：不可见的弹框也会撑宽页面 */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}

  /* ---------- Home / Upload ---------- */
  .home-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:18px;align-items:start;}
  @media(max-width:880px){.home-grid{grid-template-columns:1fr;}}

  .upload-card{padding:22px;}
  .upload-card h2{font-size:14.5px;margin:0 0 3px;font-weight:600;}
  .upload-card .hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 16px;}
  .dropzone{
    border:1.5px dashed var(--border-strong);
    border-radius:8px;
    padding:34px 20px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
    background:#FAFAFB;
  }
  .dropzone:hover{border-color:var(--accent);background:var(--accent-tint);}
  .dropzone .icon{
    width:46px;height:46px;border-radius:10px;background:var(--accent-tint);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  }
  .dropzone .title{font-weight:600;font-size:14px;margin-bottom:3px;}
  .dropzone .example{
    display:inline-block;margin-top:12px;background:var(--gray-tint);color:var(--ink-soft);
    font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;padding:4px 9px;border-radius:5px;
  }
  .dropzone .small{color:var(--ink-faint);font-size:11.5px;margin-top:10px;}

  .upload-progress{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;display:none;}
  .upload-progress.show{display:block;}
  .step-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--ink-faint);}
  .step-row .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;position:relative;}
  .step-row.active{color:var(--ink);}
  .step-row.active .dot{border-color:var(--accent);}
  .step-row.done{color:var(--ink);}
  .step-row.done .dot{border-color:var(--green);background:var(--green);}
  .step-row.done .dot::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .step-row .spinner{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent-tint);border-top-color:var(--accent);position:absolute;top:1px;left:1px;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .upload-success{
    display:none;margin-top:12px;background:var(--green-tint);border:1px solid #BEE3D0;color:var(--green);
    padding:10px 12px;border-radius:6px;font-size:12.5px;font-weight:600;
  }
  .upload-success.show{display:block;}

  .quicksearch-card{padding:22px;margin-top:18px;}
  .quicksearch-card h2{font-size:14.5px;margin:0 0 3px;font-weight:600;}
  .quicksearch-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
  .qs-input-wrap{position:relative;}
  .qs-input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45;}
  .qs-input{
    width:100%;padding:14px 14px 14px 40px;border:1.5px solid var(--border-strong);border-radius:8px;
    font-size:15px;outline:none;background:#FAFAFB;
  }
  .qs-input:focus{border-color:var(--accent);background:#fff;}
  .qs-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .qs-chip{
    background:var(--gray-tint);border:1px solid var(--border);color:var(--ink-soft);font-size:11.5px;
    padding:4px 9px;border-radius:20px;cursor:pointer;
  }
  .qs-chip:hover{border-color:var(--accent);color:var(--accent);}
  .qs-fields{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:12px;color:var(--ink-faint);font-size:11px;}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:880px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);
  }
  .kpi:hover{border-color:var(--accent);transform:translateY(-1px);}
  .kpi .num{font-size:23px;font-weight:700;line-height:1;}
  .kpi .lbl{color:var(--ink-soft);font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:6px;}
  .rag{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}
  .rag.g{background:var(--green);} .rag.y{background:var(--amber);} .rag.r{background:var(--red);} .rag.n{background:var(--gray);} .rag.b{background:#3E5A9C;}

  .side-panel{padding:20px;}
  .side-panel h3{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .activity-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-row .adot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;}
  .activity-row .atxt b{font-weight:600;}
  .activity-row .atime{color:var(--ink-faint);font-size:11px;}


  /* ---------- Filters / Database ---------- */
  .filters-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .filters-bar select, .filters-bar .searchbox{
    border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--ink);
  }
  .filters-bar select{cursor:pointer;}
  .filters-bar .searchbox{flex:1;min-width:180px;position:relative;}
  .filters-bar .searchbox input{border:none;outline:none;width:100%;font-size:12.5px;}
  .filters-bar .resultcount{color:var(--ink-soft);font-size:12px;margin-left:auto;white-space:nowrap;}
  .filters-bar .clearbtn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:6px 4px;border-radius:4px;}
  .filters-bar .clearbtn:hover{text-decoration:underline;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
  .data-table thead th{
    text-align:left;background:#FAFAFB;color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.3px;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .data-table tbody td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .data-table tbody tr{cursor:pointer;}
  .data-table tbody tr:hover{background:var(--accent-tint);}
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;}
  .pn-link{font-weight:600;color:var(--ink);}
  .swat{color:var(--ink-faint);font-size:11px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.approved{background:var(--green-tint);color:var(--green);}
  .badge.rejected{background:var(--red-tint);color:var(--red);}
  .badge.conditional{background:var(--amber-tint);color:var(--amber);}
  .badge.pending{background:#E8EDF7;color:#3E5A9C;}
  .badge.open{background:var(--amber-tint);color:var(--amber);}
  .badge.overdue{background:var(--red-tint);color:var(--red);}
  .badge.closed{background:var(--green-tint);color:var(--green);}
  .badge.noaction{background:var(--gray-tint);color:var(--gray);}
  .badge.resub{background:var(--amber-tint);color:var(--amber);}
  .no-action-txt{color:var(--ink-faint);font-size:12px;}

  .period-toggle{display:inline-flex;background:var(--gray-tint);border-radius:8px;padding:3px;gap:2px;}
  .period-toggle button{border:none;background:transparent;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:5px 12px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s;}
  .period-toggle button:hover{color:var(--ink);}
  .period-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,20,22,.1),0 0 0 1px rgba(20,20,22,.04);}
  .period-week-select{border:1px solid var(--border-strong);border-radius:6px;padding:4px 7px;font-size:11.5px;background:#fff;margin-left:6px;}
  .breakdown-row-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin:22px 0 10px;}
  .tile-row{display:grid;gap:10px;}
  .tile-row.four{grid-template-columns:repeat(4,1fr);}
  .tile-row.three{grid-template-columns:repeat(3,1fr);}
  @media(max-width:880px){.tile-row.four{grid-template-columns:repeat(2,1fr);} .tile-row.three{grid-template-columns:repeat(2,1fr);}}
  .tile{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);}
  .tile:hover{border-color:var(--accent);transform:translateY(-1px);}
  .tile .num{font-size:21px;font-weight:700;}
  .tile .lbl{color:var(--ink-soft);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:5px;}

  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state svg{opacity:.35;margin-bottom:10px;}

  /* ---------- Dashboard ---------- */
  .dash-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:880px){.dash-kpis{grid-template-columns:repeat(2,1fr);}}
  .dashcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.12s;}
  .dashcard:hover{border-color:var(--accent);transform:translateY(-1px);}
  .dashcard .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .dashcard .num{font-size:28px;font-weight:700;}
  .dashcard .lbl{color:var(--ink-soft);font-size:12px;margin-top:6px;}
  .dash-section-title{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:26px 0 10px;}

  .breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:880px){.breakdown-grid{grid-template-columns:1fr;}}
  .breakdown-card{padding:16px 18px;}
  .breakdown-card h4{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:9px;}
  .bar-row .blabel{width:120px;flex:none;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;background:var(--gray-tint);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .bar-num{width:22px;text-align:right;color:var(--ink-faint);font-size:11.5px;}

  /* ---------- Case Detail ---------- */
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);font-size:12.5px;cursor:pointer;margin-bottom:14px;}
  .backlink:hover{color:var(--accent);}
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .detail-header .titles h1{font-size:19px;margin:0 0 4px;font-weight:700;}
  .detail-header .titles .meta{color:var(--ink-soft);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;}
  .detail-header .meta .mono{color:var(--ink-faint);}
  .decision-pill{padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;text-align:center;white-space:nowrap;}

  .detail-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
  @media(max-width:920px){.detail-grid{grid-template-columns:1fr;}}

  .section-card{padding:18px 20px;margin-bottom:16px;}
  .section-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 14px;font-weight:600;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
  .info-item .k{font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
  .info-item .v{font-size:13px;font-weight:500;}
  .discussion-box{background:#FAFAFB;border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-wrap;}
  .followup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
  /* v3 Phase-23：从纪要识别出的待办草稿 */
  .action-drafts{background:#FAFAFB;border:1px dashed var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;}
  .action-drafts-head{font-size:12.5px;color:var(--ink);margin-bottom:6px;}
  .action-draft{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 0;border-top:1px solid var(--border);cursor:pointer;}
  .action-draft input{margin-top:3px;}
  .action-draft .meta{display:block;color:var(--ink-faint);font-size:11.5px;margin-top:2px;}
  .action-drafts-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .link-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;}
  .status-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .status-tile{flex:1;min-width:150px;border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
  .status-tile .k{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;}
  .edit-input{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff;}
  .edit-input:focus{outline:none;border-color:var(--accent);}
  textarea.edit-input{resize:vertical;}

  /* Lifecycle timeline - signature element */
  .timeline-card{padding:20px 22px;}
  .timeline-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 4px;font-weight:600;}
  .timeline-card .sub{color:var(--ink-faint);font-size:11.5px;margin-bottom:18px;}
  .tl{position:relative;padding-left:26px;}
  .tl-item{position:relative;padding-bottom:22px;cursor:pointer;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:'';position:absolute;left:-26px;top:22px;bottom:-2px;width:2px;background:var(--border-strong);}
  .tl-item:last-child::before{display:none;}
  .tl-node{
    position:absolute;left:-33px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 0 0 1.5px var(--border-strong);
  }
  .tl-node.g{background:var(--green);box-shadow:0 0 0 1.5px var(--green);}
  .tl-node.y{background:var(--amber);box-shadow:0 0 0 1.5px var(--amber);}
  .tl-node.r{background:var(--red);box-shadow:0 0 0 1.5px var(--red);}
  .tl-node.b{background:#3E5A9C;box-shadow:0 0 0 1.5px #3E5A9C;}
  .tl-body{background:#FAFAFB;border:1px solid var(--border);border-radius:7px;padding:11px 14px;transition:.12s;}
  .tl-item.selected .tl-body{border-color:var(--accent);background:var(--accent-tint);}
  .tl-item:hover .tl-body{border-color:var(--border-strong);}
  .tl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl-week{font-weight:700;font-size:12.5px;}
  .tl-case{color:var(--ink-faint);font-size:11px;margin-left:6px;}
  .tl-note{color:var(--ink-soft);font-size:12px;margin-top:4px;}
  .tl-select-hint{font-size:10.5px;color:var(--ink-faint);margin-top:14px;text-align:center;}

  .footer-note{margin-top:28px;text-align:center;color:var(--ink-faint);font-size:11px;}

  /* ---------- Submit Case / Approvals ---------- */
  .form-card{padding:22px 24px;}
  .form-card h2{font-size:15px;margin:0 0 4px;font-weight:600;}
  .form-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr;}}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.span2{grid-column:1/-1;}
  .form-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .form-field input, .form-field select, .form-field textarea{
    border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:none;border-color:var(--accent);}
  .form-field textarea{resize:vertical;min-height:64px;}
  .form-actions{margin-top:18px;display:flex;align-items:center;gap:12px;}
  /* 按钮（v3 Phase-26）：同一套圆角、阴影、悬停 / 按下 / 禁用 / 键盘焦点 */
  .btn-primary,.btn-secondary,.btn-danger,.btn-tool{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:7px;
    font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .06s;}
  /* 主 / 次 / 危险按钮内边距与行高一致，并排时同高（小号按钮仍可用内联样式缩小） */
  .btn-primary,.btn-secondary,.btn-danger{line-height:18px;}
  .btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent-dark);padding:8px 18px;font-size:13px;
    box-shadow:0 1px 2px rgba(194,74,8,.28),inset 0 1px 0 rgba(255,255,255,.16);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);padding:8px 15px;font-size:12.5px;box-shadow:0 1px 1px rgba(20,20,22,.05);}
  .btn-secondary:hover{border-color:#AEB3BC;background:#FAFAFB;}
  .btn-primary:active,.btn-secondary:active,.btn-danger:active,.btn-tool:active{transform:translateY(1px);box-shadow:none;}
  .btn-primary:disabled,.btn-secondary:disabled,.btn-danger:disabled,.btn-tool:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-primary:focus-visible,.btn-secondary:focus-visible,.btn-danger:focus-visible,.btn-tool:focus-visible,
  .btn-danger-sm:focus-visible,.remind-btn:focus-visible,.period-toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* 工具栏按钮：导出等，图标 + 文字，高度与筛选框对齐 */
  .btn-tool{height:32px;padding:0 11px;background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);font-size:12px;box-shadow:0 1px 1px rgba(20,20,22,.05);}
  .btn-tool svg{flex:none;color:var(--ink-soft);transition:color .15s;}
  .btn-tool:hover{border-color:#AEB3BC;background:#FAFAFB;}
  .btn-tool:hover svg{color:var(--accent);}
  .btn-tool:disabled{cursor:progress;}
  .btn-danger{background:var(--surface);color:var(--red);border:1px solid #EFC2BC;padding:8px 15px;font-size:12.5px;}
  .btn-danger:hover{background:var(--red-tint);border-color:#E3A59D;}
  .action-note{font-size:12px;color:var(--ink-faint);}
  .form-field input[readonly]{background:#F4F4F6;color:var(--ink-soft);cursor:default;}
  .submit-banner{display:none;margin-top:14px;background:var(--green-tint);border:1px solid #BEE3D0;color:var(--green);padding:10px 12px;border-radius:6px;font-size:12.5px;font-weight:600;}
  .submit-banner.show{display:block;}
  /* v3 Phase-5：演示文件拖拽区与文件列表 */
  .file-drop{border:1.5px dashed var(--border);border-radius:8px;padding:16px;text-align:center;font-size:12.5px;color:var(--ink-soft);background:#FAFAFB;}
  .file-drop.over{border-color:var(--accent);background:var(--accent-tint, #FFF4EC);}
  .link-btn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit;text-decoration:underline;}
  /* 待办反馈与关闭审批（v3 Phase-14） */
  .fb-section{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;}
  .fb-entry{border-left:3px solid var(--border-strong);padding:6px 10px;margin:6px 0;font-size:12px;}
  .fb-entry.approved{border-color:var(--green);} .fb-entry.rejected{border-color:var(--red);} .fb-entry.pending{border-color:var(--amber);}
  .fb-head{color:var(--ink-soft);font-size:11.5px;margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .fb-text{white-space:pre-wrap;}
  .fb-decision{margin-top:4px;font-size:11.5px;}
  .fb-meta{color:var(--ink-faint);font-size:10.5px;}
  .fb-panel{background:#FAFAFB;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:8px;}
  .fb-panel textarea.edit-input{min-height:64px;}
  .fb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .fb-actions button{padding:6px 12px;font-size:12px;}
  .fb-err{font-size:11.5px;color:var(--red);font-weight:600;}
  .fb-closure{font-size:11.5px;color:var(--green);font-weight:600;margin-bottom:4px;}
  .fb-hint{font-size:11px;color:var(--ink-faint);}
  .file-list{list-style:none;margin:10px 0 0;padding:0;}
  /* v3 Phase-18（领导：文件名竖排成一字一行）：文件名占满一行、按需折行，元信息另起一行，删除按钮靠右跨两行 */
  .file-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:12.5px;}
  .file-list li:first-child{border-top:none;}
  .file-list .fname{grid-column:1;min-width:0;overflow-wrap:anywhere;word-break:normal;}
  .file-list .fmeta{grid-column:1;color:var(--ink-faint);font-size:11.5px;overflow-wrap:anywhere;}
  .file-list .fremove{grid-column:2;grid-row:1 / span 2;}
  .lib-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}
  .lib-pick select{flex:1 1 260px;min-width:0;max-width:520px;}
  .auto-cats{margin-top:6px;font-size:11px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .data-table th.sortable-th{white-space:nowrap;}
  .data-table th.sortable-th.active{color:var(--ink);}
  .dash-year-select{border:1px solid var(--border-strong);border-radius:6px;padding:4px 7px;font-size:11.5px;background:#fff;}
  .fn-sub{display:block;font-size:10.5px;color:var(--ink-faint);font-weight:400;}
  .problem-list{margin:6px 0 0;padding-left:18px;font-weight:600;}
  .upload-kind{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--ink);border-top:1px solid var(--border);padding-top:14px;}
  .upload-kind span{font-weight:400;color:var(--ink-faint);font-size:12px;margin-left:6px;}
  .pres-results{margin-top:8px;font-size:12px;}
  .pres-results li{margin:2px 0;}
  .problem-list li{margin:2px 0;}
  .week-move{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .week-move input{max-width:180px;}
  .commodity-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;}
  .commodity-grid .bar-row .blabel{width:190px;}
  @media(max-width:880px){.commodity-grid{grid-template-columns:1fr;}}
  .block-warning{display:none;margin-top:8px;background:var(--red-tint);border:1px solid #EFC2BC;color:var(--red);padding:9px 12px;border-radius:6px;font-size:12px;font-weight:600;}
  .screening-section{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}
  .screening-section h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 14px;font-weight:600;}

  .mysub-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .mysub-row:last-child{border-bottom:none;}
  .mysub-reason{color:var(--red);font-size:11.5px;margin-top:2px;}

  .appr-card{padding:16px 18px;margin-bottom:14px;}
  .appr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .appr-top .who{font-size:12px;color:var(--ink-faint);}
  .appr-title{font-weight:700;font-size:14px;}
  .appr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 18px;font-size:12.5px;margin-bottom:10px;}
  @media(max-width:700px){.appr-grid{grid-template-columns:1fr 1fr;}}
  .appr-actions{display:flex;gap:10px;margin-top:10px;}
  .reject-box{display:none;margin-top:10px;}
  .reject-box.show{display:block;}
  .reject-box textarea{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:8px;font-size:12.5px;font-family:inherit;min-height:54px;}
  .decided-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .decided-row:last-child{border-bottom:none;}

  /* ---------- Follow-ups tracker ---------- */
  .sortable-th{cursor:pointer;user-select:none;}
  .sortable-th:hover{color:var(--ink);}
  .sortable-th .arrow{font-size:9px;margin-left:3px;}
  .cat-tag{display:inline-block;background:var(--gray-tint);color:var(--ink-soft);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
  .cat-tag.none{background:transparent;color:var(--ink-faint);font-weight:400;}
  .remind-btn{background:#fff;border:1px solid var(--border-strong);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 1px rgba(20,20,22,.05);transition:border-color .15s,color .15s,background .15s;}
  .remind-btn:hover{border-color:var(--accent);color:var(--accent);background:#FFFBF8;}
  .remind-btn.sent{background:var(--green-tint);border-color:#BEE3D0;color:var(--green);cursor:default;}
  .due-overdue{color:var(--red);font-weight:700;}

  /* 窄窗口与缩放：导航独占一行，账号按钮跟在标题后面。去掉顶部搜索后一行放得下的宽度更小，门槛从 1100 降到 980 */
  @media(max-width:980px){
    .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:6px 10px;}
    .brand{flex:1 1 auto;}
    .brand .sub{display:none;}
    .admin-toggle{order:2;margin-left:0;}
    .navtabs{order:3;flex:1 0 100%;width:100%;margin-left:0;}
  }
  @media(max-width:700px){
    .brand{font-size:13.5px;flex-basis:100%;}
    .page{padding:16px 12px 40px;}
    .info-grid{grid-template-columns:1fr;}
    .status-row{flex-direction:column;}
    .appr-actions{flex-wrap:wrap;}
    .form-actions{flex-wrap:wrap;}
    .filters-bar .searchbox{min-width:100%;}
    .followup-grid{grid-template-columns:1fr;}
    .mysub-row,.decided-row{flex-wrap:wrap;}
    .detail-header > div:last-child{flex-wrap:wrap;}
    .confirm-inline{flex-wrap:wrap;white-space:normal;}

<script>
/* ============================= DATA MODEL ============================= */
const REGIONS = ["AP","EU","NA"];
const CLUSTERS = ["Chemical","Metal","Electronics, EA and Pyro"];
// Part types are only used to generate realistic sample part descriptions; each maps to a Cluster.
const PART_TYPES = ["Inflators & Gas Generators","Seatbelt Webbing","Electronic Control Units","Steering Wheel Modules","Pretensioner Mechanisms","Airbag Cushions & Fabric","Buckle & Latch Systems","Plastics & Housings","Castings & Stampings","Wiring Harness & Connectors"];
const CLUSTER_OF = {"Inflators & Gas Generators":"Electronics, EA and Pyro","Seatbelt Webbing":"Chemical","Electronic Control Units":"Electronics, EA and Pyro","Steering Wheel Modules":"Metal","Pretensioner Mechanisms":"Electronics, EA and Pyro","Airbag Cushions & Fabric":"Chemical","Buckle & Latch Systems":"Metal","Plastics & Housings":"Chemical","Castings & Stampings":"Metal","Wiring Harness & Connectors":"Electronics, EA and Pyro"};
const SUPPLIERS = ["Meridian Safety Components","Hanwa Precision Mfg.","Delta Restraint Systems","Nordic Webbing Co.","TriStar Electronics","Yueda Precision Mfg.","Continental Fastener Group","Orion Gas Systems","Baltic Stamping Works","Summit Plastics Ltd.","Cascade Molding Inc.","Pinnacle Sensor Technologies"];
const PROJECTS = ["SPR9 Program","ACR9 Program","CLS8 Program","Gen6 Restraint Platform","NextGen Steering Wheel","Global Buckle Program","ACR8 Refresh","China Local-for-Local Gen5"];
const PRESENTERS = ["W. Chen","M. Okafor","L. Novak","R. Fischer","S. Iyer","J. Park","A. Baptiste","H. Meyer"];
// Contact directory (prototype). In production this comes from the corporate directory / Entra ID.
const CONTACTS = {"W. Chen":"w.chen@zf.com","M. Okafor":"m.okafor@zf.com","L. Novak":"l.novak@zf.com","R. Fischer":"r.fischer@zf.com",
  "S. Iyer":"s.iyer@zf.com","J. Park":"j.park@zf.com","A. Baptiste":"a.baptiste@zf.com","H. Meyer":"h.meyer@zf.com","K. Reyes":"k.reyes@zf.com"};
// v3 Phase-23：纪要 → 待办草稿（服务端解析）。草稿挂在当前 editBuffer 上：取消 / 保存 / 换案例后自然失效
function actionDraftsHtml(){
  const d = state.actionDrafts;
  if(!d || d.buffer!==state.editBuffer) return '';
  if(!d.items.length) return `<div class="action-drafts"><div class="action-drafts-head">No numbered action items found in the Committee Discussion. Write them as "1. Task -- Owner by dd.mm.yyyy", one per line.</div>
    <div class="action-drafts-actions"><button class="btn-secondary" id="discardDraftsBtn">Close</button></div></div>`;
  const picked = d.items.filter(i=>i.checked).length;
  return `<div class="action-drafts">
    <div class="action-drafts-head">Found ${d.items.length} action item${d.items.length===1?'':'s'} in the Committee Discussion. Tick the ones to add, then fill in each reminder email and check the due dates before saving.</div>
    ${d.items.map((i,k)=>`<label class="action-draft"><input type="checkbox" data-draft="${k}" ${i.checked?'checked':''}/>
      <span>${esc(i.task)}${i.duplicate?' <em style="color:var(--ink-faint);">(already in the list)</em>':''}
        <span class="meta">Owner: ${esc(i.responsible||'—')} · Due: ${i.dueDate ? esc(i.dueDate)+(i.dueEstimated?` (estimated from "${esc(i.dueText)}")`:'') : '—'}</span></span></label>`).join('')}
    <div class="action-drafts-actions">
      <button class="btn-primary" id="addDraftsBtn" ${picked?'':'disabled'}>${draftsButtonLabel(picked)}</button>
      <button class="btn-secondary" id="discardDraftsBtn">Discard</button>
    </div>
  </div>`;
}
function draftsButtonLabel(n){ return `Add ${n} selected as follow-up task${n===1?'':'s'}`; }
function emailFor(name){
  if(!name) return '';
  if(CONTACTS[name]) return CONTACTS[name];
  if(/@/.test(name)) return name.trim();
  // 不按姓名猜地址：猜出的域名常常不对，宁可显示 "no email on file"
  return '';
}
const REMINDER_CHANNELS = ['Email','Teams','Email + Teams'];
// Direct link to one case: this page + #case/<SWAT id>. Opening the link lands on that case (see hash routing at startup).
function caseLink(swatId){ return (typeof location!=='undefined' ? location.href.split('#')[0] : '') + '#case/' + encodeURIComponent(swatId); }
// One message body for both Email and Teams — enough context to act without opening the Cockpit.
function reminderMessage(c, t){
  return [
    'Follow-up Task for Sourcing Case',
    '',
    'Part Description: ' + (c.partDescription||'—'),
    'Part Number: ' + (c.partNumber||'—') + ((c.partNumbers&&c.partNumbers.length>1) ? ' (+' + (c.partNumbers.length-1) + ' more)' : ''),
    'SWAT Case: ' + c.swatId,
    '',
    'Follow-up Task: ' + (t.task||'—'),
    'Note: ' + (t.notes||'—'),
    '',
    'Due Date: ' + (t.dueDate||'—'),
    'Owner: ' + (ownerLabel(t)||'—'),
    '',
    'Open Action Case: ' + caseLink(c.swatId)
  ].join('\n');
}
function taskRecipient(t){ return {name: t.notify||t.responsible||'', email: t.notifyEmail||emailFor(t.notify||t.responsible), cc: t.cc||'', channel: t.channel||'Email + Teams'}; }
const SOURCING_TYPES = ["New","C/O","GCS"];
const DECISION_LEVELS = ["Level 2","Level 3","Level 4"];
// Family options are a first draft — to be confirmed/extended later.
const FAMILY_OPTIONS = ["N/A","Family Standard","Pelvic","Family 8","Family 6","Webbing"];
const DECISION_OPTIONS = [{v:"PENDING",l:"Pending"},{v:"APPROVED",l:"Approved"},{v:"CONDITIONAL APPROVAL",l:"Conditional Approval"},{v:"REJECTED",l:"Rejected"}];
// Illustrative only — meant to be redefined to match your own taxonomy. Multi-select: an action can carry more than one tag
// so it surfaces under every relevant filter later (e.g. a case that's both Cost- and Timing-related).
const ACTION_TAGS = ["Cost","Volume","Timing","Quality","Capacity","Commercial Terms","Compliance / Documentation"];
// 反馈 PPT 第 4 页的八个固定分类。v3 Phase-18（领导）：编辑页不再手点，分类由关键词自动判定（categorizeTask），标签回到自由文本
const ACTION_CATEGORIES = ["CQA","Volume","Technical","Timing","Supplier strategy","BPG","Saving","Further VAVE"];
// 反馈 PPT 第 2、3 页：商务字段（金额按提交币种填写，服务端折算欧元；件价保留 4 位小数）
const TOOLING_PAYMENTS = ["Lumpsum","MPC","No tooling involved"];  // v3 Phase-19：没有模具的案例
const BPG_THRESHOLD_EUR = 3000000; // Lifetime Spend 超过 3 Mio EUR 必须有 BPG
// 反馈人 MM 模板（2026-09-24）：件价 / 模具费 / 产量按零件行填写；案例级只剩摊销总额
const ROW_MONEY_KEYS = ["pcPriceCQA","supplierPriceLanded","toolingCQA","supplierToolingCost"];
const ROW_INT_KEYS = ["averageVolume","lifetimeVolume"];
// v3 Phase-15（领导要求）：项目 / 寻源类型 / 推荐供应商按零件行；Peak Year / Lifetime Spend 按整个 bundle 在案例级
const ROW_BUNDLE_KEYS = ["project","sourcingType","recommendedSupplier"];
const COMMERCIAL_MONEY_KEYS = ["amortizationTotal"];
const COMMERCIAL_TEXT_KEYS = ["toolingPayment","bpgAvailable","fraAvailable","belowCQA","cqaJustification","strategicSupplier","ltaAvailable","usmcaEligible"];
const COMMERCIAL_INT_KEYS = ["fotLeadTimeWeeks","ppapLeadTimeWeeks","amortizationPcs","annualCapacity","lifetimeCapacity"];

// 周号用 ISO 周（德国 KW，v3 Phase-13）：周一开始，跨年周归属周四所在的年份。
// Week labels are anchored to the current year (was hardcoded 2026, which mislabeled every week after the year rolled over).
function weekYear(){ return getNATime().getFullYear(); }
// ISO 周 w 的周三（委员会开会日），用于没有会议日期的案例与 Dashboard 周选择
function weekDate(w){
  const jan4 = new Date(weekYear(),0,4);
  const monday1 = new Date(weekYear(),0,4-((jan4.getDay()+6)%7));
  const d = new Date(monday1.getFullYear(),monday1.getMonth(),monday1.getDate()+(w-1)*7+2);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function wk(w, year=weekYear()){ return year+"-KW"+String(w).padStart(2,'0'); }
// v3 Phase-18（领导：2025 年的 KW51 被显示成 2026-KW51）：周标签、周筛选、驾驶舱都按案例自己的年份。
// meetingYear 是导入 / 确认登记时记下的会议年份；没有的按会议日期算；模板演示数据两样都没有，按当年。
function caseYear(c){
  if(c && c.meetingYear) return Number(c.meetingYear);
  const iso = c && c.meetingDateISO;
  if(iso && /^\d{4}-\d{2}-\d{2}$/.test(iso)) return isoWeekYear(new Date(iso+'T12:00:00'));
  if(c && c.meetingDateLabel){ const d = new Date(c.meetingDateLabel); if(!isNaN(d)) return isoWeekYear(d); }
  return weekYear();
}
function caseWeekLabel(c){ return wk(c.weekNum, caseYear(c)); }
function weekKey(c){ return caseYear(c)*100 + Number(c.weekNum||0); }
function weekKeyOf(year, w){ return Number(year)*100 + Number(w); }
function weekDateOf(w, year){
  const jan4 = new Date(year,0,4);
  const monday1 = new Date(year,0,4-((jan4.getDay()+6)%7));
  const d = new Date(monday1.getFullYear(),monday1.getMonth(),monday1.getDate()+(w-1)*7+2);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function yearsPresent(){ return uniq(ALL_CASES.map(caseYear)).sort((a,b)=>a-b); }
// 待办分类规则由服务端随 bootstrap 下发（logic.task_rules）：编辑页实时预览与保存结果一致
let TASK_RULES = {categories: ACTION_CATEGORIES, keywords: {}, tagSynonyms: {}, functions: []};
function keywordRe(k){
  const escaped = k.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
  return new RegExp(k.length<=4 ? `(?<![a-z0-9])${escaped}(?![a-z])` : `(?<![a-z0-9])${escaped}`);
}
function categorizeTask(t){
  const tags = (t.tags||[]).map(x=>String(x).trim().toLowerCase()).filter(Boolean);
  const text = [t.task||'', tags.join(' '), t.notes||''].join(' ').toLowerCase();
  const hits = new Set(tags.map(x=>TASK_RULES.tagSynonyms[x]).filter(Boolean));
  Object.entries(TASK_RULES.keywords||{}).forEach(([cat, words])=>{ if(words.some(w=>keywordRe(w).test(text))) hits.add(cat); });
  return (TASK_RULES.categories||ACTION_CATEGORIES).filter(c=>hits.has(c));
}
function taskCategories(t){ return Array.isArray(t.categories) ? t.categories : categorizeTask(t); }
function splitTags(text){ return String(text||'').split(',').map(x=>x.trim()).filter(Boolean); }
function autoCatsHtml(cats){ return `Auto categories: ${cats.length ? cats.map(c=>`<span class="cat-tag">${esc(c)}</span>`).join(' ') : '<span class="cat-tag none">none yet — type the task or tags</span>'}`; }
function functionDatalist(){
  const names = uniq([...(TASK_RULES.functions||[]), ...ALL_CASES.flatMap(c=>(c.followUps||[]).map(t=>t.ownerFunction||''))].map(x=>x.trim()).filter(Boolean));
  return `<datalist id="functionOptions">${names.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('')}</datalist>`;
}
// v3 Phase-29：负责人统一显示全名（服务端按注册账号名字、或从邮箱推出的名字算好，放在 ownerName）
function ownerLabel(t){ return (t && (t.ownerName || t.responsible)) || ''; }
// 职能跟着人走：同一个人（全名或原文，忽略大小写）只有一种职能时才收录；编辑时填了负责人就带出来
const FUNCTION_TIP = 'A person has one function: changing it here updates all of this owner\'s follow-ups, and other follow-ups for the same owner fill it in automatically.';
function personKey(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function functionForOwner(owner){
  const key = personKey(owner); if(!key) return '';
  const fns = new Set();
  ALL_CASES.forEach(c=>(c.followUps||[]).forEach(t=>{
    const fn = (t.ownerFunction||'').trim();
    if(fn && (personKey(t.ownerName)===key || personKey(t.responsible)===key)) fns.add(fn);
  }));
  return fns.size===1 ? [...fns][0] : '';
}
// 负责人输入框改了：职能框空着、或还是上一个负责人的职能，就换成新负责人的职能（新负责人没有职能就清空）
function wireOwnerFunction(ownerId, functionId){
  const owner = document.getElementById(ownerId), fn = document.getElementById(functionId);
  if(!owner || !fn) return;
  let prev = owner.value;
  owner.addEventListener('change', ()=>{
    const was = functionForOwner(prev), now = functionForOwner(owner.value), cur = fn.value.trim();
    if(!cur || (was && cur===was)) fn.value = now;
    prev = owner.value;
  });
}
// 已决议案例的待办，一条一项（驾驶舱三格与 by function / by owner 图都数这个）
function decidedTasks(cases){ return cases.filter(c=>c.meetingDecision!=='PENDING').flatMap(c=>(c.followUps||[]).map(t=>({c,t}))); }
function countBy(items, keyFn){ const m = {}; items.forEach(x=>{ const k = keyFn(x) || '—'; m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
// 该日期所在周的周四：ISO 周号与周年份都按它算
function isoThursday(d){ return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7))); }
function isoWeekYear(d){ return isoThursday(d).getUTCFullYear(); }
function dateToWeekNum(d){
  const thu = isoThursday(d);
  return Math.floor((thu - Date.UTC(thu.getUTCFullYear(),0,1)) / (7*86400000)) + 1;
}
function localDateISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function formatDateLong(d){
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
// Reference time zone for dates ("today", due-date marking, registration cutoff): the server's
// SC_TIMEZONE, mirrored here via the bootstrap snapshot — so both ends agree on what "today" is.
// Defaults to North America (Eastern) per the template when the server doesn't say otherwise.
function getNATime(){
  const now = new Date();
  const tz = SERVER_TZ || 'America/New_York';
  try{ return new Date(now.toLocaleString('en-US', {timeZone: tz})); }
  catch(e){ return new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'})); }
}
// Committee meets every Wednesday. Registration for a given Wednesday closes `daysBefore` days earlier at
// `cutoffTime` in the cutoff timezone (admin-configurable on the Dashboard; default Monday 23:59 server time).
// Once that cutoff passes, the earliest selectable meeting moves to the following Wednesday.
function nowInZone(tz){
  const now = new Date();
  try{ return new Date(now.toLocaleString('en-US', {timeZone: tz})); }
  catch(e){ return getNATime(); }
}
function cutoffZone(){ return REGISTRATION_SETTINGS.timezone || SERVER_TZ || 'America/New_York'; }
function registrationCutoffFor(wednesday){
  const [hh, mm] = String(REGISTRATION_SETTINGS.cutoffTime||'23:59').split(':').map(Number);
  return new Date(wednesday.getFullYear(), wednesday.getMonth(), wednesday.getDate() - (Number(REGISTRATION_SETTINGS.daysBefore)||2), hh, mm, 59, 999);
}
function registrationOpenFor(wednesday){ return nowInZone(cutoffZone()) <= registrationCutoffFor(wednesday); }
function nextWednesdayOnOrAfterToday(){
  const now = nowInZone(cutoffZone());
  const diffToWed = (3 - now.getDay() + 7) % 7;
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToWed);
}
function getEarliestSelectableWednesday(){
  const candidate = nextWednesdayOnOrAfterToday();
  if(!registrationOpenFor(candidate)) candidate.setDate(candidate.getDate() + 7);
  return candidate;
}
// 本周会议已过截止时返回那个周三（可申请例外登记），否则 null
function blockedWednesday(){
  const candidate = nextWednesdayOnOrAfterToday();
  return registrationOpenFor(candidate) ? null : candidate;
}
function cutoffRuleLabel(){
  const weekday = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][(3 - (Number(REGISTRATION_SETTINGS.daysBefore)||2) + 7) % 7];
  return `${weekday} ${REGISTRATION_SETTINGS.cutoffTime||'23:59'} (${cutoffZone()})`;
}
function meetingOptionsHtml(includeBlocked){
  const blocked = includeBlocked ? blockedWednesday() : null;
  const opts = upcomingWednesdays(12).map(d=>`<option value="${localDateISO(d)}">${wk(dateToWeekNum(d), isoWeekYear(d))} — ${formatDateLong(d)}</option>`);
  if(blocked) opts.unshift(`<option value="${localDateISO(blocked)}" data-late="1">${wk(dateToWeekNum(blocked), isoWeekYear(blocked))} — ${formatDateLong(blocked)} (deadline passed — exception)</option>`);
  return opts.join('');
}
function upcomingWednesdays(count){
  const first = getEarliestSelectableWednesday();
  const out = [];
  for(let i=0;i<count;i++){
    const d = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i*7);
    out.push(d);
  }
  return out;
}

/* ---- Generated single-appearance filler cases (baseline dataset) ---- */
function seededRand(seed){ let s = seed; return ()=>{ s = (s*1103515245+12345) & 0x7fffffff; return s/0x7fffffff; }; }
function pick(arr,r){ return arr[Math.floor(r()*arr.length)]; }
function pickTags(r){
  const first = pick(ACTION_TAGS,r);
  if(r()<0.45){
    let second = pick(ACTION_TAGS,r);
    let guard=0; while(second===first && guard++<5){ second = pick(ACTION_TAGS,r); }
    return second===first ? [first] : [first, second];
  }
  return [first];
}

function generateBatch(count, weekRangeStart, weekRangeEnd, seed, swatStart){
  const r = seededRand(seed);
  const out = [];
  const decisions = ['APPROVED','APPROVED','APPROVED','CONDITIONAL APPROVAL','REJECTED','PENDING'];
  for(let i=0;i<count;i++){
    const w = weekRangeStart + Math.floor(r()*(weekRangeEnd-weekRangeStart+1));
    const dec = pick(decisions,r);
    const partType = pick(PART_TYPES,r);
    const cluster = CLUSTER_OF[partType];
    const region = pick(REGIONS,r);
    const supplier = pick(SUPPLIERS,r);
    const project = pick(PROJECTS,r);
    let caseStatus, actionStatus, followUpStatus, closureStatus, discussion;
    if(dec==='REJECTED'){
      caseStatus='Resubmission Required'; actionStatus=pick(['Open','Overdue','Closed'],r);
      discussion='Committee did not approve the recommendation as presented; cost or capacity position did not meet the target threshold and a resubmission was requested.';
    } else if(dec==='PENDING'){
      caseStatus='Open'; actionStatus=null; // not reviewed yet — no post-decision actions exist
      discussion='Pending for Sourcing Committee Review';
    } else if(dec==='CONDITIONAL APPROVAL'){
      caseStatus='Approved'; actionStatus=pick(['Open','Overdue','Closed'],r);
      discussion='Committee approved the recommendation subject to a follow-up item being closed out before production release.';
    } else {
      caseStatus= (r()<0.5?'Approved':'Closed'); actionStatus= (caseStatus==='Closed'? null : pick([null,'Closed'],r));
      discussion='Committee reviewed the sourcing recommendation and approved it without conditions; cost, quality and capacity positions were all satisfactory.';
    }
    followUpStatus = actionStatus;
    closureStatus = (actionStatus==='Closed' || actionStatus===null) ? 'Closed' : 'Open';
    const swatId = 'SWAT-'+(swatStart+i);
    const pn = String(10000000 + Math.floor(r()*89999999));
    out.push(mkCase({
      weekNum:w, caseNumber: 1+Math.floor(r()*9), swatId, partNumber:pn,
      partDescription: pick(partTypeDescriptions(partType),r),
      region, project, family: partType, cluster,
      parentPF: 'PF-'+Math.floor(1000+r()*8999), partFamilyCode:'PF-'+Math.floor(1000+r()*8999),
      sourcingType: pick(SOURCING_TYPES,r), recommendedSupplier: supplier, presenter: pick(PRESENTERS,r),
      decisionLevel: pick(DECISION_LEVELS,r),
      peakYearSpend: Math.floor(200000+r()*4500000), leadTime: (4+Math.floor(r()*16))+' weeks',
      lifetimeSpend: Math.floor(800000+r()*20000000),
      committeeDiscussion: discussion, meetingDecision: dec, caseStatus, actionStatus,
      followUps: actionStatus===null ? [] : [{
        id:'FU-GEN-'+swatId, task: pick(['Submit updated quality certification','Confirm capacity commitment in writing','Provide revised cost breakdown','Complete supplier audit follow-up','Submit PPAP documentation'],r),
        responsible: pick(PRESENTERS,r), dueDate: weekYear()+'-'+String(6+Math.floor(r()*3)).padStart(2,'0')+'-'+String(1+Math.floor(r()*27)).padStart(2,'0'),
        notes:'Tracked with responsible buyer; status updated at next committee cycle.', status: followUpStatus, tags: pickTags(r), notify:'', cc:''
      }],
      closure: {status: closureStatus, closureDate: closureStatus==='Closed' ? weekYear()+'-'+String(6+Math.floor(r()*3)).padStart(2,'0')+'-'+String(1+Math.floor(r()*27)).padStart(2,'0') : '—',
        closureComment: closureStatus==='Closed' ? 'Follow-up item resolved and evidenced.' : '—',
        closureEvidence: closureStatus==='Closed' ? 'Evidence_'+swatId+'.pdf' : '—'}
    }));
  }
  return out;
}

function caseNoStatus(v){ const id=normalizeCaseNo(v); if(!id) return null; const n=ALL_CASES.filter(c=>c.swatId===id).length; return {id, existing:n>0, priorEntries:n}; }

  const nums = SUBMISSIONS.map(s=>Number(String(s.subId).replace('SUB-',''))).filter(n=>!isNaN(n));

/* ===================== Server API layer (persistence) =====================
   The server is the single source of truth. Every write goes through a command
   endpoint; its response carries a full snapshot that wholesale-replaces the
   in-memory state before re-render. 422 detail messages reuse the template's
   own validation texts. */
const API = {
  token: null,
  pendingWrites: 0,
  writeVersion: 0,
  // 登录令牌存 localStorage：关掉标签页再打开仍是登录状态（服务端 7 天过期）；存储被禁用时只留在内存里
  sessionToken(){
    if(this.token!==null) return this.token;
    try{ return localStorage.getItem('sc_session_token') || ''; }catch(e){ return ''; }
  },
  setSessionToken(token){
    this.token = token || '';
    try{ if(this.token) localStorage.setItem('sc_session_token', this.token); else localStorage.removeItem('sc_session_token'); }catch(e){}
  },
  async request(method, path, body){
    const headers = {'Content-Type':'application/json'};
    const tok = this.sessionToken();
    if(tok) headers['X-Session-Token'] = tok;
    const writing = method!=='GET';
    if(writing){ this.pendingWrites++; this.writeVersion++; }
    try{
      const res = await fetch(path, {method, headers, body: body===undefined ? undefined : JSON.stringify(body)});
      const j = await res.json().catch(()=>null);
      if(res.status===401 && !path.startsWith('/api/auth/') && tok===this.sessionToken()){
        // Login token rejected (expired / logged out elsewhere / account disabled) — drop to the logged-out view.
        const hadToken = !!tok;
        this.setSessionToken('');
        setCurrentUser(null);
        renderNav();
        if(hadToken){
          toast('Your login has expired — please log in again.');
          // Spec v2-admin-gate: drop to the user view AND re-render. Guarded so an in-progress
          // editor / panel / submit form is never wiped mid-interaction.
          if(!state.detailEditMode && !state.remindOpenId && !state.followupEditId && !state.pendingDeleteId && !state.feedbackOpenId && !state.decisionOpenId && !state.formDirty && !document.querySelector('.reject-box.show') && state.view!=='submit' && document.getElementById('app')) render();
        }
      }
      if(!res.ok){
        const raw = j && j.detail;
        const detail = typeof raw==='string' ? raw : Array.isArray(raw)
          ? raw.map(e=>[...(e.loc||[]).filter(k=>k!=='body'), e.msg||'Invalid value'].join(': ')).join('; ')
          : 'Request failed: '+res.status;
        throw Object.assign(new Error(detail), {status:res.status, detail});
      }
      if(!j || typeof j!=='object') throw new Error('The server returned an invalid response. Please try again.');
      return j;
    }finally{ if(writing) this.pendingWrites--; }
  },
  get(p){ return this.request('GET', p); },
  post(p,b){ return this.request('POST', p, b); },
  put(p,b){ return this.request('PUT', p, b); },
  del(p){ return this.request('DELETE', p); },
};

function todayISO(){ return localDateISO(getNATime()); }
function daysBetweenISO(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
// When will this task next get an automatic reminder? (null = never under current rules)
function nextReminderDate(t){
  const S = REMINDER_SETTINGS; if(!S.enabled) return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')) return null;
  const today = todayISO();
  const addDays = (iso,n)=>{ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const remindedToday = t.lastAutoReminderDate===today;
  const cands = [];
  if(Number(S.daysBefore)>0) cands.push(addDays(t.dueDate, -Number(S.daysBefore)));
  if(S.onDueDate) cands.push(t.dueDate);
  if(Number(S.overdueEveryDays)>0){ const k = Number(S.overdueEveryDays); for(let i=1;i<=52;i++) cands.push(addDays(t.dueDate, i*k)); }
  const future = cands.filter(d=> d>today || (d===today && !remindedToday)).sort();
  return future[0]||null;
}
// Returns {overdueMarked, sent, overdueTotal, openTotal}. force=true re-runs today's check even if it already ran.
function runDailyReminderCheck(force){
  const today = todayISO();
  const S = REMINDER_SETTINGS;
  let overdueMarked = 0, sent = 0;
  ALL_CASES.forEach(c=>{
    if(c.meetingDecision==='PENDING') return;                     // not reviewed yet — no actions exist
    (c.followUps||[]).forEach(t=>{
      if(!(t.status==='Open' || t.status==='Overdue')) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')) return;      // no usable due date
      const daysUntil = daysBetweenISO(today, t.dueDate);          // negative = overdue
      if(daysUntil < 0 && t.status==='Open'){ t.status='Overdue'; overdueMarked++; }
      if(!S.enabled) return;
      if(t.lastAutoReminderDate===today) return;                    // never twice in one day
      let trigger = null;
      if(daysUntil===Number(S.daysBefore) && Number(S.daysBefore)>0) trigger = 'Due in '+S.daysBefore+' days';
      else if(daysUntil===0 && S.onDueDate) trigger = 'Due today';
      else if(daysUntil<0 && Number(S.overdueEveryDays)>0 && ((-daysUntil) % Number(S.overdueEveryDays))===0) trigger = 'Overdue by '+(-daysUntil)+' days';
      if(!trigger) return;
      const rc = taskRecipient(t);
      const cc = [rc.cc, S.alwaysCc].filter(Boolean).join(', ');
      const channel = t.channel || S.channel;
      const entry = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), trigger, swatId:c.swatId, task:t.task, to:rc.email||'(no email on file)', cc, channel, message: reminderMessage(c,t) };
      AUTO_LOG.unshift(entry); if(AUTO_LOG.length>200) AUTO_LOG.pop();
      t.lastAutoReminderDate = today;
      t.lastReminder = { when: entry.when, channel, to: entry.to, message: entry.message, auto:true };
      REMINDED.add(t.id);
      sent++;
    });
    c.actionStatus = rollupActionStatus(c.followUps);
  });
  let overdueTotal=0, openTotal=0;
  ALL_CASES.forEach(c=>{ if(c.meetingDecision==='PENDING') return; (c.followUps||[]).forEach(t=>{ if(t.status==='Overdue') overdueTotal++; if(t.status==='Open') openTotal++; }); });
  S.lastRunDate = today;
  S.lastRun = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), auto: !force, overdueMarked, sent, overdueTotal, openTotal };
  saveReminderSettings();
  return {overdueMarked, sent, overdueTotal, openTotal};
}
function dailyCheckIfDue(){ if(REMINDER_SETTINGS.lastRunDate!==todayISO()) { const r = runDailyReminderCheck(false); if((r.sent||r.overdueMarked) && typeof render==='function' && document.getElementById('app')) render(); } }

async function uploadSubmissionFiles(subId, key, list, doneText){
  const banner = (text, warn)=>{

// 上传单个文件（请求体就是文件字节）；用 XHR 是为了拿到上传进度
function uploadFile(url, file, headers, onProgress){
  API.pendingWrites++; API.writeVersion++;
  return new Promise((resolve, reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    Object.entries(headers||{}).forEach(([k,v])=>{ if(v) xhr.setRequestHeader(k, v); });
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e=>{ if(e.lengthComputable && onProgress) onProgress(e.loaded/e.total); };
    xhr.onload = ()=>{
      let j = null; try{ j = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && j) return resolve(j);
      const detail = (j && typeof j.detail==='string') ? j.detail : `Upload failed (HTTP ${xhr.status}).`;
      reject(Object.assign(new Error(detail), {status:xhr.status, detail}));
    };
    xhr.onerror = ()=> reject(Object.assign(new Error('Network error'), {detail:'Network error — the file was not uploaded.'}));
    xhr.send(file);
  }).finally(()=>{ API.pendingWrites--; });
}

  if(!q) return true;

  return [c.swatId,c.partNumber,c.recommendedSupplier,c.project,c.cluster,c.commodity||'',c.region,caseWeekLabel(c),c.partDescription,extraPns]
    .join(' ').toLowerCase().includes(q);

function matchesFilters(c,f){
  if(f.region && !regionList(c).includes(f.region)) return false;
  if(f.cluster && c.cluster!==f.cluster) return false;
  if(f.commodity && (c.commodity||'')!==f.commodity) return false;
  if(f.supplier && c.recommendedSupplier!==f.supplier) return false;
  if(f.decision && c.meetingDecision!==f.decision) return false;
  if(f.status && c.actionStatus!==f.status) return false;

  else p.innerHTML = title(esc(state.user.name))
    + `<div style="font-size:12px;color:var(--ink-soft);">${esc(state.user.email)}</div><div style="font-size:12px;margin-top:4px;">Role: <b>${esc(state.user.roleLabel||state.user.role)}</b></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      ${state.user.role==='admin' ? '<button class="btn-secondary" id="toPassword" style="padding:6px 12px;font-size:12px;">Change password</button>' : ''}
      <button class="btn-primary" id="adminLogoutBtn" style="padding:7px 14px;font-size:12px;">Log out</button>
    </div>`;
  document.body.appendChild(p);
  const $ = id => p.querySelector('#'+id);
  const onEnter = el => { if(el) el.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } }; };
  const showErr = msg => { const err = $('adminLoginErr'); err.textContent = msg; err.style.display = 'block'; };
  const signedIn = resp => {
    API.setSessionToken(resp.token);
    setCurrentUser(resp.user);
    hideAdminLogin();
    if(state.view==='submit' && !state.formDirty) render(); else if(state.view==='submit') renderNav(); else render();
    if(state.user && state.user.mustChangePassword) showAdminLogin('password');
  };
  const submit = async ()=>{
    const button = $('adminLoginBtn');
    if(!button || button.disabled || !p.isConnected) return;
    $('adminLoginErr').style.display = 'none';
    button.disabled = true;
    try{
      if(mode==='login'){
        const wrap = $('adminPasswordWrap');
        const password = wrap && wrap.style.display!=='none' ? $('adminPasswordInput').value : '';
        let resp;
        try{
          resp = await API.post('/api/auth/login', {email:$('adminEmailInput').value.trim(), password});
        }catch(e){
          if(p.isConnected && wrap && (e.detail||'')==='Password required.'){  // 管理员账号：展开密码框
            wrap.style.display = 'block';
            showErr('This is a Sourcing admin account — enter the password.');
            $('adminPasswordInput').focus();
            return;
          }
          throw e;
        }
        if(!p.isConnected){ await fetch('/api/auth/logout', {method:'POST', headers:{'X-Session-Token':resp.token}}).catch(()=>{}); return; }
        signedIn(resp);
      }else if(mode==='register'){
        const resp = await API.post('/api/auth/register', {name:$('regNameInput').value.trim(), email:$('adminEmailInput').value.trim()});
        if(!p.isConnected){ await fetch('/api/auth/logout', {method:'POST', headers:{'X-Session-Token':resp.token}}).catch(()=>{}); return; }
        signedIn(resp);
        toast(`✓ Welcome, ${resp.user.name} — your account is ready.`);
      }else if(mode==='password'){
        const resp = await API.post('/api/auth/password', {currentPassword:$('curPasswordInput').value, newPassword:$('adminPasswordInput').value});
        setCurrentUser(resp.user);
        hideAdminLogin();
        if(state.view==='submit' && state.formDirty) renderNav(); else render();
        toast('✓ Password changed.');
      }
    }catch(e){
      if(!p.isConnected) return;
      showErr(e.detail || e.message);
      const pw = $('adminPasswordWrap'), focusEl = (pw && pw.style.display==='none') ? $('adminEmailInput') : ($('adminPasswordInput')||$('adminEmailInput'));
      (focusEl||{focus(){}}).focus();
    }finally{ button.disabled = false; }
  };
  const logout = async ()=>{
    try{ await API.post('/api/auth/logout'); }catch(e){}
    API.setSessionToken('');
    setCurrentUser(null);
    state.pendingDeleteId = null; state.feedbackOpenId = null; state.decisionOpenId = null;
    if(state.detailEditMode){ state.detailEditMode=false; state.editBuffer=null; }
    if(state.view==='accounts') state.view = 'home';
    hideAdminLogin();
    render();
  };
  if($('adminLoginBtn')) $('adminLoginBtn').onclick = submit;
  ['adminEmailInput','adminPasswordInput','regNameInput','curPasswordInput'].forEach(id=>onEnter($(id)));
  if($('adminLoginCancel')) $('adminLoginCancel').onclick = ()=>{ if(forced) logout(); else hideAdminLogin(); };
  if($('toRegister')) $('toRegister').onclick = e=>{ e.stopPropagation(); showAdminLogin('register'); };
  if($('toLogin')) $('toLogin').onclick = e=>{ e.stopPropagation(); showAdminLogin('login'); };
  if($('toPassword')) $('toPassword').onclick = e=>{ e.stopPropagation(); showAdminLogin('password'); };
  if($('adminLogoutBtn')) $('adminLogoutBtn').onclick = logout;
  p.onkeydown = (e)=>{ if(e.key==='Escape' && !forced){ hideAdminLogin(); document.getElementById('adminToggle').focus(); } };
  setTimeout(()=>{ const first = p.querySelector('input'); if(p.isConnected && first) first.focus(); }, 30);
}
function hideAdminLogin(){
  state.adminLoginOpen = false;
  document.body.classList.remove('admin-login-open');
  const p = document.getElementById('adminLoginPanel');
  if(p) p.remove();
}
document.addEventListener('click', (ev)=>{
  if(!state.adminLoginOpen) return;
  const p = document.getElementById('adminLoginPanel');
  if(p && p.dataset.mode==='password' && state.user && state.user.mustChangePassword) return;  // 必须先改密码

/* 横向导航保留浏览器原生触摸惯性；只有鼠标左键启用拖拽。 */
function revealNavButton(button){
  if(!button) return;
  const nav = button.parentElement;
  const n = nav.getBoundingClientRect(), b = button.getBoundingClientRect();
  if(b.left < n.left) nav.scrollLeft -= n.left - b.left;
  else if(b.right > n.right) nav.scrollLeft += b.right - n.right;
}
function wireNavPan(nav){
  if(nav.dataset.panWired) return;
  nav.dataset.panWired = '1';
  nav.addEventListener('focusin', e=>revealNavButton(e.target.closest('button')));
  nav.addEventListener('wheel', e=>{
    if(e.ctrlKey || e.metaKey) return; // 浏览器缩放与触控板捏合交给浏览器。
    const max = nav.scrollWidth - nav.clientWidth;
    if(max <= 0) return;
    const unit = e.deltaMode===1 ? 16 : e.deltaMode===2 ? nav.clientWidth : 1;
    const delta = (Math.abs(e.deltaX)>Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    const next = Math.max(0, Math.min(max, nav.scrollLeft + delta));
    if(next!==nav.scrollLeft){ e.preventDefault(); nav.scrollLeft = next; }
  }, {passive:false});
  let drag = null, suppressClick = false;
  const finish = ()=>{
    const previous = drag;
    drag = null;
    nav.classList.remove('is-dragging');
    if(previous && nav.hasPointerCapture(previous.id)) nav.releasePointerCapture(previous.id);
  };
  nav.addEventListener('pointerdown', e=>{
    suppressClick = false;
    if(e.pointerType!=='mouse' || e.button!==0 || !e.isPrimary || nav.scrollWidth<=nav.clientWidth) return;
    drag = {id:e.pointerId, x:e.clientX, left:nav.scrollLeft, moved:false};
  });
  window.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    if(!(e.buttons & 1)){ finish(); return; }
    const dx = e.clientX - drag.x;
    if(!drag.moved){
      if(Math.abs(dx)<=5) return;
      drag.moved = true;
      nav.classList.add('is-dragging');
      nav.setPointerCapture(e.pointerId);
    }
    e.preventDefault();
    nav.scrollLeft = drag.left - dx;
  });
  window.addEventListener('pointerup', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    suppressClick = drag.moved;
    finish();
  });
  window.addEventListener('pointercancel', e=>{
    if(drag && e.pointerId===drag.id){ suppressClick = false; finish(); }
  });
  nav.addEventListener('lostpointercapture', finish);
  window.addEventListener('blur', ()=>{ suppressClick = false; finish(); });
  nav.addEventListener('click', e=>{
    if(suppressClick && e.detail!==0){ e.preventDefault(); e.stopPropagation(); }
    suppressClick = false;
  }, true);
}

/* 表格可用触控板、Shift＋滚轮及键盘横滚；普通滚轮继续滚动页面。 */
let tableScrollObserver = null;
function wireScrollRegions(){
  tableScrollObserver?.disconnect();
  const update = el=>{
    const overflowing = el.scrollWidth > el.clientWidth + 1;
    el.tabIndex = overflowing ? 0 : -1;
    if(overflowing){
      el.setAttribute('role','region');
      el.setAttribute('aria-label','Scrollable table — use Left and Right arrow keys or Shift + mouse wheel');
    }else{
      el.removeAttribute('role');
      el.removeAttribute('aria-label');
    }
  };
  tableScrollObserver = new ResizeObserver(entries=>{
    const wrappers = new Set(entries.map(({target})=>target.matches('table') ? target.parentElement : target));
    wrappers.forEach(update);
  });
  document.querySelectorAll('#app table.data-table').forEach(table=>{
    const el = table.parentElement;
    if(getComputedStyle(el).overflowX!=='auto') return;
    el.classList.add('table-scroll');
    update(el);
    tableScrollObserver.observe(el);
    tableScrollObserver.observe(table);
    el.addEventListener('wheel', e=>{
      if(!e.shiftKey || e.ctrlKey || e.metaKey || e.deltaX || !e.deltaY) return;
      const unit = e.deltaMode===1 ? 16 : e.deltaMode===2 ? el.clientWidth : 1;
      const next = Math.max(0,Math.min(el.scrollWidth-el.clientWidth,el.scrollLeft+e.deltaY*unit));
      if(next!==el.scrollLeft){ e.preventDefault(); el.scrollLeft=next; }
    },{passive:false});
  });
}
const headerSizeObserver = new ResizeObserver(()=>{
  document.documentElement.style.setProperty('--topbar-height',document.querySelector('.topbar').getBoundingClientRect().height+'px');
});
headerSizeObserver.observe(document.querySelector('.topbar'));
