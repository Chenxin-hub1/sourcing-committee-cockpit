      </div>
    `).join('')}
  </div>` : ''}
  `;
}


function renderDetail(){
  const hist = historyFor(state.selectedSwatId);
  if(hist.length===0){ state.view='database'; return renderDatabase(); }
  const idx = Math.min(state.selectedEntryIndex, hist.length-1);
  const c = hist[idx];
  const decClass = decisionBadgeClass(c.meetingDecision);
  const decColor = decClass==='approved'?'var(--green)':decClass==='rejected'?'var(--red)':decClass==='pending'?'#3E5A9C':'var(--amber)';
  const decBg = decClass==='approved'?'var(--green-tint)':decClass==='rejected'?'var(--red-tint)':decClass==='pending'?'#E8EDF7':'var(--amber-tint)';
  const editing = state.detailEditMode;
  const b = editing ? state.editBuffer : null;
  const ef = (id,val)=> `<input class="edit-input" id="${id}" value="${escapeAttr(val)}"/>`;
  const eta = (id,val)=> `<textarea class="edit-input" id="${id}" style="min-height:70px;">${esc(val)}</textarea>`;
  const esel = (id,val,opts)=> `<select class="edit-input" id="${id}">${opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  // 编辑页金额用"录入时的币种"：外币折算来的案例按原币编辑，其余按记录币种
  const editCur = isConverted(c) ? c.fx.currency : spendCurrency(c);
  const rolledUpStatus = editing ? rollupActionStatus(b.followUps) : c.actionStatus;
  const flash = state.flash; state.flash = null;

  return `
  ${flash ? `<div class="submit-banner show" style="margin:0 0 14px;">${esc(flash)}</div>` : ''}
  <div class="backlink" id="backToDb">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Database
  </div>

  <div class="detail-header">
    <div class="titles">
      <h1>${esc(c.partDescription || '(no part description)')}</h1>
      <div class="meta" style="margin-bottom:4px;">
        <span>Part Number: <b class="mono" style="color:var(--ink);">${esc(c.partNumber)}</b>${(c.partNumbers&&c.partNumbers.length>1)?` <span style="color:var(--ink-faint);">(+${c.partNumbers.length-1} more)</span>`:''}</span>
        <span>SWAT Case: <b class="mono" style="color:var(--ink);">${esc(c.swatId)}</b></span>
      </div>
      <div class="meta">
        <span class="mono">${wk(c.weekNum)} · ${esc(caseDateLabel(c))} · Case #${c.caseNumber} · ${esc(c.decisionLevel)}</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      ${editing ? `<span class="badge pending">Editing (Admin)</span>` : `
        <div class="decision-pill" style="background:${decBg};color:${decColor};">${esc(c.meetingDecision)}</div>
        ${state.isAdmin ? `<button class="btn-secondary" id="editCaseBtn">✎ Edit Case</button>` : ''}
        ${state.isAdmin ? (state.pendingDeleteId===c.swatId
            ? `<span class="confirm-inline">Delete this case? <button class="btn-danger-sm" data-delete-confirm="${escapeAttr(c.swatId)}">Yes, delete</button><button class="btn-secondary" style="padding:4px 9px;font-size:11px;" data-delete-cancel="1">No</button></span>`
            : `<button class="btn-danger-sm" data-delete-ask="${escapeAttr(c.swatId)}">Delete Case</button>`) : ''}
      `}
    </div>
  </div>

  <div class="status-row">
    ${editing ? `
    <div class="status-tile"><div class="k">Sourcing Decision</div><select class="edit-input" id="editDecision">${DECISION_OPTIONS.map(o=>`<option value="${o.v}" ${b.meetingDecision===o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>
    <div class="status-tile" style="flex:2;"><div class="k">Sourcing Presentation Link ${b.meetingDecision!=='PENDING'?'*':''}</div>${ef('editPresentationLink', b.sourcingPresentationLink||'')}<div style="font-size:10px;color:var(--ink-faint);margin-top:4px;">Required to save any decision other than Pending.</div></div>
    <div class="status-tile"><div class="k">Action Status</div>${b.meetingDecision==='PENDING' ? '<span class="no-action-txt">—</span>' : actionCell(rolledUpStatus)}<div style="font-size:10px;color:var(--ink-faint);margin-top:4px;">${b.meetingDecision==='PENDING' ? 'Blank until a Sourcing Decision is recorded' : 'Computed from task statuses below'}</div></div>

/* ============================= MASTER RENDER ============================= */
let renderedView = null;
function render(){
  state.formDirty = false;
  if(state.view==='detail' && !historyFor(state.selectedSwatId).length) state.view='database';
  if(state.view==='accounts' && !state.isSysAdmin) state.view='home';
  if(state.view!=='detail'){
    state.detailEditMode = false;
    state.editBuffer = null;
    clearCaseHash();
  }
  const viewKey = state.view==='detail' ? 'detail:'+state.selectedSwatId : state.view;
  const tableKey = table=>(table.tHead?.textContent||'').replace(/[▲▼\s]+/g,' ').trim();
  const scrollPositions = new Map();
  if(renderedView===viewKey){
    document.querySelectorAll('#app .table-scroll > table').forEach(table=>{
      scrollPositions.set(tableKey(table),table.parentElement.scrollLeft);
    });
  }
  renderNav();
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='database') app.innerHTML = renderDatabase();
  else if(state.view==='dashboard') app.innerHTML = renderDashboard();
  else if(state.view==='followups') app.innerHTML = renderFollowups();
  else if(state.view==='detail') app.innerHTML = renderDetail();
  else if(state.view==='submit') app.innerHTML = renderSubmit();
  else if(state.view==='accounts') app.innerHTML = renderAccounts();
  else if(state.view==='approvals') app.innerHTML = renderApprovals();
  wireEvents();
  wireScrollRegions();
  // 展开提醒、排序等局部操作保留横向位置，避免右侧操作按钮突然跳出视野。
  document.querySelectorAll('#app .table-scroll > table').forEach(table=>{
    table.parentElement.scrollLeft = scrollPositions.get(tableKey(table)) || 0;
  });
  renderedView = viewKey;
}

/* ============================= EVENTS ============================= */
function goToDetail(swatId){
  try{ history.replaceState(null, '', '#case/'+encodeURIComponent(swatId)); }catch(e){}
  state.selectedSwatId = swatId;
  state.selectedEntryIndex = historyFor(swatId).length-1;
  state.view='detail';
  state.detailEditMode = false;
  state.editBuffer = null;
  render();
  window.scrollTo(0,0);
}
function clearCaseHash(){
  if(location.hash.startsWith('#case/')){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }
}
function canRefresh(){
  return !state.detailEditMode && !state.remindOpenId && !state.pendingDeleteId && !state.adminLoginOpen && !state.feedbackOpenId && !state.decisionOpenId
    && !state.formDirty && !state.uploading && !API.pendingWrites && state.view!=='submit'
    && !document.querySelector('.reject-box.show')
    && !document.activeElement?.matches('input, textarea, select');
}
function applyKpiFilter(key){
  if(key==='open' || key==='overdue'){
    state.view='followups'; state.followupTag=''; state.followupOwner='';
    render(); window.scrollTo(0,0); return;
  }
  state.view='database'; state.searchQuery='';
  state.filters = {year:'',weekFrom:'',weekTo:'',region:'',cluster:'',supplier:'',decision:'',status:''};
  if(key==='closedaction') state.filters.status='Closed';
  else if(key==='pending') state.filters.decision='PENDING';
  else if(key==='approved') state.filters.decision='APPROVED';
  else if(key==='rejected') state.filters.decision='REJECTED';
  else if(key==='conditional') state.filters.decision='CONDITIONAL APPROVAL';
  else if(key==='closedcases'){ /* case-level closed: no single row filter, leave unfiltered by decision/status */ }
  render();
  window.scrollTo(0,0);
}

function wireEvents(){
  const val0 = id => (document.getElementById(id)||{}).value || '';
  document.querySelectorAll('.form-field').forEach(field=>{
    const label = field.querySelector('label');
    const control = field.querySelector('input[id], select[id], textarea[id]');
    if(label && control) label.htmlFor = control.id;
  });
  document.querySelectorAll('[data-kpi], tr[data-swat], [data-swat-link], .tl-item, #backToDb, #dropzone').forEach(el=>{
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.onkeydown = e=>{ if(e.target===el && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); el.click(); } };
  });
  document.querySelectorAll('[data-kpi]').forEach(el=>{
    el.onclick = ()=> applyKpiFilter(el.dataset.kpi);
  });
  document.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick = ()=>{ state.dashPeriod = el.dataset.period; render(); };
  });
  const dws = document.getElementById('dashWeekSelect');
  if(dws) dws.onchange = ()=>{ state.dashWeek = Number(dws.value); render(); };
  const dashExportBtn = document.getElementById('dashExportBtn');
  if(dashExportBtn) dashExportBtn.onclick = ()=>{
    const periodCases = state.dashPeriod==='ytd' ? latestByCase() : ALL_CASES.filter(c=>c.weekNum===state.dashWeek);
    const label = state.dashPeriod==='ytd' ? 'ytd' : wk(state.dashWeek);
    downloadCasesCsv(periodCases, `sourcing_committee_dashboard_${label}.csv`);
  };
  for(const [id, kind] of [['dashAgendaBtn','agenda'],['dashMinutesBtn','minutes']]){
    bindExportButton(id, kind, ()=>({week: state.dashWeek}));
  }

  // Home view
  const dz = document.getElementById('dropzone');
  if(dz) dz.onclick = runUploadSimulation;
  const goSubmit = document.getElementById('goToSubmit');
  if(goSubmit) goSubmit.onclick = ()=>{ state.view='submit'; render(); window.scrollTo(0,0); };
  const hsi = document.getElementById('homeSearchInput');
  if(hsi){
    hsi.oninput = (e)=>{ };
    hsi.onkeydown = (e)=>{ if(e.key==='Enter'){ state.searchQuery=hsi.value; state.view='database'; render(); } };
  }
  document.querySelectorAll('[data-qs]').forEach(el=>{
    el.onclick = ()=>{ state.searchQuery = el.dataset.qs; state.view='database'; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('.activity-row').forEach((el,i)=>{
    // recent activity click -> open that case
  });

  // Database view
  const dbSearch = document.getElementById('dbSearch');
  if(dbSearch){
    dbSearch.oninput = ()=>{ state.searchQuery = dbSearch.value; refreshDbTableOnly(); };
  }
  ['fWeekFrom','fWeekTo','fRegion','fCluster','fSupplier','fDecision','fStatus'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{
      const map={fWeekFrom:'weekFrom',fWeekTo:'weekTo',fRegion:'region',fCluster:'cluster',fSupplier:'supplier',fDecision:'decision',fStatus:'status'};
      state.filters[map[id]] = el.value;
      render();
    };
  });
  const filteredDbRows = ()=>{
    const f = state.filters;
    return ALL_CASES.filter(c=>matchesQuery(c,state.searchQuery) && matchesFilters(c,f)).sort((a,b)=> b.weekNum-a.weekNum || b.caseNumber-a.caseNumber);
  };
  const exportBtn = document.getElementById('exportCsvBtn');

    const b = state.editBuffer;

    const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
    const setIf = (key, id) => { const v = val(id); if(v!==undefined) b[key]=v; };
    if(document.getElementById('editRegion')) b.region = checkedRegions('editRegion').join(' + ');
    setIf('family','editFamily');
    setIf('cluster','editCluster'); setIf('parentPF','editParentPF'); setIf('partFamilyCode','editPartFamilyCode');

    setIf('decisionLevel','editDecisionLevel'); setIf('leadTime','editLeadTime');
    setIf('committeeDiscussion','editDiscussion'); setIf('meetingDecision','editDecision'); setIf('sourcingPresentationLink','editPresentationLink');
    setIf('finalDocLink','editFinalDocLink');
    const editIds = {amortizationTotal:'editAmortizationTotal', toolingPayment:'editToolingPayment', bpgAvailable:'editBpgAvailable', fraAvailable:'editFraAvailable', belowCQA:'editBelowCQA',
      cqaJustification:'editCqaJustification', strategicSupplier:'editStrategicSupplier', ltaAvailable:'editLtaAvailable', usmcaEligible:'editUsmcaEligible',
      fotLeadTimeWeeks:'editFotLeadTimeWeeks', ppapLeadTimeWeeks:'editPpapLeadTimeWeeks', amortizationPcs:'editAmortizationPcs', annualCapacity:'editAnnualCapacity', lifetimeCapacity:'editLifetimeCapacity'};
    Object.entries(editIds).forEach(([key,id])=>{
      const v = val(id); if(v===undefined) return;
      const t = v.trim();
      if(COMMERCIAL_MONEY_KEYS.includes(key)) b[key] = t==='' ? null : t;
      else if(COMMERCIAL_INT_KEYS.includes(key)) b[key] = t==='' ? null : Number(t);
      else b[key] = t;
    });
    b.partNumbers.forEach((p,i)=>{
      const pn = val('editPnNumber_'+i); if(pn!==undefined) p.partNumber=pn;
      const pd = val('editPnDesc_'+i); if(pd!==undefined) p.partDescription=pd;
      const pj = val('editPnProject_'+i); if(pj!==undefined) p.project=pj.trim();
      const st = val('editPnSourcingType_'+i); if(st!==undefined) p.sourcingType=st;
      const sp = val('editPnSupplier_'+i); if(sp!==undefined) p.recommendedSupplier=sp.trim();
      const rowIds = {pcPriceCQA:'editPnPcPriceCQA_', supplierPriceLanded:'editPnSupplierPriceLanded_', toolingCQA:'editPnToolingCQA_', supplierToolingCost:'editPnSupplierToolingCost_', averageVolume:'editPnAvgVolume_', lifetimeVolume:'editPnLtVolume_'};
      Object.entries(rowIds).forEach(([key,prefix])=>{ const v = val(prefix+i); if(v===undefined) return; const t = v.trim(); p[key] = t==='' ? null : (ROW_INT_KEYS.includes(key) ? Number(t) : t); });
    });
    b.followUps.forEach((t,i)=>{
      const task = val('editFuTask_'+i); if(task!==undefined) t.task=task;
      const cats = document.getElementById('editFuCat_'+i); if(cats) t.tags = [...cats.querySelectorAll('input:checked')].map(el=>el.value);
      const resp = val('editFuResp_'+i); if(resp!==undefined) t.responsible=resp;
      const due = val('editFuDue_'+i); if(due!==undefined) t.dueDate=due;
      const status = val('editFuStatus_'+i); if(status!==undefined) t.status=status;
      const notes = val('editFuNotes_'+i); if(notes!==undefined) t.notes=notes;
      if(resp!==undefined) t.notify=resp;
      const em = val('editFuEmail_'+i); if(em!==undefined) t.notifyEmail=em.trim();
      const cc = val('editFuCc_'+i); if(cc!==undefined) t.cc=cc;
      const ch = val('editFuChannel_'+i); if(ch!==undefined) t.channel=ch;
    });

    if(b.finalDocLink && !isUrl(b.finalDocLink)){ state.editError = 'The Final PPT / Supporting Document Link must be a full URL (starting with http:// or https://).'; render(); return; }
    // Rule 1: recording a Sourcing Decision (anything other than Pending) requires the Sourcing Presentation Link.
    // A newly registered case sits at Pending and is exempt until an admin records a decision.
    if(b.meetingDecision!=='PENDING'){
      if(!b.sourcingPresentationLink){ state.editError = 'A Sourcing Decision cannot be saved without the Sourcing Presentation Link. Enter the link, then save the decision.'; render(); return; }
      if(!isUrl(b.sourcingPresentationLink)){ state.editError = 'The Sourcing Presentation Link must be a full URL (starting with http:// or https://).'; render(); return; }
    }
    if(!regionList(b).length){ state.editError = 'Select at least one Region.'; render(); return; }
    // Rule 0: a Pending case has not been reviewed — it cannot carry post-decision follow-up tasks.
    if(b.meetingDecision==='PENDING' && b.followUps.length>0){ state.editError = 'A case that is Pending for Sourcing Committee Review cannot have follow-up tasks. Record the Sourcing Decision first, or remove the tasks.'; render(); return; }
    // 未关闭的待办要能收到提醒：必须填写收件邮箱（系统不再按姓名猜测）。
    const noEmailIdx = b.followUps.findIndex(t=>t.status!=='Closed' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t.notifyEmail||''));
    if(noEmailIdx>=0){ state.editError = `Follow-up task ${noEmailIdx+1}: enter a valid "Send reminder to" email, so the reminder reaches someone.`; render(); return; }
    // Rule 2: closing the case (every follow-up action closed) requires the Final PPT / Supporting Document Link.
    const newActionStatus = rollupActionStatus(b.followUps);
    if(newActionStatus==='Closed'){
      if(!b.finalDocLink){ state.editError = 'All follow-up actions are now Closed, which closes the case — enter the Final PPT / Supporting Document Link first.'; render(); return; }
      if(!isUrl(b.finalDocLink)){ state.editError = 'The Final PPT / Supporting Document Link must be a full URL (starting with http:// or https://).'; render(); return; }
    }
    // Server is the authority: it re-runs the same three rules, merges, recomputes rollups and persists.
    saveCaseBtn.disabled = true; // 防双击（两条路径随后都会 render 重建按钮，无需手工恢复）
    try{
      const resp = await API.put('/api/cases/'+encodeURIComponent(c.id), b);
      applySnapshot(resp.snapshot);
    }catch(err){
      if(state.editBuffer!==b){ toast('⚠ '+(err.detail||err.message)); return; }
      state.editError = err.detail || err.message;
      render();
      return;
    }
    if(state.editBuffer!==b){ toast('Case saved.'); return; }
    state.editError = null;
    state.detailEditMode = false;
    state.editBuffer = null;
    render();
    window.scrollTo(0,0);
  };

  // Global header search
  const gs = document.getElementById('globalSearch');
  if(gs){
    gs.value = '';
    gs.onkeydown = (e)=>{ if(e.key==='Enter'){ state.searchQuery = gs.value; state.view='database'; render(); window.scrollTo(0,0); } };
  }

  // Submit Case
  const submitBtn = document.getElementById('submitCaseBtn');

  // Part Numbers (repeatable rows) — appended/removed via direct DOM ops so other
  // typed fields on the form are never lost the way a full re-render would lose them.
  if(document.getElementById('partNumbersContainer')){
    if(state.pnRowCounter===undefined) state.pnRowCounter = 0;
    function wirePnRow(i){
      const removeBtn = document.querySelector(`[data-remove-pn="${i}"]`);
      if(removeBtn) removeBtn.onclick = ()=>{
        const row = document.querySelector(`[data-pn-row="${i}"]`);
        if(row) row.remove();
        recomputePnTotals();
      };
    }
    // v3 Phase-15：金额按整个 bundle 填一个（案例级），这里只做欧元预览与 BPG 提示
    function recomputePnTotals(){
      const cur = submitCurrency(), rate = fxRate(cur);
      const totalPeak = Number((document.getElementById('fBundlePeak')||{}).value)||0;
      const totalLife = Number((document.getElementById('fBundleLife')||{}).value)||0;
      // 与服务端一致按除法取整（最终金额以服务端 Decimal 计算为准，这里只是预览）
      const eurPeak = rate ? eurPreview(totalPeak, cur) : 0, eurLife = rate ? eurPreview(totalLife, cur) : 0;
      const show = (total, eur)=> fmtMoney(total, cur) + (cur!=='EUR' && rate ? ` ≈ ${fmtMoney(eur,'EUR')}` : '');
      const pd = document.getElementById('totalPeakDisplay'); if(pd) pd.textContent = show(totalPeak, eurPeak);
      const ld = document.getElementById('totalLifetimeDisplay'); if(ld) ld.textContent = show(totalLife, eurLife);
      // 超过 3 Mio EUR：BPG 问题从"可不答"变成"必答"
      const bpgHint = document.getElementById('bpgHint');
      if(bpgHint){
        const over = (rate ? eurLife : totalLife) > BPG_THRESHOLD_EUR;
        bpgHint.textContent = over ? 'Lifetime Spend is above 3 Mio EUR — a BPG must be available to register this case.' : 'Only needed when the total Lifetime Spend converts to more than €3,000,000.';
        bpgHint.classList.toggle('missing', over);
      }
    }
    wirePnRow(0);
    ['fBundlePeak','fBundleLife'].forEach(id=>{ const el = document.getElementById(id); if(el) el.oninput = recomputePnTotals; });
    const currencyEl = document.getElementById('fCurrency');
    if(currencyEl) currencyEl.onchange = ()=>{
      const cur = submitCurrency(), hint = fxHintText(cur), el = document.getElementById('fxHint');
      if(el){ el.textContent = hint.text; el.classList.toggle('missing', hint.missing); }
      document.querySelectorAll('.cur-label').forEach(span=>{ span.textContent = cur; });
      recomputePnTotals();
    };
    const addPnBtn = document.getElementById('addPartNumberBtn');
    if(addPnBtn) addPnBtn.onclick = ()=>{
      state.pnRowCounter++;
      document.getElementById('partNumbersContainer').insertAdjacentHTML('beforeend', partNumberRowHtml(state.pnRowCounter));
      wirePnRow(state.pnRowCounter);
    };
  }

  const caseNoEl = document.getElementById('fExistingSwat');
  if(caseNoEl) caseNoEl.oninput = ()=>{
    const h = document.getElementById('caseNoHint'); if(!h) return;
    const st = caseNoStatus(caseNoEl.value);
    if(!st){ h.style.color='var(--ink-faint)'; h.textContent='Required for every case. If this number is already in the Database, this registration is automatically linked to that case\'s history (it came back). Otherwise it is registered as a new case under this number.'; return; }
    if(st.existing){ h.style.color='var(--accent)'; h.textContent=`↩ ${st.id} is already in the Database (${st.priorEntries} previous entr${st.priorEntries===1?'y':'ies'}) — this registration will be linked to its history as a comeback.`; }
    else { h.style.color='var(--green)'; h.textContent=`✓ ${st.id} is not in the Database yet — it will be registered as a new case under this number.`; }
  };
  const lateBox = document.getElementById('fLateException');
  if(lateBox) lateBox.onchange = ()=>{
    const sel = document.getElementById('fMeetingDate');
    const reason = document.getElementById('lateReasonField');
    if(sel) sel.innerHTML = meetingOptionsHtml(lateBox.checked);
    if(reason) reason.style.display = lateBox.checked ? 'block' : 'none';
  };
  const qBPG = document.getElementById('qBPG');
  if(qBPG) qBPG.onchange = ()=>{ document.getElementById('bpgWarning').style.display = qBPG.value==='No' ? 'block' : 'none'; };
  const qFRA = document.getElementById('qFRA');
  if(qFRA) qFRA.onchange = ()=>{ document.getElementById('fraWarning').style.display = (qFRA.value==='No' && val0('fDecisionLevelIn')==='Level 2') ? 'block' : 'none'; };
  const fDecisionLevelIn = document.getElementById('fDecisionLevelIn');
  if(fDecisionLevelIn) fDecisionLevelIn.onchange = ()=>{ if(qFRA) qFRA.onchange(); };
  const qBelowCQA = document.getElementById('qBelowCQA');
  if(qBelowCQA) qBelowCQA.onchange = ()=>{ document.getElementById('cqaJustificationField').style.display = qBelowCQA.value==='No' ? 'block' : 'none'; };
  const qFamily = document.getElementById('qFamily');
  if(qFamily) qFamily.onchange = ()=>{
    const block = document.getElementById('familyBlock');
    block.style.display = qFamily.value==='Yes' ? 'block' : 'none';
    if(qFamily.value!=='Yes'){
      document.getElementById('qFamilyAligned').value='';
      document.getElementById('familyBlockWarning').style.display='none';
    }
  };
  const qFamilyAligned = document.getElementById('qFamilyAligned');
  if(qFamilyAligned) qFamilyAligned.onchange = ()=>{
    document.getElementById('familyBlockWarning').style.display = qFamilyAligned.value==='No' ? 'block' : 'none';
  };
  const qECM = document.getElementById('qECM');
  if(qECM) qECM.onchange = ()=>{
    const block = document.getElementById('ecmBlock');
    block.style.display = qECM.value==='Yes' ? 'block' : 'none';
    if(qECM.value!=='Yes'){
      document.getElementById('qCCB').value='';
    }
  };
  const qCCB = document.getElementById('qCCB');
  if(qCCB) qCCB.onchange = ()=>{
    document.getElementById('ecmBlockWarning').style.display = qCCB.value==='No' ? 'block' : 'none';
  };
  if(submitBtn) submitBtn.onclick = async ()=>{
    if(submitBtn.disabled) return;
    const val = id=> (document.getElementById(id)||{}).value || '';
    const banner = document.getElementById('submitBanner');
    const showError = (msg)=>{
      banner.textContent = msg;
      banner.style.background = 'var(--red-tint)'; banner.style.color='var(--red)'; banner.style.borderColor='#EFC2BC';
      banner.classList.add('show');
    };
    const name = val('fSubmitter'), email = val('fSubmitterEmail');
    const rowVal = (row, f)=>((row.querySelector(`[data-pn-field="${f}"]`)||{}).value||'').trim();
    const rowStr = (row, f)=>{ const v = rowVal(row, f); return v==='' ? null : v; };
    const rowInt = (row, f)=>{ const v = rowVal(row, f); return v==='' ? null : Number(v); };
    const pnRows = [...document.querySelectorAll('.pn-row')].map(row=>({
      partNumber: rowVal(row,'partNumber'),
      partDescription: rowVal(row,'partDescription'),
      // v3 Phase-15：项目 / 寻源类型 / 推荐供应商按零件行
      project: rowVal(row,'project'), sourcingType: rowVal(row,'sourcingType'), recommendedSupplier: rowVal(row,'recommendedSupplier'),
      // 件价 / 模具费按零件行（字符串，服务端按 Decimal 折算）；产量整数，留空为 null
      pcPriceCQA: rowStr(row,'pcPriceCQA'), supplierPriceLanded: rowStr(row,'supplierPriceLanded'),
      toolingCQA: rowStr(row,'toolingCQA'), supplierToolingCost: rowStr(row,'supplierToolingCost'),
      averageVolume: rowInt(row,'averageVolume'), lifetimeVolume: rowInt(row,'lifetimeVolume'),
    }));
    if(!name || !email){
      showError('⚠ Please fill in Name and Email before submitting.');
      return;
    }
    if(pnRows.length===0 || pnRows.some(r=>!r.partNumber || !r.partDescription)){
      showError('⚠ Please fill in Part Number and Part Description for every part number row before submitting.');
      return;
    }
    if(pnRows.some(r=>!r.project || !r.sourcingType || !r.recommendedSupplier)){ showError('⚠ Please fill in Project, Sourcing Type and Recommended Supplier for every part number row before submitting.'); return; }
    if(!checkedRegions('fRegionIn').length){ showError('⚠ Please select at least one Region before submitting.'); return; }
    const currency = submitCurrency();
    if(!fxRate(currency)){ showError(`⚠ No exchange rate is set for ${currency} yet. Enter the amounts in EUR, or ask the Sourcing admin to set the ${currency} rate.`); return; }
    // v3 Phase-15：bundle 金额必填（整个登记一个数）
    const bundlePeak = Number(val('fBundlePeak'))||0, bundleLife = Number(val('fBundleLife'))||0;
    if(bundlePeak<=0 || bundleLife<=0){ showError('⚠ Please enter the bundle Peak Year Spend and Lifetime Spend (the total for all part numbers) before submitting.'); return; }
    const caseNo = caseNoStatus(val('fExistingSwat'));
    if(!caseNo){ showError('⚠ Please enter the SWAT Case # or Supplyon Case #. Every case has one — it is required.'); return; }
    if(SUBMISSIONS.some(x=>x.caseId===caseNo.id && x.status==='Waiting for Registration Confirmation')){ showError('⚠ '+caseNo.id+' already has a registration waiting for confirmation. Please wait for that one to be processed.'); return; }
    const existingSwat = caseNo.existing ? caseNo.id : '';
    const famAns = val('qFamily'), famAligned = val('qFamilyAligned');
    const ecmAns = val('qECM'), ccbAns = val('qCCB');
    if(!famAns){ showError('⚠ Please answer "Is this a Family Case?" before submitting.'); return; }
    if(!ecmAns){ showError('⚠ Please answer "Does this case involve an Engineering Change (ECM)?" before submitting.'); return; }
    if(famAns==='Yes'){
      if(!famAligned){ showError('⚠ Please answer whether Family Alignment has been completed.'); return; }
      if(famAligned==='No'){ showError('⚠ This case cannot be registered until Family Alignment is completed.'); return; }
    }
    if(ecmAns==='Yes'){
      if(!ccbAns){ showError('⚠ Please answer whether this case has passed CCB2.'); return; }
      if(ccbAns==='No'){ showError('⚠ This case cannot be registered until it has passed CCB2 (Change Control Board 2).'); return; }
    }
    // 商务字段（反馈 PPT 第 2、3 页）：文案与服务端 logic.validate_commercial 一致
    const numOrNull = id => { const v = val(id).trim(); return v==='' ? null : v; };
    if(pnRows.some(r=>ROW_MONEY_KEYS.some(k=>r[k]===null))){ showError('⚠ Please fill in Pc Price CQA, Supplier Price (landed), Tooling CQA and Supplier Tooling Cost for every part number row before submitting (enter 0 if not applicable).'); return; }
    if(!val('fToolingPayment')){ showError('⚠ Please select the Tooling Payment (Lumpsum or MPC) before submitting.'); return; }
    const lifetimeEur = eurPreview(bundleLife, currency);
    if(lifetimeEur > BPG_THRESHOLD_EUR){
      if(!val('qBPG')){ showError('⚠ Lifetime Spend is above 3 Mio EUR — please answer whether a BPG is available.'); return; }
      if(val('qBPG')==='No'){ showError('⚠ This case cannot be registered: Lifetime Spend above 3 Mio EUR requires an available BPG.'); return; }
    }
    if(val('fDecisionLevelIn')==='Level 2'){
      if(!val('qFRA')){ showError('⚠ Please answer whether an FRA is available (required for Level 2 cases).'); return; }
      if(val('qFRA')==='No'){ showError('⚠ This case cannot be registered: a Level 2 case requires an available FRA.'); return; }
    }
    if(val('qBelowCQA')==='No' && !val('fCqaJustification').trim()){ showError('⚠ Please provide a justification when the price is not below CQA.'); return; }
    const intOrNull = id => { const v = val(id).trim(); return v==='' ? null : Number(v); };
    const commercial = {
      toolingPayment: val('fToolingPayment'), bpgAvailable: val('qBPG'), fraAvailable: val('qFRA'),
      belowCQA: val('qBelowCQA'), cqaJustification: val('fCqaJustification').trim(), strategicSupplier: val('qStrategic'), ltaAvailable: val('qLTA'),
      fotLeadTimeWeeks: intOrNull('fFotWeeks'), ppapLeadTimeWeeks: intOrNull('fPpapWeeks'),
      amortizationTotal: numOrNull('fAmoTotal'), amortizationPcs: intOrNull('fAmoPcs'), usmcaEligible: val('qUSMCA'),
      annualCapacity: intOrNull('fAnnualCapa'), lifetimeCapacity: intOrNull('fLifetimeCapa'),
    };
    const meetingDateStr = val('fMeetingDate');
    const meetingDateObj = meetingDateStr ? new Date(meetingDateStr+'T00:00:00') : getEarliestSelectableWednesday();
    const lateBox = document.getElementById('fLateException');
    const pickedLate = !!(document.querySelector('#fMeetingDate option:checked')||{}).dataset?.late;
    if(pickedLate && !val('fLateReason').trim()){ showError('⚠ Please give the reason for the late registration, so the Sourcing admin can approve the exception.'); return; }
    if(pickedLate && !(lateBox && lateBox.checked)){ showError('⚠ Tick "Request an exception" to register for a meeting whose deadline has passed.'); return; }
    // Persist on the server; its snapshot wholesale-replaces the in-memory state.
    const payload = {
      submitterName:name, submitterEmail:email, caseNo: caseNo.id,
      partNumbers: pnRows,
      peakYearSpend: bundlePeak, lifetimeSpend: bundleLife,  // 原币金额，由服务端折算
      region:checkedRegions('fRegionIn'), family:val('fFamily'),
      cluster:val('fClusterIn'), parentPF:val('fParentPF'), partFamilyCode:val('fPartFamilyCode'),
      decisionLevel:val('fDecisionLevelIn'),
      meetingDateISO: meetingDateStr || localDateISO(meetingDateObj),
      meetingDateLabel: formatDateLong(meetingDateObj), meetingWeekNum: dateToWeekNum(meetingDateObj),
      comments: val('fDiscussionIn'), currency,
      isFamilyCase:famAns, familyAligned:famAligned||'',
      involvesECM:ecmAns, ccbApproved:ccbAns||'',
      ...commercial,
      lateException: !!(document.getElementById('fLateException')||{}).checked,
      lateReason: val('fLateReason').trim()
    };
    let subId = '', uploadKey = '';
    submitBtn.disabled = true; // guard against double-clicks (second submit would hit the duplicate gate)
    try{
      const resp = await API.post('/api/submissions', payload);
      applySnapshot(resp.snapshot);
      subId = resp.subId; uploadKey = resp.uploadKey || '';
    }catch(err){ showError('⚠ '+(err.detail||err.message)); submitBtn.disabled = false; return; }
    submitBtn.disabled = false;
    const queued = SUBMIT_FILES; SUBMIT_FILES = [];
    const doneText = `✓ Submitted for Registration (${subId}) — Waiting for the Registration Confirmation. The SBS Procurement approver has been notified.`;
    if(!submitBtn.isConnected){ toast(`✓ Submitted for Registration (${subId}).`); if(queued.length) uploadSubmissionFiles(subId, uploadKey, queued, doneText); return; }
    render();
    window.scrollTo(0,0);
    setTimeout(()=>{
      const banner2 = document.getElementById('submitBanner');
      if(banner2){ banner2.textContent = doneText; banner2.classList.add('show'); }
      if(queued.length) uploadSubmissionFiles(subId, uploadKey, queued, doneText);
    }, 30);
  };
  // 提交页演示文件：拖拽或选择 → 排队（先在浏览器里检查类型与大小），提交成功后再上传
  const fileDrop = document.getElementById('fileDrop'), fileInput = document.getElementById('fFiles');
  if(fileDrop && fileInput){
    const bindQueue = ()=>{
      const q = document.getElementById('fileQueue'); if(q) q.innerHTML = fileQueueHtml();
      document.querySelectorAll('[data-unqueue]').forEach(el=>{ el.onclick = ()=>{ SUBMIT_FILES.splice(Number(el.dataset.unqueue),1); bindQueue(); }; });
    };
    const addFiles = list=>{
      const problems = [];
      for(const f of list){
        const problem = fileProblem(f);
        if(problem){ problems.push(problem); continue; }
        if(SUBMIT_FILES.some(x=>x.name===f.name && x.size===f.size)) continue;
        if(SUBMIT_FILES.length>=FILE_MAX_COUNT){ problems.push(`At most ${FILE_MAX_COUNT} files per registration.`); break; }
        SUBMIT_FILES.push(f);
      }
      if(problems.length) toast('⚠ '+problems.join(' '));
      state.formDirty = true;
      bindQueue();
    };
    bindQueue();
    document.getElementById('fileBrowse').onclick = ()=> fileInput.click();
    fileInput.onchange = ()=>{ addFiles([...fileInput.files]); fileInput.value=''; };
    fileDrop.ondragover = e=>{ e.preventDefault(); fileDrop.classList.add('over'); };
    fileDrop.ondragleave = ()=> fileDrop.classList.remove('over');
    fileDrop.ondrop = e=>{ e.preventDefault(); fileDrop.classList.remove('over'); addFiles([...((e.dataTransfer&&e.dataTransfer.files)||[])]); };
  }
  // 案例页（管理员）：加文件 / 删文件
  const caseFileAdd = document.getElementById('caseFileAdd'), caseFileInput = document.getElementById('caseFileInput');
  if(caseFileAdd && caseFileInput){
    const hist = historyFor(state.selectedSwatId);
    const row = hist[Math.min(state.selectedEntryIndex, hist.length-1)];
    caseFileAdd.onclick = ()=> caseFileInput.click();
    caseFileInput.onchange = async ()=>{
      const list = [...caseFileInput.files]; caseFileInput.value = '';
      const msg = t=>{ const m = document.getElementById('caseFileMsg'); if(m) m.textContent = t; };
      const failed = [];
      caseFileAdd.disabled = true;
      for(let i=0;i<list.length;i++){
        const f = list[i], problem = fileProblem(f);
        if(problem){ failed.push(problem); continue; }
        try{
          const resp = await uploadFile(`/api/cases/${encodeURIComponent(row.id)}/files?name=${encodeURIComponent(f.name)}`, f,
            {'X-Session-Token': API.sessionToken()}, p=>msg(`Uploading ${i+1} of ${list.length}: ${f.name} — ${Math.round(p*100)}%`));
          applySnapshot(resp.snapshot);
        }catch(err){ failed.push(`${f.name}: ${err.detail||err.message}`); }
      }
      render();
      if(failed.length) toast('⚠ Not uploaded — '+failed.join(' '));
      else toast(`✓ ${list.length} file${list.length===1?'':'s'} added.`);
    };
    document.querySelectorAll('[data-file-remove]').forEach(el=>{
      el.onclick = async ()=>{
        if(el.disabled) return;
        const f = (row.files||[]).find(x=>x.id===el.dataset.fileRemove);
        if(!f || !confirm(`Remove ${f.name} from this case? The stored file is deleted as well.`)) return;
        el.disabled = true;
        try{ applySnapshot((await API.del(`/api/cases/${encodeURIComponent(row.id)}/files/${encodeURIComponent(f.id)}`)).snapshot); }
        catch(err){ el.disabled = false; toast('⚠ '+(err.detail||err.message)); return; }
        render();
        toast(`✓ ${f.name} removed.`);
      };
    });
  }

  // Approvals
  document.querySelectorAll('[data-approve]').forEach(el=>{
    el.onclick = async ()=>{
      if(!state.isAdmin || el.disabled) return;
      const sub = SUBMISSIONS.find(s=>s.subId===el.dataset.approve);
      if(!sub || sub.status!=='Waiting for Registration Confirmation') return;
      let done = null;
      el.disabled = true; // 防双击：第二击会撞 422 "already processed" 弹红色误报（两条路径随后都 render 重建按钮）
      try{
        const resp = await API.post('/api/submissions/'+encodeURIComponent(el.dataset.approve)+'/confirm');
        applySnapshot(resp.snapshot);
        done = resp.submission;
      }catch(err){ toast('⚠ '+(err.detail||err.message)); render(); return; }  // flash 只在案例详情页显示，审批页上要用 toast 才看得见
      // Jump straight to the SAME case that was just confirmed so it's never "lost".
      state.flash = done.existingSwatId ? `✓ Registration confirmed for ${done.subId}. ${done.approvedSwatId} came back — this registration was linked to its history as a new lifecycle entry (Sourcing Decision = Pending, waiting for Sourcing Committee review).` : `✓ Registration confirmed for ${done.subId}. New case ${done.approvedSwatId} is now in the Database with Sourcing Decision = Pending — waiting for Sourcing Committee review.`;
      goToDetail(done.approvedSwatId);
    };
  });
  document.querySelectorAll('[data-reject-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const box = document.getElementById('rejectBox-'+el.dataset.rejectToggle);
      if(box) box.classList.toggle('show');
    };
  });
  document.querySelectorAll('[data-reject-confirm]').forEach(el=>{
    el.onclick = async ()=>{
      if(el.disabled) return;
      const id = el.dataset.rejectConfirm;
      const reasonEl = document.getElementById('rejectReason-'+id);
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if(!reason){ reasonEl.style.borderColor='var(--red)'; reasonEl.placeholder='A reason is required before returning this to the submitter.'; return; }
      const sub = SUBMISSIONS.find(s=>s.subId===id);
      if(!state.isAdmin || !sub || sub.status!=='Waiting for Registration Confirmation') return;
      el.disabled = true; // 防双击：第二击会撞 422 "already processed" 弹红色误报
      try{
        const resp = await API.post('/api/submissions/'+encodeURIComponent(id)+'/reject', {reason});
        applySnapshot(resp.snapshot);
      }catch(err){ el.disabled = false; toast('⚠ '+(err.detail||err.message)); return; }
      render();
      window.scrollTo(0,0);
    };
  });
}

async function runUploadSimulation(){
  if(state.uploaded || state.uploading) return;
  if(!state.isSysAdmin){
    toast('Legacy Excel upload is available to the Sourcing admin only.');
    return;
  }
  const dzTitle = document.getElementById('dzTitle');
  const progress = document.getElementById('uploadProgress');
  if(!progress) return;
  const steps = [...progress.querySelectorAll('.step-row')];
  const success = document.getElementById('uploadSuccess');
  state.uploading = true;
  progress.classList.add('show');
  dzTitle.textContent = '2026_W34_Sourcing_Committee.xlsx';
  steps.forEach(step=>step.classList.remove('active','done'));
  try{
    for(let i=0;i<steps.length;i++){
      if(!progress.isConnected || !state.isSysAdmin) return;
      const step = steps[i];
      step.classList.add('active');
      step.querySelector('.dot').innerHTML = '<span class="spinner"></span>';
      if(i===steps.length-1){
        step.lastChild.textContent = ' Updating database';
        const resp = await API.post('/api/legacy-upload');
        applySnapshot(resp.snapshot);
        state.uploaded = true;
        step.lastChild.textContent = ' Database updated successfully';
      }else{
        await new Promise(resolve=>setTimeout(resolve,650));
      }
      step.classList.remove('active');
      step.classList.add('done');
      step.querySelector('.dot').textContent = '';
    }
    if(success.isConnected) success.classList.add('show');
    setTimeout(()=>{ if(progress.isConnected){ render(); window.scrollTo(0,0); } },900);
  }catch(e){
    toast('⚠ Upload failed: '+(e.detail||e.message));
    progress.classList.remove('show');
    dzTitle.textContent = 'Drag & Drop Weekly Excel Here';
  }finally{
    state.uploading = false;
  }
}

// Startup: load the shared state from the server, then render. The daily reminder check
// runs server-side (on startup and hourly); this page only refreshes the snapshot hourly,
// skipping the re-render while a form, editor or confirm panel is in use so nothing typed gets wiped.
(async function init(){
  // 登录状态由 bootstrap 的 currentUser 恢复；清掉共享口令时代留在本标签页的旧令牌
  try{ sessionStorage.removeItem('sc_admin_token'); }catch(e){}
  setCurrentUser(null);
  try{ applySnapshot(await API.get('/api/bootstrap')); setNetStatus(true); }catch(e){ setNetStatus(false); /* server unreachable — empty state, banner shown */ }
  if(!openFromHash()) render();
  setInterval(async ()=>{
    if(!canRefresh()) return;
    const version = API.writeVersion;
    try{
      const j = await API.get('/api/bootstrap');
      setNetStatus(true);
      if(canRefresh() && version===API.writeVersion){ applySnapshot(j); render(); }
    }catch(e){ setNetStatus(false); }
  }, 60*60*1000);
})();
// Direct case links (e.g. from a reminder): #case/SWAT-12345
function openFromHash(){
  const m = /^#case\/(.+)$/.exec(location.hash||'');
  if(!m) return false;
  let id;
  try{ id = decodeURIComponent(m[1]); }catch(e){ toast('This case link is invalid.'); return false; }
  if(!ALL_CASES.some(c=>c.swatId===id)){ toast('This case is unavailable or has been deleted.'); return false; }
  goToDetail(id);
  return true;
}
window.addEventListener('hashchange', openFromHash);
document.getElementById('app').addEventListener('input', ()=>{ state.formDirty = true; });
document.getElementById('app').addEventListener('change', ()=>{ state.formDirty = true; });
</script>
