<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Inline SVG favicon (brand mark): avoids the /favicon.ico 404 without shipping a binary file -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23E8580A'/><text x='16' y='22' font-family='Arial,sans-serif' font-size='14' font-weight='800' fill='%23fff' text-anchor='middle'>SC</text></svg>">
<title>Sourcing Committee Cockpit — Demo</title>
<style>
  :root{
    --topbar-height:52px;
    --bg:#F3F4F6;
    --surface:#FFFFFF;
    --ink:#23262B;
    --ink-soft:#666B76;
    --ink-faint:#9AA0AA;
    --border:#E1E3E8;
    --border-strong:#CBCFD6;
    --accent:#E8580A;
    --accent-dark:#C24A08;
    --accent-tint:#FCE9DE;
    --green:#1E8E5A;
    --green-tint:#E4F5EC;
    --amber:#B8790A;
    --amber-tint:#FCF1DA;
    --red:#C13A2E;
    --red-tint:#FBEAE7;
    --gray:#8A909B;
    --gray-tint:#EDEEF1;
    --header:#23262B;
    --radius:8px;
    --shadow: 0 1px 2px rgba(20,20,22,0.04), 0 1px 8px rgba(20,20,22,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-padding-top:calc(var(--topbar-height) + 12px);}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  ::selection{background:var(--accent-tint);}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--header);
    color:#fff;
    display:flex;
    align-items:center;
    gap:24px;
    padding:0 20px;
    height:52px;
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;letter-spacing:.2px;white-space:nowrap;}
  .brand .mark{
    width:22px;height:22px;border-radius:5px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;
  }
  .brand .sub{color:#B7BBC3;font-weight:400;font-size:12px;border-left:1px solid #454951;padding-left:10px;margin-left:2px;}
  .navtabs{display:flex;gap:2px;margin-left:6px;min-width:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#777D88 transparent;overscroll-behavior-x:contain;}
  .navtabs::-webkit-scrollbar{height:4px;}
  .navtabs::-webkit-scrollbar-thumb{background:#777D88;border-radius:4px;}
  .navtabs.is-dragging,.navtabs.is-dragging button{cursor:grabbing;user-select:none;}
  .navtabs button{flex:none;}
  .navtabs button{
    background:transparent;border:none;color:#C7CAD1;padding:8px 14px;border-radius:6px;
    font-size:13px;cursor:pointer;font-weight:500;
  }
  .navtabs button:hover{background:#2F323A;color:#fff;}
  .navtabs button.active{background:#33353D;color:#fff;}
  .navtabs button.active::after{content:'';}
  .topbar .gsearch{
    margin-left:auto;display:flex;align-items:center;background:#33353D;border:1px solid #43454D;
    border-radius:6px;padding:0 10px;height:32px;width:280px;
  }
  .topbar .gsearch input{
    background:transparent;border:none;outline:none;color:#fff;font-size:13px;width:100%;padding:0 6px;
  }
  .topbar .gsearch input::placeholder{color:#8A8E97;}
  .topbar .gsearch svg{flex:none;opacity:.6;}
  .admin-toggle{flex:none;margin-left:10px;height:30px;padding:0 11px;border-radius:15px;border:1px solid #4A4D56;background:#33353D;color:#C7CAD1;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .admin-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* 账号面板顶部的 登录 / 注册 切换 */
  .auth-tabs{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .auth-tabs button{flex:1;background:#fff;border:none;padding:7px 0;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .auth-tabs button+button{border-left:1px solid var(--border-strong);}
  .auth-tabs button.on{background:var(--accent);color:#fff;}
  .btn-danger-sm{background:#fff;color:var(--red);border:1px solid #EFC2BC;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-danger-sm:hover{background:var(--red-tint);}
  .confirm-inline{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--red);font-weight:600;white-space:nowrap;}

  /* ---------- Layout ---------- */
  .page{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  .pagehead{margin-bottom:18px;}
  .pagehead h1{font-size:19px;margin:0 0 4px;font-weight:600;}
  .pagehead p{margin:0;color:var(--ink-soft);font-size:13px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}

  /* ---------- Home / Upload ---------- */
  .home-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:18px;align-items:start;}
  @media(max-width:880px){.home-grid{grid-template-columns:1fr;}}

  .upload-card{padding:22px;}
  .upload-card h2{font-size:14.5px;margin:0 0 3px;font-weight:600;}
  .upload-card .hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 16px;}
  .dropzone{
    border:1.5px dashed var(--border-strong);
    border-radius:8px;
    padding:34px 20px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
    background:#FAFAFB;
  }
  .dropzone:hover{border-color:var(--accent);background:var(--accent-tint);}
  .dropzone .icon{
    width:46px;height:46px;border-radius:10px;background:var(--accent-tint);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  }
  .dropzone .title{font-weight:600;font-size:14px;margin-bottom:3px;}
  .dropzone .example{
    display:inline-block;margin-top:12px;background:var(--gray-tint);color:var(--ink-soft);
    font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;padding:4px 9px;border-radius:5px;
  }
  .dropzone .small{color:var(--ink-faint);font-size:11.5px;margin-top:10px;}

  .upload-progress{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;display:none;}
  .upload-progress.show{display:block;}
  .step-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--ink-faint);}
  .step-row .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;position:relative;}
  .step-row.active{color:var(--ink);}
  .step-row.active .dot{border-color:var(--accent);}
  .step-row.done{color:var(--ink);}
  .step-row.done .dot{border-color:var(--green);background:var(--green);}
  .step-row.done .dot::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .step-row .spinner{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent-tint);border-top-color:var(--accent);position:absolute;top:1px;left:1px;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .upload-success{
    display:none;margin-top:12px;background:var(--green-tint);border:1px solid #BEE3D0;color:var(--green);
    padding:10px 12px;border-radius:6px;font-size:12.5px;font-weight:600;
  }
  .upload-success.show{display:block;}

  .quicksearch-card{padding:22px;margin-top:18px;}
  .quicksearch-card h2{font-size:14.5px;margin:0 0 3px;font-weight:600;}
  .quicksearch-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
  .qs-input-wrap{position:relative;}
  .qs-input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45;}
  .qs-input{
    width:100%;padding:14px 14px 14px 40px;border:1.5px solid var(--border-strong);border-radius:8px;
    font-size:15px;outline:none;background:#FAFAFB;
  }
  .qs-input:focus{border-color:var(--accent);background:#fff;}
  .qs-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .qs-chip{
    background:var(--gray-tint);border:1px solid var(--border);color:var(--ink-soft);font-size:11.5px;
    padding:4px 9px;border-radius:20px;cursor:pointer;
  }
  .qs-chip:hover{border-color:var(--accent);color:var(--accent);}
  .qs-fields{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:12px;color:var(--ink-faint);font-size:11px;}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:880px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);
  }
  .kpi:hover{border-color:var(--accent);transform:translateY(-1px);}
  .kpi .num{font-size:23px;font-weight:700;line-height:1;}
  .kpi .lbl{color:var(--ink-soft);font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:6px;}
  .rag{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}
  .rag.g{background:var(--green);} .rag.y{background:var(--amber);} .rag.r{background:var(--red);} .rag.n{background:var(--gray);} .rag.b{background:#3E5A9C;}

  .side-panel{padding:20px;}
  .side-panel h3{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .activity-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-row .adot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;}
  .activity-row .atxt b{font-weight:600;}
  .activity-row .atime{color:var(--ink-faint);font-size:11px;}


  /* ---------- Filters / Database ---------- */
  .filters-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .filters-bar select, .filters-bar .searchbox{
    border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--ink);
  }
  .filters-bar select{cursor:pointer;}
  .filters-bar .searchbox{flex:1;min-width:180px;position:relative;}
  .filters-bar .searchbox input{border:none;outline:none;width:100%;font-size:12.5px;}
  .filters-bar .resultcount{color:var(--ink-soft);font-size:12px;margin-left:auto;white-space:nowrap;}
  .filters-bar .clearbtn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:6px 4px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
  .data-table thead th{
    text-align:left;background:#FAFAFB;color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.3px;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .data-table tbody td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .data-table tbody tr{cursor:pointer;}
  .data-table tbody tr:hover{background:var(--accent-tint);}
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;}
  .pn-link{font-weight:600;color:var(--ink);}
  .swat{color:var(--ink-faint);font-size:11px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.approved{background:var(--green-tint);color:var(--green);}
  .badge.rejected{background:var(--red-tint);color:var(--red);}
  .badge.conditional{background:var(--amber-tint);color:var(--amber);}
  .badge.pending{background:#E8EDF7;color:#3E5A9C;}
  .badge.open{background:var(--amber-tint);color:var(--amber);}
  .badge.overdue{background:var(--red-tint);color:var(--red);}
  .badge.closed{background:var(--green-tint);color:var(--green);}
  .badge.noaction{background:var(--gray-tint);color:var(--gray);}
  .badge.resub{background:var(--amber-tint);color:var(--amber);}
  .no-action-txt{color:var(--ink-faint);font-size:12px;}

  .period-toggle{display:inline-flex;background:var(--gray-tint);border-radius:6px;padding:2px;gap:2px;}
  .period-toggle button{border:none;background:transparent;font-size:11px;font-weight:600;color:var(--ink-soft);padding:5px 10px;border-radius:5px;cursor:pointer;}
  .period-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .period-week-select{border:1px solid var(--border-strong);border-radius:6px;padding:4px 7px;font-size:11.5px;background:#fff;margin-left:6px;}
  .breakdown-row-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin:22px 0 10px;}
  .tile-row{display:grid;gap:10px;}
  .tile-row.four{grid-template-columns:repeat(4,1fr);}
  .tile-row.three{grid-template-columns:repeat(3,1fr);}
  @media(max-width:880px){.tile-row.four{grid-template-columns:repeat(2,1fr);} .tile-row.three{grid-template-columns:repeat(2,1fr);}}
  .tile{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);}
  .tile:hover{border-color:var(--accent);transform:translateY(-1px);}
  .tile .num{font-size:21px;font-weight:700;}
  .tile .lbl{color:var(--ink-soft);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:5px;}

  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state svg{opacity:.35;margin-bottom:10px;}

  /* ---------- Dashboard ---------- */
  .dash-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:880px){.dash-kpis{grid-template-columns:repeat(2,1fr);}}
  .dashcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.12s;}
  .dashcard:hover{border-color:var(--accent);transform:translateY(-1px);}
  .dashcard .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .dashcard .num{font-size:28px;font-weight:700;}
  .dashcard .lbl{color:var(--ink-soft);font-size:12px;margin-top:6px;}
  .dash-section-title{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:26px 0 10px;}

  .breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:880px){.breakdown-grid{grid-template-columns:1fr;}}
  .breakdown-card{padding:16px 18px;}
  .breakdown-card h4{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:9px;}
  .bar-row .blabel{width:120px;flex:none;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;background:var(--gray-tint);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .bar-num{width:22px;text-align:right;color:var(--ink-faint);font-size:11.5px;}

  /* ---------- Case Detail ---------- */
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);font-size:12.5px;cursor:pointer;margin-bottom:14px;}
  .backlink:hover{color:var(--accent);}
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .detail-header .titles h1{font-size:19px;margin:0 0 4px;font-weight:700;}
  .detail-header .titles .meta{color:var(--ink-soft);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;}
  .detail-header .meta .mono{color:var(--ink-faint);}
  .decision-pill{padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;text-align:center;white-space:nowrap;}

  .detail-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
  @media(max-width:920px){.detail-grid{grid-template-columns:1fr;}}

  .section-card{padding:18px 20px;margin-bottom:16px;}
  .section-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 14px;font-weight:600;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
  .info-item .k{font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
  .info-item .v{font-size:13px;font-weight:500;}
  .discussion-box{background:#FAFAFB;border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.6;}
  .followup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
  .link-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;}
  .status-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .status-tile{flex:1;min-width:150px;border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
  .status-tile .k{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;}
  .edit-input{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff;}
  .edit-input:focus{outline:none;border-color:var(--accent);}
  textarea.edit-input{resize:vertical;}

  /* Lifecycle timeline - signature element */
  .timeline-card{padding:20px 22px;}
  .timeline-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 4px;font-weight:600;}
  .timeline-card .sub{color:var(--ink-faint);font-size:11.5px;margin-bottom:18px;}
  .tl{position:relative;padding-left:26px;}
  .tl-item{position:relative;padding-bottom:22px;cursor:pointer;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:'';position:absolute;left:-26px;top:22px;bottom:-2px;width:2px;background:var(--border-strong);}
  .tl-item:last-child::before{display:none;}
  .tl-node{
    position:absolute;left:-33px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 0 0 1.5px var(--border-strong);
  }
  .tl-node.g{background:var(--green);box-shadow:0 0 0 1.5px var(--green);}
  .tl-node.y{background:var(--amber);box-shadow:0 0 0 1.5px var(--amber);}
  .tl-node.r{background:var(--red);box-shadow:0 0 0 1.5px var(--red);}
  .tl-node.b{background:#3E5A9C;box-shadow:0 0 0 1.5px #3E5A9C;}
  .tl-body{background:#FAFAFB;border:1px solid var(--border);border-radius:7px;padding:11px 14px;transition:.12s;}
  .tl-item.selected .tl-body{border-color:var(--accent);background:var(--accent-tint);}
  .tl-item:hover .tl-body{border-color:var(--border-strong);}
  .tl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl-week{font-weight:700;font-size:12.5px;}
  .tl-case{color:var(--ink-faint);font-size:11px;margin-left:6px;}
  .tl-note{color:var(--ink-soft);font-size:12px;margin-top:4px;}
  .tl-select-hint{font-size:10.5px;color:var(--ink-faint);margin-top:14px;text-align:center;}

  .footer-note{margin-top:28px;text-align:center;color:var(--ink-faint);font-size:11px;}

  /* ---------- Submit Case / Approvals ---------- */
  .form-card{padding:22px 24px;}
  .form-card h2{font-size:15px;margin:0 0 4px;font-weight:600;}
  .form-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr;}}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.span2{grid-column:1/-1;}
  .form-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .form-field input, .form-field select, .form-field textarea{
    border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:none;border-color:var(--accent);}
  .form-field textarea{resize:vertical;min-height:64px;}
  .form-actions{margin-top:18px;display:flex;align-items:center;gap:12px;}

function weekDate(w){

function isoThursday(d){ return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7))); }

  const thu = isoThursday(d);

  const now = new Date();

  catch(e){ return new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'})); }

function nowInZone(tz){
  const now = new Date();
  try{ return new Date(now.toLocaleString('en-US', {timeZone: tz})); }
  catch(e){ return getNATime(); }
}

function meetingOptionsHtml(includeBlocked){

  const opts = upcomingWednesdays(12).map(d=>`<option value="${localDateISO(d)}">${wk(dateToWeekNum(d), isoWeekYear(d))} — ${formatDateLong(d)}</option>`);

function upcomingWednesdays(count){
  const first = getEarliestSelectableWednesday();
  const out = [];
  for(let i=0;i<count;i++){

    out.push(d);
  }
  return out;
}

/* ---- Generated single-appearance filler cases (baseline dataset) ---- */
function seededRand(seed){ let s = seed; return ()=>{ s = (s*1103515245+12345) & 0x7fffffff; return s/0x7fffffff; }; }
function pick(arr,r){ return arr[Math.floor(r()*arr.length)]; }
function pickTags(r){
  const first = pick(ACTION_TAGS,r);
  if(r()<0.45){
    let second = pick(ACTION_TAGS,r);
    let guard=0; while(second===first && guard++<5){ second = pick(ACTION_TAGS,r); }
    return second===first ? [first] : [first, second];
  }
  return [first];
}

function generateBatch(count, weekRangeStart, weekRangeEnd, seed, swatStart){
  const r = seededRand(seed);
  const out = [];
  const decisions = ['APPROVED','APPROVED','APPROVED','CONDITIONAL APPROVAL','REJECTED','PENDING'];
  for(let i=0;i<count;i++){
    const w = weekRangeStart + Math.floor(r()*(weekRangeEnd-weekRangeStart+1));
    const dec = pick(decisions,r);
    const partType = pick(PART_TYPES,r);
    const cluster = CLUSTER_OF[partType];
    const region = pick(REGIONS,r);
    const supplier = pick(SUPPLIERS,r);
    const project = pick(PROJECTS,r);
    let caseStatus, actionStatus, followUpStatus, closureStatus, discussion;
    if(dec==='REJECTED'){
      caseStatus='Resubmission Required'; actionStatus=pick(['Open','Overdue','Closed'],r);
      discussion='Committee did not approve the recommendation as presented; cost or capacity position did not meet the target threshold and a resubmission was requested.';
    } else if(dec==='PENDING'){
      caseStatus='Open'; actionStatus=null; // not reviewed yet — no post-decision actions exist
      discussion='Pending for Sourcing Committee Review';
    } else if(dec==='CONDITIONAL APPROVAL'){
      caseStatus='Approved'; actionStatus=pick(['Open','Overdue','Closed'],r);
      discussion='Committee approved the recommendation subject to a follow-up item being closed out before production release.';
    } else {
      caseStatus= (r()<0.5?'Approved':'Closed'); actionStatus= (caseStatus==='Closed'? null : pick([null,'Closed'],r));
      discussion='Committee reviewed the sourcing recommendation and approved it without conditions; cost, quality and capacity positions were all satisfactory.';
    }
    followUpStatus = actionStatus;
    closureStatus = (actionStatus==='Closed' || actionStatus===null) ? 'Closed' : 'Open';
    const swatId = 'SWAT-'+(swatStart+i);
    const pn = String(10000000 + Math.floor(r()*89999999));
    out.push(mkCase({
      weekNum:w, caseNumber: 1+Math.floor(r()*9), swatId, partNumber:pn,
      partDescription: pick(partTypeDescriptions(partType),r),
      region, project, family: partType, cluster,
      parentPF: 'PF-'+Math.floor(1000+r()*8999), partFamilyCode:'PF-'+Math.floor(1000+r()*8999),
      sourcingType: pick(SOURCING_TYPES,r), recommendedSupplier: supplier, presenter: pick(PRESENTERS,r),
      decisionLevel: pick(DECISION_LEVELS,r),
      peakYearSpend: Math.floor(200000+r()*4500000), leadTime: (4+Math.floor(r()*16))+' weeks',
      lifetimeSpend: Math.floor(800000+r()*20000000),
      committeeDiscussion: discussion, meetingDecision: dec, caseStatus, actionStatus,
      followUps: actionStatus===null ? [] : [{
        id:'FU-GEN-'+swatId, task: pick(['Submit updated quality certification','Confirm capacity commitment in writing','Provide revised cost breakdown','Complete supplier audit follow-up','Submit PPAP documentation'],r),
        responsible: pick(PRESENTERS,r), dueDate: weekYear()+'-'+String(6+Math.floor(r()*3)).padStart(2,'0')+'-'+String(1+Math.floor(r()*27)).padStart(2,'0'),
        notes:'Tracked with responsible buyer; status updated at next committee cycle.', status: followUpStatus, tags: pickTags(r), notify:'', cc:''
      }],
      closure: {status: closureStatus, closureDate: closureStatus==='Closed' ? weekYear()+'-'+String(6+Math.floor(r()*3)).padStart(2,'0')+'-'+String(1+Math.floor(r()*27)).padStart(2,'0') : '—',
        closureComment: closureStatus==='Closed' ? 'Follow-up item resolved and evidenced.' : '—',
        closureEvidence: closureStatus==='Closed' ? 'Evidence_'+swatId+'.pdf' : '—'}
    }));
  }
  return out;
}

/* ===================== Server API layer (persistence) =====================
   The server is the single source of truth. Every write goes through a command
   endpoint; its response carries a full snapshot that wholesale-replaces the
   in-memory state before re-render. 422 detail messages reuse the template's
   own validation texts. */
const API = {
  token: null,
  pendingWrites: 0,
  writeVersion: 0,
  // 登录令牌存 localStorage：关掉标签页再打开仍是登录状态（服务端 7 天过期）；存储被禁用时只留在内存里
  sessionToken(){
    if(this.token!==null) return this.token;
    try{ return localStorage.getItem('sc_session_token') || ''; }catch(e){ return ''; }
  },
  setSessionToken(token){
    this.token = token || '';
    try{ if(this.token) localStorage.setItem('sc_session_token', this.token); else localStorage.removeItem('sc_session_token'); }catch(e){}
  },
  async request(method, path, body){
    const headers = {'Content-Type':'application/json'};
    const tok = this.sessionToken();
    if(tok) headers['X-Session-Token'] = tok;
    const writing = method!=='GET';
    if(writing){ this.pendingWrites++; this.writeVersion++; }
    try{
      const res = await fetch(path, {method, headers, body: body===undefined ? undefined : JSON.stringify(body)});
      const j = await res.json().catch(()=>null);

          // Spec v2-admin-gate: drop to the user view AND re-render. Guarded so an in-progress
          // editor / panel / submit form is never wiped mid-interaction.
          if(!state.detailEditMode && !state.remindOpenId && !state.pendingDeleteId && !state.feedbackOpenId && !state.decisionOpenId && !state.formDirty && !document.querySelector('.reject-box.show') && state.view!=='submit' && document.getElementById('app')) render();
        }

      if(!res.ok){
        const raw = j && j.detail;
        const detail = typeof raw==='string' ? raw : Array.isArray(raw)

          : 'Request failed: '+res.status;
        throw Object.assign(new Error(detail), {status:res.status, detail});
      }
      if(!j || typeof j!=='object') throw new Error('The server returned an invalid response. Please try again.');
      return j;
    }finally{ if(writing) this.pendingWrites--; }
  },
  get(p){ return this.request('GET', p); },
  post(p,b){ return this.request('POST', p, b); },
  put(p,b){ return this.request('PUT', p, b); },
  del(p){ return this.request('DELETE', p); },
};

function todayISO(){ return localDateISO(getNATime()); }
function daysBetweenISO(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
// When will this task next get an automatic reminder? (null = never under current rules)
function nextReminderDate(t){
  const S = REMINDER_SETTINGS; if(!S.enabled) return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')) return null;
  const today = todayISO();
  const addDays = (iso,n)=>{ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const remindedToday = t.lastAutoReminderDate===today;
  const cands = [];
  if(Number(S.daysBefore)>0) cands.push(addDays(t.dueDate, -Number(S.daysBefore)));
  if(S.onDueDate) cands.push(t.dueDate);
  if(Number(S.overdueEveryDays)>0){ const k = Number(S.overdueEveryDays); for(let i=1;i<=52;i++) cands.push(addDays(t.dueDate, i*k)); }
  const future = cands.filter(d=> d>today || (d===today && !remindedToday)).sort();
  return future[0]||null;
}
// Returns {overdueMarked, sent, overdueTotal, openTotal}. force=true re-runs today's check even if it already ran.
function runDailyReminderCheck(force){
  const today = todayISO();
  const S = REMINDER_SETTINGS;
  let overdueMarked = 0, sent = 0;
  ALL_CASES.forEach(c=>{
    if(c.meetingDecision==='PENDING') return;                     // not reviewed yet — no actions exist
    (c.followUps||[]).forEach(t=>{
      if(!(t.status==='Open' || t.status==='Overdue')) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')) return;      // no usable due date
      const daysUntil = daysBetweenISO(today, t.dueDate);          // negative = overdue
      if(daysUntil < 0 && t.status==='Open'){ t.status='Overdue'; overdueMarked++; }
      if(!S.enabled) return;
      if(t.lastAutoReminderDate===today) return;                    // never twice in one day
      let trigger = null;
      if(daysUntil===Number(S.daysBefore) && Number(S.daysBefore)>0) trigger = 'Due in '+S.daysBefore+' days';
      else if(daysUntil===0 && S.onDueDate) trigger = 'Due today';
      else if(daysUntil<0 && Number(S.overdueEveryDays)>0 && ((-daysUntil) % Number(S.overdueEveryDays))===0) trigger = 'Overdue by '+(-daysUntil)+' days';
      if(!trigger) return;
      const rc = taskRecipient(t);
      const cc = [rc.cc, S.alwaysCc].filter(Boolean).join(', ');
      const channel = t.channel || S.channel;
      const entry = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), trigger, swatId:c.swatId, task:t.task, to:rc.email||'(no email on file)', cc, channel, message: reminderMessage(c,t) };
      AUTO_LOG.unshift(entry); if(AUTO_LOG.length>200) AUTO_LOG.pop();
      t.lastAutoReminderDate = today;
      t.lastReminder = { when: entry.when, channel, to: entry.to, message: entry.message, auto:true };
      REMINDED.add(t.id);
      sent++;
    });
    c.actionStatus = rollupActionStatus(c.followUps);
  });
  let overdueTotal=0, openTotal=0;
  ALL_CASES.forEach(c=>{ if(c.meetingDecision==='PENDING') return; (c.followUps||[]).forEach(t=>{ if(t.status==='Overdue') overdueTotal++; if(t.status==='Open') openTotal++; }); });
  S.lastRunDate = today;
  S.lastRun = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), auto: !force, overdueMarked, sent, overdueTotal, openTotal };
  saveReminderSettings();
  return {overdueMarked, sent, overdueTotal, openTotal};
}

// 上传单个文件（请求体就是文件字节）；用 XHR 是为了拿到上传进度
function uploadFile(url, file, headers, onProgress){
  API.pendingWrites++; API.writeVersion++;
  return new Promise((resolve, reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    Object.entries(headers||{}).forEach(([k,v])=>{ if(v) xhr.setRequestHeader(k, v); });
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e=>{ if(e.lengthComputable && onProgress) onProgress(e.loaded/e.total); };
    xhr.onload = ()=>{
      let j = null; try{ j = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && j) return resolve(j);
      const detail = (j && typeof j.detail==='string') ? j.detail : `Upload failed (HTTP ${xhr.status}).`;
      reject(Object.assign(new Error(detail), {status:xhr.status, detail}));
    };
    xhr.onerror = ()=> reject(Object.assign(new Error('Network error'), {detail:'Network error — the file was not uploaded.'}));
    xhr.send(file);
  }).finally(()=>{ API.pendingWrites--; });
}

/* ===================== Follow-up feedback & closure approval (v3 Phase-14, feedback deck p.4 / p.11) =====================
   Any logged-in user reports progress on an open follow-up (text + evidence files, Outlook mails allowed);
   Managers / admins approve (the follow-up is closed) or reject with a remark. The server enforces all of it. */
const FEEDBACK_EXTENSIONS = [...FILE_EXTENSIONS, '.msg', '.eml'];
function feedbackFileProblem(file){
  const ext = (file.name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
  if(!FEEDBACK_EXTENSIONS.includes(ext)) return `${file.name}: only PowerPoint, PDF, Excel, Word or Outlook email (.msg / .eml) files can be attached.`;
  if(file.size===0) return `${file.name}: the file is empty.`;
  if(file.size>FILE_MAX_BYTES) return `${file.name}: the file is larger than 100 MB.`;
  return '';
}
function isLastOpenTask(c, t){ return (c.followUps||[]).every(x=> x.id===t.id || x.status==='Closed'); }
function feedbackSectionHtml(c, t){
  const list = t.feedback || [];
  const tid = escapeAttr(t.id);
  const loggedIn = !!state.user && !state.user.mustChangePassword;
  const closed = t.status==='Closed';
  const decisionPanel = f => {
    const fid = escapeAttr(f.id), lastOpen = isLastOpenTask(c, t);
    return `<div class="fb-panel" id="fbDecision_${fid}">
      <div class="form-field"><label>Remark (required when rejecting)</label><textarea class="edit-input" id="fbRemark_${fid}" placeholder="e.g. Further action: negotiate another 0.02 EUR/pc"></textarea></div>
      ${lastOpen ? `<div class="form-field" style="margin-top:8px;"><label>Final PPT / Supporting Document Link ${c.finalDocLink?'':'*'}</label><input class="edit-input" id="fbFinal_${fid}" value="${escapeAttr(c.finalDocLink||'')}" placeholder="https://…"/><div class="fx-hint">Approving closes the last open follow-up, which closes the case — the final document link is required.</div></div>` : ''}
      <div class="fb-actions">
        <button class="btn-primary" data-decision-send="${fid}" data-task="${tid}" data-decision="approved">Approve — close follow-up</button>
        <button class="btn-danger" data-decision-send="${fid}" data-task="${tid}" data-decision="rejected">Reject</button>
        <button class="btn-secondary" data-decision-cancel="${fid}">Cancel</button>
        <span class="fb-err" id="fbDecErr_${fid}"></span>
      </div>
    </div>`;
  };
  const entries = list.map(f=>{
    const d = f.decision, fid = escapeAttr(f.id);
    const badge = f.status==='approved' ? '<span class="badge approved">Approved</span>' : f.status==='rejected' ? '<span class="badge rejected">Rejected</span>' : '<span class="badge pending">Awaiting approval</span>';
    return `<div class="fb-entry ${esc(f.status)}" data-feedback-entry="${fid}">
      <div class="fb-head"><b>${esc(f.by)}</b><span>${esc(f.when)}</span>${badge}</div>
      <div class="fb-text">${esc(f.text)}</div>
      ${filesListHtml(f.files, false)}
      ${d ? `<div class="fb-decision">${f.status==='approved'?'Approved':'Not accepted'} by <b>${esc(d.by)}</b> · ${esc(d.when)}${d.remark?` — ${esc(d.remark)}`:''}${d.notify?`<div class="fb-meta">Result sent to ${esc(d.notify.to||'—')}${d.notify.cc?` (cc ${esc(d.notify.cc)})`:''}: ${esc(d.notify.result)}</div>`:''}</div>`
         : (f.notify ? `<div class="fb-meta">Approvers notified (${esc(f.notify.to||'—')}): ${esc(f.notify.result)}</div>` : '')}
      ${f.status==='pending' && state.isAdmin ? (state.decisionOpenId===f.id ? decisionPanel(f) : `<div class="fb-actions"><button class="btn-primary" data-decision-open="${fid}">Approve / Reject</button></div>`) : ''}
    </div>`;
  }).join('');
  const form = `<div class="fb-panel" id="fbForm_${tid}">
      <div class="form-field"><label>What was done? *</label><textarea class="edit-input" id="fbText_${tid}" placeholder="e.g. BP 50K negotiated, committed for 2026"></textarea></div>
      <div class="form-field" style="margin-top:8px;"><label>Evidence (optional — PowerPoint, PDF, Excel, Word or Outlook email .msg / .eml, 100 MB each)</label><input type="file" id="fbFiles_${tid}" multiple accept="${FEEDBACK_EXTENSIONS.join(',')}"/></div>
      <div class="fb-actions">
        <button class="btn-primary" data-feedback-send="${tid}">Submit for approval</button>
        <button class="btn-secondary" data-feedback-cancel="${tid}">Cancel</button>
        <span class="fb-err" id="fbErr_${tid}"></span>
      </div>
      <div class="fx-hint">Managers and Sourcing admins are notified by email; they approve (the follow-up is closed) or reject with a remark.</div>
    </div>`;
  const cta = closed ? '' : loggedIn
    ? (state.feedbackOpenId===t.id ? form : `<div class="fb-actions" style="margin-top:6px;"><button class="remind-btn" data-feedback-open="${tid}">Report progress / closure</button></div>`)
    : `<div class="fb-hint" style="margin-top:6px;">Log in to report progress on this follow-up.</div>`;
  return `<div class="fb-section">
    <div class="fb-meta" style="text-transform:uppercase;letter-spacing:.3px;">Feedback &amp; closure approval</div>
    ${t.closure ? `<div class="fb-closure">✓ Closed by ${esc(t.closure.by)} · ${esc(t.closure.when)}</div>` : ''}
    ${entries || (closed ? '' : '<div class="fb-hint">No feedback yet.</div>')}
    ${cta}
  </div>`;
}
function rollupActionStatus(list){
  if(!list || list.length===0) return null;
  if(list.some(t=>t.status==='Overdue')) return 'Overdue';
  if(list.some(t=>t.status==='Open')) return 'Open';
  return 'Closed';
}
// Admin-only. Removes the whole case (every weekly entry under that SWAT ID) and everything that points at it,
// so no orphan rows remain: linked submission is marked, reminder markers cleared, selection/edit state reset.
function deleteCase(swatId){
  const removed = ALL_CASES.filter(c=>c.swatId===swatId);
  ALL_CASES = ALL_CASES.filter(c=>c.swatId!==swatId);
  removed.forEach(c=> (c.followUps||[]).forEach(t=> REMINDED.delete(t.id)));
  SUBMISSIONS.forEach(s=>{ if(s.approvedSwatId===swatId){ s.status='Deleted'; s.rejectReason='Case '+swatId+' was deleted by an admin.'; } });
  if(state.selectedSwatId===swatId){ state.selectedSwatId=null; state.selectedEntryIndex=0; if(state.view==='detail') state.view='database'; clearCaseHash(); }
  state.detailEditMode=false; state.editBuffer=null; state.pendingDeleteId=null;
  return true;
}

function latestByCase(){
  const map = new Map();
  ALL_CASES.forEach(c=>{
    const prev = map.get(c.swatId);
    if(!prev || c.weekNum > prev.weekNum || (c.weekNum===prev.weekNum && c.caseNumber>prev.caseNumber)) map.set(c.swatId, c);
  });
  return [...map.values()];
}
function historyFor(swatId){
  return ALL_CASES.filter(c=>c.swatId===swatId).sort((a,b)=> a.weekNum-b.weekNum || a.caseNumber-b.caseNumber);
}
function uniq(arr){ return [...new Set(arr)]; }
// 区域存成固定顺序的 "EU + NA" 文本（服务端统一整理），这里拆回列表用于筛选和统计。
function regionList(x){ return String((x && x.region) || '').split('+').map(r=>r.trim()).filter(Boolean); }
function regionChecks(id, region){
  const picked = regionList({region});
  return `<div class="region-checks" id="${id}" role="group" aria-label="Region">${REGIONS.map(r=>
    `<label class="region-check"><input type="checkbox" value="${r}" ${picked.includes(r)?'checked':''}/>${r}</label>`).join('')}</div>`;
}
function checkedRegions(id){ return [...document.querySelectorAll('#'+id+' input:checked')].map(el=>el.value); }
function projectDatalist(id){
  const names = uniq([...ALL_CASES, ...SUBMISSIONS].map(x=>(x.project||'').trim()).filter(Boolean)).sort((a,b)=>a.localeCompare(b));
  return `<datalist id="${id}">${names.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('')}</datalist>`;
}

function matchesQuery(c,q){
  if(!q) return true;
  q = q.toLowerCase();
  const extraPns = partNumberLines(c).map(p=>p.partNumber+' '+p.partDescription).join(' ');
  return [c.swatId,c.partNumber,c.recommendedSupplier,c.project,c.cluster,c.region,wk(c.weekNum),c.partDescription,extraPns]
    .join(' ').toLowerCase().includes(q);
}
function matchesFilters(c,f){
  if(f.region && !regionList(c).includes(f.region)) return false;
  if(f.cluster && c.cluster!==f.cluster) return false;
  if(f.supplier && c.recommendedSupplier!==f.supplier) return false;
  if(f.decision && c.meetingDecision!==f.decision) return false;
  if(f.status && c.actionStatus!==f.status) return false;
  if(f.weekFrom && c.weekNum < Number(f.weekFrom)) return false;
  if(f.weekTo && c.weekNum > Number(f.weekTo)) return false;
  return true;
}

/* ===================== Account panel (v3 Phase-6: personal accounts) =====================
   Log in / register with the company email / change password / account menu. Element ids are kept
   from the shared-password era (adminToggle, adminLoginPanel, adminLoginBtn ...) — CSS and the
   regression tests reference them. The server enforces every role; hiding buttons is only a courtesy. */
function showAdminLogin(mode){
  mode = mode || (state.user ? 'menu' : 'login');
  const forced = mode==='password' && state.user && state.user.mustChangePassword;
  state.adminLoginOpen = true;
  const existing = document.getElementById('adminLoginPanel');
  if(existing && existing.dataset.mode===mode) return;
  if(existing) existing.remove();
  document.body.classList.add('admin-login-open');
  const p = document.createElement('div');
  p.id = 'adminLoginPanel';
  p.dataset.mode = mode;
  p.setAttribute('role','dialog');
  p.setAttribute('aria-label', {login:'Log in', register:'Create account', password:'Change password', menu:'Account'}[mode]);
  p.style.cssText = 'position:fixed;top:calc(var(--topbar-height) + 6px);right:12px;z-index:200;background:#fff;border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 8px 30px rgba(20,20,22,.18);padding:14px;width:280px;';
  const field = (id, label, type, auto, placeholder='') => `<label for="${id}" style="display:block;font-size:11px;color:var(--ink-soft);margin:8px 0 3px;">${label}</label><input id="${id}" type="${type}" class="edit-input" style="width:100%;" autocomplete="${auto}" placeholder="${escapeAttr(placeholder)}"/>`;
  const domains = ALLOWED_EMAIL_DOMAINS.map(d=>'@'+d).join(' or ');
  const title = t => `<div style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;">${t}</div>`;
  const actions = (primary, secondary) => `
    <div id="adminLoginErr" role="alert" style="font-size:11px;color:var(--red);font-weight:600;margin-top:8px;display:none;"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn-primary" id="adminLoginBtn" style="padding:7px 14px;font-size:12px;">${primary}</button>
      <button class="btn-secondary" id="adminLoginCancel" style="padding:6px 12px;font-size:12px;">${secondary}</button>
    </div>`;
  const hint = t => `<div style="font-size:11px;color:var(--ink-faint);margin-top:8px;">${t}</div>`;
  // 登录 / 注册用面板顶部的两个页签切换（用户 2026-09-28 要求"登录 / 注册"一眼可见）
  const tabs = active => `<div class="auth-tabs" role="tablist">
      <button type="button" role="tab" id="toLogin" class="${active==='login'?'on':''}" aria-selected="${active==='login'}">Log in</button>
      <button type="button" role="tab" id="toRegister" class="${active==='register'?'on':''}" aria-selected="${active==='register'}">Register</button>
    </div>`;
  if(mode==='login') p.innerHTML = tabs('login')
    + field('adminEmailInput','Company email','email','username', 'name'+(ALLOWED_EMAIL_DOMAINS[0]?'@'+ALLOWED_EMAIL_DOMAINS[0]:''))
    + field('adminPasswordInput','Password','password','current-password') + actions('Log in','Cancel')
    + hint(`No account yet? Switch to <b>Register</b> above. Forgot your password? Ask the Sourcing admin to reset it.`);
  else if(mode==='register') p.innerHTML = tabs('register')
    + field('regNameInput','Your name','text','name','e.g. J. Martinez')
    + field('adminEmailInput','Company email','email','username', 'name'+(ALLOWED_EMAIL_DOMAINS[0]?'@'+ALLOWED_EMAIL_DOMAINS[0]:''))
    + field('adminPasswordInput','Password (at least 10 characters)','password','new-password') + actions('Create account','Cancel')
    + hint(`Use your company email (${esc(domains)}). New accounts can submit cases; the Sourcing admin grants Manager or admin rights.`);
  else if(mode==='password') p.innerHTML = title('Change password')
    + (forced ? hint('Your password was reset by the Sourcing admin. Choose a new password to continue.') : '')
    + field('curPasswordInput','Current password','password','current-password')
    + field('adminPasswordInput','New password (at least 10 characters)','password','new-password')
    + actions('Change password', forced ? 'Log out' : 'Cancel');
  else p.innerHTML = title(esc(state.user.name))
    + `<div style="font-size:12px;color:var(--ink-soft);">${esc(state.user.email)}</div><div style="font-size:12px;margin-top:4px;">Role: <b>${esc(state.user.roleLabel||state.user.role)}</b></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn-secondary" id="toPassword" style="padding:6px 12px;font-size:12px;">Change password</button>
      <button class="btn-primary" id="adminLogoutBtn" style="padding:7px 14px;font-size:12px;">Log out</button>
    </div>`;
  document.body.appendChild(p);
  const $ = id => p.querySelector('#'+id);
  const onEnter = el => { if(el) el.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } }; };
  const showErr = msg => { const err = $('adminLoginErr'); err.textContent = msg; err.style.display = 'block'; };
  const signedIn = resp => {
    API.setSessionToken(resp.token);
    setCurrentUser(resp.user);
    hideAdminLogin();
    if(state.view==='submit' && !state.formDirty) render(); else if(state.view==='submit') renderNav(); else render();
    if(state.user && state.user.mustChangePassword) showAdminLogin('password');
  };
  const submit = async ()=>{
    const button = $('adminLoginBtn');
    if(!button || button.disabled || !p.isConnected) return;
    $('adminLoginErr').style.display = 'none';
    button.disabled = true;
    try{
      if(mode==='login'){
        const resp = await API.post('/api/auth/login', {email:$('adminEmailInput').value.trim(), password:$('adminPasswordInput').value});
        if(!p.isConnected){ await fetch('/api/auth/logout', {method:'POST', headers:{'X-Session-Token':resp.token}}).catch(()=>{}); return; }
        signedIn(resp);
      }else if(mode==='register'){
        const resp = await API.post('/api/auth/register', {name:$('regNameInput').value.trim(), email:$('adminEmailInput').value.trim(), password:$('adminPasswordInput').value});
        if(!p.isConnected){ await fetch('/api/auth/logout', {method:'POST', headers:{'X-Session-Token':resp.token}}).catch(()=>{}); return; }
        signedIn(resp);
        toast(`✓ Welcome, ${resp.user.name} — your account is ready.`);
      }else if(mode==='password'){
        const resp = await API.post('/api/auth/password', {currentPassword:$('curPasswordInput').value, newPassword:$('adminPasswordInput').value});
        setCurrentUser(resp.user);
        hideAdminLogin();
        if(state.view==='submit' && state.formDirty) renderNav(); else render();
        toast('✓ Password changed.');
      }
    }catch(e){
      if(!p.isConnected) return;
      showErr(e.detail || e.message);
      ($('adminPasswordInput')||{focus(){}}).focus();
    }finally{ button.disabled = false; }
  };
  const logout = async ()=>{
    try{ await API.post('/api/auth/logout'); }catch(e){}
    API.setSessionToken('');
    setCurrentUser(null);
    state.pendingDeleteId = null; state.feedbackOpenId = null; state.decisionOpenId = null;
    if(state.detailEditMode){ state.detailEditMode=false; state.editBuffer=null; }
    if(state.view==='accounts') state.view = 'home';
    hideAdminLogin();
    render();
  };
  if($('adminLoginBtn')) $('adminLoginBtn').onclick = submit;
  ['adminEmailInput','adminPasswordInput','regNameInput','curPasswordInput'].forEach(id=>onEnter($(id)));
  if($('adminLoginCancel')) $('adminLoginCancel').onclick = ()=>{ if(forced) logout(); else hideAdminLogin(); };
  if($('toRegister')) $('toRegister').onclick = e=>{ e.stopPropagation(); showAdminLogin('register'); };
  if($('toLogin')) $('toLogin').onclick = e=>{ e.stopPropagation(); showAdminLogin('login'); };
  if($('toPassword')) $('toPassword').onclick = e=>{ e.stopPropagation(); showAdminLogin('password'); };
  if($('adminLogoutBtn')) $('adminLogoutBtn').onclick = logout;
  p.onkeydown = (e)=>{ if(e.key==='Escape' && !forced){ hideAdminLogin(); document.getElementById('adminToggle').focus(); } };
  setTimeout(()=>{ const first = p.querySelector('input'); if(p.isConnected && first) first.focus(); }, 30);
}
function hideAdminLogin(){
  state.adminLoginOpen = false;
  document.body.classList.remove('admin-login-open');
  const p = document.getElementById('adminLoginPanel');
  if(p) p.remove();
}
document.addEventListener('click', (ev)=>{
  if(!state.adminLoginOpen) return;
  const p = document.getElementById('adminLoginPanel');
  if(p && p.dataset.mode==='password' && state.user && state.user.mustChangePassword) return;  // 必须先改密码
  if(p && !p.contains(ev.target) && !document.getElementById('adminToggle').contains(ev.target)) hideAdminLogin();
}, false);

/* 横向导航保留浏览器原生触摸惯性；只有鼠标左键启用拖拽。 */
function revealNavButton(button){
  if(!button) return;
  const nav = button.parentElement;
  const n = nav.getBoundingClientRect(), b = button.getBoundingClientRect();
  if(b.left < n.left) nav.scrollLeft -= n.left - b.left;
  else if(b.right > n.right) nav.scrollLeft += b.right - n.right;
}
function wireNavPan(nav){
  if(nav.dataset.panWired) return;
  nav.dataset.panWired = '1';
  nav.addEventListener('focusin', e=>revealNavButton(e.target.closest('button')));
  nav.addEventListener('wheel', e=>{
    if(e.ctrlKey || e.metaKey) return; // 浏览器缩放与触控板捏合交给浏览器。
    const max = nav.scrollWidth - nav.clientWidth;
    if(max <= 0) return;
    const unit = e.deltaMode===1 ? 16 : e.deltaMode===2 ? nav.clientWidth : 1;
    const delta = (Math.abs(e.deltaX)>Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    const next = Math.max(0, Math.min(max, nav.scrollLeft + delta));
    if(next!==nav.scrollLeft){ e.preventDefault(); nav.scrollLeft = next; }
  }, {passive:false});
  let drag = null, suppressClick = false;
  const finish = ()=>{
    const previous = drag;
    drag = null;
    nav.classList.remove('is-dragging');
    if(previous && nav.hasPointerCapture(previous.id)) nav.releasePointerCapture(previous.id);
  };
  nav.addEventListener('pointerdown', e=>{
    suppressClick = false;
    if(e.pointerType!=='mouse' || e.button!==0 || !e.isPrimary || nav.scrollWidth<=nav.clientWidth) return;
    drag = {id:e.pointerId, x:e.clientX, left:nav.scrollLeft, moved:false};
  });
  window.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    if(!(e.buttons & 1)){ finish(); return; }
    const dx = e.clientX - drag.x;
    if(!drag.moved){
      if(Math.abs(dx)<=5) return;
      drag.moved = true;
      nav.classList.add('is-dragging');
      nav.setPointerCapture(e.pointerId);
    }
    e.preventDefault();
    nav.scrollLeft = drag.left - dx;
  });
  window.addEventListener('pointerup', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    suppressClick = drag.moved;
    finish();
  });
  window.addEventListener('pointercancel', e=>{
    if(drag && e.pointerId===drag.id){ suppressClick = false; finish(); }
  });
  nav.addEventListener('lostpointercapture', finish);
  window.addEventListener('blur', ()=>{ suppressClick = false; finish(); });
  nav.addEventListener('click', e=>{
    if(suppressClick && e.detail!==0){ e.preventDefault(); e.stopPropagation(); }
    suppressClick = false;
  }, true);
}

/* 表格可用触控板、Shift＋滚轮及键盘横滚；普通滚轮继续滚动页面。 */
let tableScrollObserver = null;
function wireScrollRegions(){
  tableScrollObserver?.disconnect();
  const update = el=>{
    const overflowing = el.scrollWidth > el.clientWidth + 1;
    el.tabIndex = overflowing ? 0 : -1;
    if(overflowing){
      el.setAttribute('role','region');
      el.setAttribute('aria-label','Scrollable table — use Left and Right arrow keys or Shift + mouse wheel');
    }else{
      el.removeAttribute('role');
      el.removeAttribute('aria-label');
    }
  };
  tableScrollObserver = new ResizeObserver(entries=>{
    const wrappers = new Set(entries.map(({target})=>target.matches('table') ? target.parentElement : target));
    wrappers.forEach(update);
  });
  document.querySelectorAll('#app table.data-table').forEach(table=>{
    const el = table.parentElement;
    if(getComputedStyle(el).overflowX!=='auto') return;
    el.classList.add('table-scroll');
    update(el);
    tableScrollObserver.observe(el);
    tableScrollObserver.observe(table);
    el.addEventListener('wheel', e=>{
      if(!e.shiftKey || e.ctrlKey || e.metaKey || e.deltaX || !e.deltaY) return;
      const unit = e.deltaMode===1 ? 16 : e.deltaMode===2 ? el.clientWidth : 1;
      const next = Math.max(0,Math.min(el.scrollWidth-el.clientWidth,el.scrollLeft+e.deltaY*unit));
      if(next!==el.scrollLeft){ e.preventDefault(); el.scrollLeft=next; }
    },{passive:false});
  });
}
const headerSizeObserver = new ResizeObserver(()=>{
  document.documentElement.style.setProperty('--topbar-height',document.querySelector('.topbar').getBoundingClientRect().height+'px');
});
headerSizeObserver.observe(document.querySelector('.topbar'));

/* ============================= RENDER: NAV ============================= */
function renderNav(){
  const pendingCount = SUBMISSIONS.filter(s=>s.status==='Waiting for Registration Confirmation').length;
  const tabs = [['home','Home'],['submit','Submit Case'],
    ['approvals','Approval'+(pendingCount>0?` (${pendingCount})`:'')],
    ['database','Database'],['dashboard','Dashboard'],['followups','Follow-ups'],
    ...(state.isSysAdmin ? [['accounts','Accounts']] : [])];
  document.getElementById('navtabs').innerHTML = tabs.map(([k,l])=>
    `<button data-nav="${k}" class="${state.view===k?'active':''}">${l}</button>`).join('');
  const nt = document.getElementById('navtabs');
  wireNavPan(nt);
  requestAnimationFrame(()=>revealNavButton(nt.querySelector('.active')));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const changed = state.view!==b.dataset.nav;
    state.view=b.dataset.nav; state.dashFilter=null; state.pendingDeleteId=null; state.feedbackOpenId=null; state.decisionOpenId=null;
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    render();
    document.querySelector('[data-nav="'+state.view+'"]')?.focus({preventScroll:true});
    if(changed) window.scrollTo(0,0);
  });
  const at = document.getElementById('adminToggle');
  if(at){
    at.textContent = state.user ? `${state.user.name} · ${state.user.roleLabel||state.user.role}` : 'Log in / Register';
    at.classList.toggle('on', state.isAdmin);
    at.onclick = ()=>{
      if(document.getElementById('adminLoginPanel')){ if(!(state.user && state.user.mustChangePassword)) hideAdminLogin(); return; }
      showAdminLogin();
    };
    if(state.adminLoginOpen && !document.getElementById('adminLoginPanel')) showAdminLogin();
  }
}

function renderHome(){
  return `
  <div class="pagehead">
    <h1>Sourcing Committee Cockpit</h1>

function escapeAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
// HTML-escape free-text data before it lands in innerHTML template strings (escapes & and <,
// which is enough to prevent element/textarea breakout). Apply to every user-entered value.
function esc(v){ return (v===null||v===undefined) ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function isHttpUrl(value){
  if(typeof value!=='string' || !/^https?:\/\/\S+$/i.test(value)) return false;
  try{ const url = new URL(value); return (url.protocol==='http:' || url.protocol==='https:') && !!url.hostname; }catch(e){ return false; }
}
function documentLink(value){
  return isHttpUrl(value) ? `🔗 <a href="${escapeAttr(value)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>` : esc(value);
}

/* ---- CSV export (replaces the old cumulative weekly-Excel habit) ---- */
// Excel formula-injection guard: a cell starting with = + - @ (or tab/CR) would be evaluated
// when the file is opened in Excel — prefix a ' so it stays text. Pure numbers are left alone.
// Used by both exports (CSV and the HTML-based .xls agenda).
function formulaGuard(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  return (/^[\t\r\n]/.test(s) || (/^\s*[=+\-@]/.test(s) && !Number.isFinite(Number(s)))) ? "'"+s : s;
}
function csvEscape(v){
  return '"' + formulaGuard(v).replace(/"/g,'""') + '"';
}
async function saveBlobFile(blob, filename){
  // Published-artifact runtime: offer the file via the platform's downloads capability.
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{ await downloads.save({filename, data:blob}); return; }
        catch(err){ /* viewer declined, or unavailable — fall through to the direct method below */ }
      }
    }catch(err){ /* capability not obtainable — fall through */ }
  }
  // Plain-HTML fallback (works when this file is opened directly, outside the Artifact runtime).
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function downloadCasesCsv(rows, filename){
  const anyDecided = rows.some(c=>c.meetingDecision!=='PENDING');
  const headers = ['Week','Case #','SWAT Case Number','Part Number(s)','Part Description(s)','Region','Project','Product Family','Cluster',
    'Parent PF','Part Family Code','Sourcing Type','Recommended Supplier','Presenter','Decision Level',
    'Bundle Peak Year Spend','Bundle Lifetime Spend','Spend Currency','Pc Price CQA','Supplier Price (landed)','Tooling CQA','Supplier Tooling Cost','Average Volume','Lifetime Volume','Tooling Payment',
    'BPG available','FRA available','Sourcing Decision','Case Comments'].concat(anyDecided ? ['Action Status','Open Follow-up Tasks'] : []);
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(c=>{
    const pending = c.meetingDecision==='PENDING';
    const tasksSummary = pending ? '' : ((c.followUps||[]).map(t=>`${t.task} [${t.responsible}, due ${t.dueDate}, ${t.status}]`).join(' | ') || 'No action');
    const pnLines = partNumberLines(c);
    const pnSummary = pnLines.map(p=>p.partNumber).join(' | ');
    // 项目 / 类型 / 供应商按零件行（v3 Phase-15）；旧多零件案例的行上没有就用案例级值
    const pdSummary = pnLines.map(p=>`${p.partNumber}: ${p.partDescription} [${p.project||c.project} / ${p.sourcingType||c.sourcingType} / ${p.recommendedSupplier||c.recommendedSupplier}]`).join(' | ');
    const perRow = k => pnLines.map(p=>p[k]??'').join(' | ');  // 件价 / 模具费 / 产量按零件行，多行用 " | " 分隔
    lines.push([wk(c.weekNum),c.caseNumber,c.swatId,pnSummary,pdSummary,c.region,c.project,c.family,c.cluster,
      c.parentPF,c.partFamilyCode,c.sourcingType,c.recommendedSupplier,c.presenter,c.decisionLevel,
      c.peakYearSpend,c.lifetimeSpend,spendCurrency(c),perRow('pcPriceCQA'),perRow('supplierPriceLanded'),perRow('toolingCQA'),perRow('supplierToolingCost'),perRow('averageVolume'),perRow('lifetimeVolume'),c.toolingPayment||'',
      c.bpgAvailable||'',c.fraAvailable||'',c.meetingDecision,c.submitterComments||''
    ].concat(anyDecided ? [(pending?'':(c.actionStatus===null?'No action':c.actionStatus)), tasksSummary] : []).map(csvEscape).join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'}); // BOM: Windows Excel opens UTF-8 CSV correctly
  await saveBlobFile(blob, filename);
}

// 议程 / 纪要导出（v3 Phase-4）：服务端用 openpyxl 生成真正的 .xlsx，这里只负责下载。
// selection = {week} 走 Dashboard 的按周接口；{ids} 走 Database 页的按筛选结果接口（同一版式）
async function downloadExport(kind, selection){
  const headers = API.sessionToken() ? {'X-Session-Token': API.sessionToken()} : {};
  const resp = selection.ids
    ? await fetch(`/api/exports/${kind}`, {method:'POST', headers:{...headers, 'Content-Type':'application/json'}, body: JSON.stringify({ids: selection.ids})})
    : await fetch(`/api/exports/${kind}?week=${encodeURIComponent(selection.week)}`, {headers});
  if(!resp.ok){
    let detail = resp.statusText;
    try{ const j = await resp.json(); detail = typeof j.detail==='string' ? j.detail : detail; }catch(e){}
    throw new Error(detail);
  }
  const m = /filename="([^"]+)"/.exec(resp.headers.get('content-disposition')||'');
  const filename = m ? m[1] : `Sourcing_Committee_${kind==='agenda'?'Agenda':'Minutes'}_${selection.ids ? 'Database' : wk(selection.week)}.xlsx`;
  await saveBlobFile(await resp.blob(), filename);
}
function downloadWeekExport(kind, week){ return downloadExport(kind, {week}); }
// 防双击：一次点击一个文件；失败 toast 且按钮可再点
function bindExportButton(id, kind, selectionFn){
  const btn = document.getElementById(id);
  if(btn) btn.onclick = async ()=>{
    if(btn.disabled) return;
    btn.disabled = true;
    try{ await downloadExport(kind, selectionFn()); }
    catch(err){ toast('⚠ Export failed: '+(err.message||err)); }
    btn.disabled = false;
  };
}

function deliveryBadge(part){
  if(!part) return '';
  if(part==='sent') return '<span style="color:var(--green);font-weight:600;">✓ sent</span>';
  if(part==='skipped') return '<span style="color:var(--ink-faint);">— skipped</span>';
  return `<span style="color:var(--red);font-weight:600;" title="${escapeAttr(part)}">✗ failed</span>`;
}
function deliveryCell(d){
  if(!d || (!d.email && !d.teams)) return '<span style="color:var(--ink-faint);">—</span>';
  const parts = [];
  if('email' in d) parts.push('Email ' + deliveryBadge(d.email));
  if('teams' in d) parts.push('Teams ' + deliveryBadge(d.teams));
  return parts.join('<br/>');
}

function renderFollowups(){
  const latest = latestByCase();
  // Flatten: one row per open/overdue TASK (a case can now carry several tasks)
  let items = [];
  latest.forEach(c=>{
    (c.followUps||[]).forEach(t=>{
      if(t.status==='Open' || t.status==='Overdue') items.push({c, t});
    });
  });

  // 固定八类始终可选；旧任务上的自由标签和"未分类"跟在后面
  const present = uniq(items.flatMap(x=> (x.t.tags&&x.t.tags.length)?x.t.tags:['Uncategorized']));
  const tagOpts = [...ACTION_CATEGORIES, ...present.filter(t=>!ACTION_CATEGORIES.includes(t)).sort()];
  const ownerOpts = uniq(items.map(x=>x.t.responsible)).sort();

  if(state.followupTag) items = items.filter(x=> {
    const t = (x.t.tags&&x.t.tags.length) ? x.t.tags : ['Uncategorized'];
    return t.includes(state.followupTag);
  });
  if(state.followupOwner) items = items.filter(x=> x.t.responsible===state.followupOwner);

  items.sort((a,b)=>{
    const da = a.t.dueDate==='—' ? '9999-99-99' : a.t.dueDate;
    const db = b.t.dueDate==='—' ? '9999-99-99' : b.t.dueDate;
    return state.followupSortDir==='asc' ? da.localeCompare(db) : db.localeCompare(da);
  });

  const overdueCount = items.filter(x=>x.t.status==='Overdue').length;
  const pendingFeedback = items.reduce((n,x)=> n + (x.t.feedback||[]).filter(f=>f.status==='pending').length, 0);

  return `
  <div class="pagehead">
    <h1>Follow-ups to Track</h1>
    <p>Every open task across all cases — a case can carry more than one — with owner, due date and category, so nothing gets missed before the next meeting. Categories: ${ACTION_CATEGORIES.join(' · ')}.</p>
  </div>

  <div class="filters-bar">
    <select id="fFollowupTag"><option value="">Category: All</option>${tagOpts.map(c=>`<option ${state.followupTag===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <select id="fFollowupOwner"><option value="">Owner: All</option>${ownerOpts.map(o=>`<option ${state.followupOwner===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <div class="resultcount">${items.length} open task${items.length!==1?'s':''}${overdueCount>0?` · <span style="color:var(--red);font-weight:600;">${overdueCount} overdue</span>`:''}${pendingFeedback>0?` · <span style="color:var(--amber);font-weight:600;">${pendingFeedback} feedback to approve</span>`:''}</div>
  </div>

  <div class="card" style="overflow-x:auto;">
    ${items.length===0 ? emptyState() : `
    <table class="data-table">
      <thead><tr>
        <th>SWAT Case</th><th>Category</th><th>Task</th><th>Owner</th><th>Reminder goes to</th>
        <th class="sortable-th" id="sortDueTh">Due Date <span class="arrow">${state.followupSortDir==='asc'?'▲':'▼'}</span></th>
        <th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${items.map(({c,t})=>{
          const overdue = t.status==='Overdue';
          const rc = taskRecipient(t);
          const open = state.remindOpenId===t.id;
          const last = t.lastReminder;
          const fbOpen = state.feedbackRowId===t.id, fbPending = (t.feedback||[]).filter(f=>f.status==='pending').length;
          return `<tr>
            <td class="mono swat" style="cursor:pointer;" data-swat-link="${escapeAttr(c.swatId)}">${esc(c.swatId)}</td>
            <td>${(t.tags||[]).length ? t.tags.map(tg=>`<span class="cat-tag">${esc(tg)}</span>`).join(' ') : `<span class="cat-tag none">Uncategorized</span>`}</td>
            <td>${esc(t.task)}</td>
            <td>${esc(t.responsible)}</td>
            <td style="font-size:11px;color:var(--ink-soft);line-height:1.5;">
              <span class="mono" style="color:var(--ink);font-weight:600;">${rc.email ? esc(rc.email) : '<span style="color:var(--red);">no email on file</span>'}</span><br/>
              ${rc.cc?`CC: ${esc(rc.cc)}<br/>`:''}<span class="cat-tag">${esc(rc.channel)}</span>
            </td>
            <td class="${overdue?'due-overdue':''}">${esc(t.dueDate)}${(()=>{ const n = nextReminderDate(t); return n ? (t.lastAutoReminderDate===todayISO() ? `<div style="font-size:10.5px;color:var(--green);font-weight:600;white-space:nowrap;">Auto-reminded today ✓</div>` : `<div style="font-size:10.5px;color:var(--ink-faint);font-weight:400;white-space:nowrap;">Auto reminder: ${n}</div>`) : (t.lastAutoReminderDate===todayISO() ? `<div style="font-size:10.5px;color:var(--green);font-weight:600;">Auto-reminded today ✓</div>` : ''); })()}</td>
            <td>${actionCell(t.status)}</td>
            <td>
              ${last ? `<div style="font-size:10.5px;color:var(--green);font-weight:600;margin-bottom:4px;">Sent ✓ ${esc(last.when)}<br/>via ${esc(last.channel)}${last.delivery ? `<br/>${deliveryCell(last.delivery)}` : ''}</div>` : ''}
              ${state.isAdmin ? `<button class="remind-btn" data-remind-open="${escapeAttr(t.id)}">${open?'Close':(last?'Send again':'Send reminder')}</button>` : `<span style="font-size:10.5px;color:var(--ink-faint);white-space:nowrap;">Send reminder: Manager</span>`}
              <div style="margin-top:6px;"><button class="remind-btn" data-feedback-toggle="${escapeAttr(t.id)}" ${fbPending?'style="border-color:var(--amber);color:var(--amber);"':''}>${fbOpen?'Hide feedback':(fbPending?`Feedback (${fbPending} to approve)`:'Feedback')}</button></div>
            </td>
          </tr>
          ${fbOpen ? `<tr class="remind-row"><td colspan="8" style="background:#FAFAFB;">${feedbackSectionHtml(c,t)}</td></tr>` : ''}
          ${open ? `<tr class="remind-row"><td colspan="8" style="background:#FAFAFB;">
            <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;padding:6px 4px;">
              <div class="form-field"><label>Send reminder to (email) *</label><input class="edit-input" id="rmEmail_${escapeAttr(t.id)}" value="${escapeAttr(rc.email)}" placeholder="firstname.lastname@company.com"/></div>
              <div class="form-field"><label>CC (optional, comma-separated emails)</label><input class="edit-input" id="rmCc_${escapeAttr(t.id)}" value="${escapeAttr(rc.cc)}"/></div>
              <div class="form-field"><label>Channel</label><select class="edit-input" id="rmChannel_${escapeAttr(t.id)}">${REMINDER_CHANNELS.map(ch=>`<option ${rc.channel===ch?'selected':''}>${ch}</option>`).join('')}</select></div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;padding:0 4px 8px;">
              <button class="btn-primary" style="padding:8px 16px;font-size:12.5px;" data-remind-send="${escapeAttr(t.id)}">Send reminder</button>
              <span id="rmErr_${escapeAttr(t.id)}" style="font-size:11.5px;color:var(--red);font-weight:600;"></span>
            </div>
            <div style="padding:0 4px 10px;">
              <div style="font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;">Message preview (same content for Email and Teams)</div>
              <pre style="margin:0;white-space:pre-wrap;font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;line-height:1.5;background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 12px;">${esc(reminderMessage(c,t))}</pre>
              <div style="font-size:11px;color:var(--ink-faint);margin-top:4px;">Sent for real through the server's email / Teams channels; a channel that is not configured on the server is logged as skipped.</div>
            </div>
          </td></tr>` : ''}`;
        }).join('')}
      </tbody>
    </table>`}
  </div>
  ${renderAutoReminderCard()}
  `;
}

      <h3>Screening Questions</h3>

          <div class="form-field"><label>Has Family Alignment been completed? *</label>

          </div>

          <div class="form-field"><label>Has this case passed CCB2? *</label>

/* ============================= RENDER: ACCOUNTS (v3 Phase-6) =============================
   Sourcing admin only: promote / demote, disable, reset a forgotten password (no mail channel yet —
   the temporary password is shown once, here, and the person must change it at the next login). */
async function loadAccounts(){
  if(state.accountsLoading) return;
  state.accountsLoading = true;
  try{
    const resp = await API.get('/api/users');
    state.accounts = resp.users || [];
    state.accountsError = null;
  }catch(e){ state.accountsError = e.detail || e.message; }
  finally{ state.accountsLoading = false; }
  if(state.view==='accounts' && state.isSysAdmin) render();
}
function renderAccounts(){
  if(state.accounts===null && !state.accountsError) loadAccounts();
  const me = state.user ? state.user.email : '';
  const users = [...(state.accounts||[])].sort((a,b)=> (a.name||'').localeCompare(b.name||'') || a.email.localeCompare(b.email));
  const domains = ALLOWED_EMAIL_DOMAINS.map(d=>'@'+d).join(' or ');
  const n = state.accountsNotice;
  const notice = n ? `<div class="submit-banner show" id="accountsNotice" style="margin:0 0 14px;">
      Temporary password for <b>${esc(n.email)}</b>: <span class="mono" style="font-size:13px;user-select:all;">${esc(n.temporaryPassword)}</span><br/>
      <span style="font-weight:400;">Pass it on privately — it is shown only this once. They must choose a new password at their next login; their other sessions have been logged out.</span>
      <button type="button" class="link-btn" id="accountsNoticeClose" style="margin-left:8px;">Dismiss</button>
    </div>` : '';
  const roleSelect = u => `<select class="edit-input" style="width:auto;min-width:130px;" data-user-role="${escapeAttr(u.email)}" ${u.email===me?'disabled title="Ask another Sourcing admin to change your own role"':''}>${ROLE_OPTIONS.map(([v,l])=>`<option value="${v}" ${u.role===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const rows = users.map(u=>`<tr>
      <td>${esc(u.name)}${u.email===me?' <span class="cat-tag">you</span>':''}</td>
      <td class="mono">${esc(u.email)}</td>
      <td>${roleSelect(u)}</td>
      <td>${u.disabled ? '<span class="badge noaction">Disabled</span>' : '<span class="badge approved">Active</span>'}${u.mustChangePassword ? '<div style="font-size:10.5px;color:var(--amber);font-weight:600;margin-top:3px;white-space:nowrap;">Temporary password</div>' : ''}</td>
      <td style="white-space:nowrap;">${esc(u.createdAt||'—')}</td>
      <td style="white-space:nowrap;">${esc(u.lastLoginAt||'—')}</td>
      <td style="white-space:nowrap;">
        ${u.email===me ? '' : `<button class="btn-secondary" style="padding:5px 10px;font-size:11.5px;" data-user-disable="${escapeAttr(u.email)}" data-disabled="${u.disabled?'1':'0'}">${u.disabled?'Enable':'Disable'}</button>
        <button class="btn-secondary" style="padding:5px 10px;font-size:11.5px;margin-left:6px;" data-user-reset="${escapeAttr(u.email)}">Reset password</button>`}
      </td>
    </tr>`).join('');
  return `
  <div class="pagehead">
    <h1>Accounts</h1>
    <p>Everyone registers with their company email (${esc(domains)}) and starts as a <b>User</b>: submit and view cases. <b>Manager</b> (purchasing / NPI manager): also confirm or return registrations, edit and delete cases, record decisions and follow-ups, send reminders. <b>Sourcing admin</b>: also exchange rates, registration deadline, reminder settings and this page.</p>
  </div>
  ${notice}
  <div class="card" style="overflow-x:auto;">
    ${state.accountsError ? `<div style="padding:18px;color:var(--red);font-weight:600;font-size:12.5px;">Could not load the accounts: ${esc(state.accountsError)} <button type="button" class="link-btn" id="accountsRetry">Retry</button></div>`
    : state.accounts===null ? `<div style="padding:18px;color:var(--ink-faint);font-size:12.5px;">Loading accounts…</div>`
    : users.length===0 ? emptyState() : `
    <table class="data-table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Registered</th><th>Last login</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="padding:10px 12px;font-size:11.5px;color:var(--ink-faint);">Forgot password: reset it here and pass the temporary password on privately — the Cockpit has no mail channel for it yet. At least one active Sourcing admin must remain.</div>`}
  </div>
  `;
}

/* ============================= RENDER: APPROVALS ============================= */
function renderApprovals(){
  const pending = SUBMISSIONS.filter(s=>s.status==='Waiting for Registration Confirmation');
  const decided = SUBMISSIONS.filter(s=>s.status!=='Waiting for Registration Confirmation').sort((a,b)=> b.subId.localeCompare(a.subId));
  return `
  <div class="pagehead">
    <h1>Registration Confirmation</h1>
    <p>Confirm that a submitted case is accepted into the system, or reject it with a reason. This is <b>not</b> the Sourcing Committee decision — a confirmed case enters the Database with Sourcing Decision = Pending, and the committee decides later.</p>
  </div>

  ${pending.length===0 ? `<div class="card"><div class="empty-state">No submissions waiting for review.</div></div>` :
    pending.map(s=>`
    <div class="card appr-card">
      <div class="appr-top">
        <div>
          <div class="appr-title">${esc(s.partNumber)} — ${esc(s.partDescription)}${(s.partNumbers&&s.partNumbers.length>1)?` (+${s.partNumbers.length-1} more part number${s.partNumbers.length>2?'s':''})`:''}</div>
          <div class="who">Submitted by ${esc(s.submitterName)} (${esc(s.submitterEmail)}) · ${esc(s.submittedAt)}${s.caseId?` · <b style="color:${s.existingSwatId?'var(--accent)':'var(--green)'};">${s.existingSwatId?`Came back — existing case ${esc(s.existingSwatId)} (${s.priorEntries} previous entr${s.priorEntries===1?'y':'ies'}), will be linked to its history`:`New case ${esc(s.caseId)}`}</b>`:''}</div>
        </div>
        <span class="badge pending">Waiting for Registration Confirmation</span>
      </div>
      ${s.lateRegistration ? `<div class="block-warning" style="display:block;margin:0 0 12px;background:var(--amber-tint);border-color:#EAD3A0;color:var(--amber);">⏰ Late registration — exception requested. Deadline was ${esc(s.lateRegistration.deadline)}. Reason: ${esc(s.lateRegistration.reason)}. Confirming the registration approves the exception.</div>` : ''}
      ${(s.partNumbers&&s.partNumbers.length>1) ? `
      <div style="border:1px solid var(--border);border-radius:6px;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch;">
        <table class="data-table" style="font-size:12px;">
          <thead><tr><th>Part Number</th><th>Part Description</th><th>Project</th><th>Type</th><th>Recommended Supplier</th></tr></thead>
          <tbody>${s.partNumbers.map(r=>`<tr><td class="mono">${esc(r.partNumber)}</td><td>${esc(r.partDescription)}</td><td>${esc(r.project||s.project)}</td><td>${esc(r.sourcingType||s.sourcingType)}</td><td>${esc(r.recommendedSupplier||s.recommendedSupplier)}</td></tr>`).join('')}</tbody>
        </table>
      </div>` : ''}
      <div class="appr-grid">
        ${infoItem('Requested Meeting Date', s.meetingDateLabel||'—')}
        ${infoItem('Region', s.region)}
        ${infoItem('Project', s.project)}
        ${infoItem('Cluster', s.cluster)}
        ${infoItem('Sourcing Type', s.sourcingType)}
        ${infoItem('Recommended Supplier', s.recommendedSupplier)}
        ${infoItem('Decision Level', s.decisionLevel)}
        ${infoItem('Bundle Peak Year Spend', spendText(s,'peakYearSpend'))}
        ${infoItem('Bundle Lifetime Spend', spendText(s,'lifetimeSpend'))}
        ${isConverted(s) ? infoItem('Exchange Rate', fxLabel(s.fx)) : ''}
      </div>
      ${hasCommercial(s) ? `<div class="appr-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        ${commercialInfoItems(s)}
        ${optionalInfoItems(s)}
      </div>` : ''}
      <div class="info-item"><div class="k">Case Comments</div><div class="v" style="font-weight:400;">${esc(s.committeeDiscussion||'—')}</div></div>
      ${(s.files&&s.files.length) ? `<div class="info-item" style="margin-top:10px;"><div class="k">Sourcing Presentation Files</div>${filesListHtml(s.files, false)}</div>` : ''}
      <div class="appr-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        ${infoItem('Family Case?', s.isFamilyCase||'—')}
        ${infoItem('Family Alignment Done?', s.familyAligned||'—')}
        ${(s.familyEvidence && s.familyEvidence!=='—') ? infoItem('Family Alignment Evidence', s.familyEvidence) : ''}
        ${infoItem('Involves ECM?', s.involvesECM||'—')}
        ${infoItem('Passed CCB2?', s.ccbApproved||'—')}
      </div>
      ${state.isAdmin ? `<div class="appr-actions">
        <button class="btn-primary" data-approve="${escapeAttr(s.subId)}">Confirm Registration</button>
        <button class="btn-danger" data-reject-toggle="${escapeAttr(s.subId)}">Reject</button>
