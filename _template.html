<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sourcing Committee Cockpit</title>
<style>
  :root{
    --bg:#F3F4F6;
    --surface:#FFFFFF;
    --ink:#23262B;
    --ink-soft:#666B76;
    --ink-faint:#9AA0AA;
    --border:#E1E3E8;
    --border-strong:#CBCFD6;
    --accent:#E8580A;
    --accent-dark:#C24A08;
    --accent-tint:#FCE9DE;
    --green:#1E8E5A;
    --green-tint:#E4F5EC;
    --amber:#B8790A;
    --amber-tint:#FCF1DA;
    --red:#C13A2E;
    --red-tint:#FBEAE7;
    --gray:#8A909B;
    --gray-tint:#EDEEF1;
    --header:#23262B;
    --radius:8px;
    --shadow: 0 1px 2px rgba(20,20,22,0.04), 0 1px 8px rgba(20,20,22,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  ::selection{background:var(--accent-tint);}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--header);
    color:#fff;
    display:flex;
    align-items:center;
    gap:24px;
    padding:0 20px;
    height:52px;
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;letter-spacing:.2px;white-space:nowrap;}
  .brand .mark{
    width:22px;height:22px;border-radius:5px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;
  }
  .brand .sub{color:#B7BBC3;font-weight:400;font-size:12px;border-left:1px solid #454951;padding-left:10px;margin-left:2px;}
  .navtabs{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none;}
  .navtabs::-webkit-scrollbar{display:none;}
  .navtabs button{flex:none;}
  .navtabs button{
    background:transparent;border:none;color:#C7CAD1;padding:8px 14px;border-radius:6px;
    font-size:13px;cursor:pointer;font-weight:500;
  }
  .navtabs button:hover{background:#2F323A;color:#fff;}
  .navtabs button.active{background:#33353D;color:#fff;}
  .navtabs button.active::after{content:'';}
  .topbar .gsearch{
    margin-left:auto;display:flex;align-items:center;background:#33353D;border:1px solid #43454D;
    border-radius:6px;padding:0 10px;height:32px;width:280px;
  }
  .topbar .gsearch input{
    background:transparent;border:none;outline:none;color:#fff;font-size:13px;width:100%;padding:0 6px;
  }
  .topbar .gsearch input::placeholder{color:#8A8E97;}
  .topbar .gsearch svg{flex:none;opacity:.6;}
  .admin-toggle{flex:none;margin-left:10px;height:30px;padding:0 11px;border-radius:15px;border:1px solid #4A4D56;background:#33353D;color:#C7CAD1;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .admin-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-danger-sm{background:#fff;color:var(--red);border:1px solid #EFC2BC;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn-danger-sm:hover{background:var(--red-tint);}
  .confirm-inline{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--red);font-weight:600;white-space:nowrap;}

  /* ---------- Layout ---------- */
  .page{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  .pagehead{margin-bottom:18px;}
  .pagehead h1{font-size:19px;margin:0 0 4px;font-weight:600;}
  .pagehead p{margin:0;color:var(--ink-soft);font-size:13px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}

  /* ---------- Home / Upload ---------- */
  .home-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:18px;align-items:start;}
  @media(max-width:880px){.home-grid{grid-template-columns:1fr;}}

  .upload-card{padding:22px;}
  .upload-card h2{font-size:14.5px;margin:0 0 3px;font-weight:600;}
  .upload-card .hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 16px;}
  .dropzone{
    border:1.5px dashed var(--border-strong);
    border-radius:8px;
    padding:34px 20px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
    background:#FAFAFB;
  }
  .dropzone:hover{border-color:var(--accent);background:var(--accent-tint);}
  .dropzone .icon{
    width:46px;height:46px;border-radius:10px;background:var(--accent-tint);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  }
  .dropzone .title{font-weight:600;font-size:14px;margin-bottom:3px;}
  .dropzone .example{
    display:inline-block;margin-top:12px;background:var(--gray-tint);color:var(--ink-soft);
    font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;padding:4px 9px;border-radius:5px;
  }
  .dropzone .small{color:var(--ink-faint);font-size:11.5px;margin-top:10px;}

  .upload-progress{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;display:none;}
  .upload-progress.show{display:block;}
  .step-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--ink-faint);}
  .step-row .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex:none;position:relative;}
  .step-row.active{color:var(--ink);}
  .step-row.active .dot{border-color:var(--accent);}
  .step-row.done{color:var(--ink);}
  .step-row.done .dot{border-color:var(--green);background:var(--green);}
  .step-row.done .dot::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .step-row .spinner{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent-tint);border-top-color:var(--accent);position:absolute;top:1px;left:1px;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .upload-success{
    display:none;margin-top:12px;background:var(--green-tint);border:1px solid #BEE3D0;color:var(--green);
    padding:10px 12px;border-radius:6px;font-size:12.5px;font-weight:600;
  }
  .upload-success.show{display:block;}

  .quicksearch-card{padding:22px;margin-top:18px;}
  .quicksearch-card h2{font-size:14.5px;margin:0 0 3px;font-weight:600;}
  .quicksearch-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
  .qs-input-wrap{position:relative;}
  .qs-input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45;}
  .qs-input{
    width:100%;padding:14px 14px 14px 40px;border:1.5px solid var(--border-strong);border-radius:8px;
    font-size:15px;outline:none;background:#FAFAFB;
  }
  .qs-input:focus{border-color:var(--accent);background:#fff;}
  .qs-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .qs-chip{
    background:var(--gray-tint);border:1px solid var(--border);color:var(--ink-soft);font-size:11.5px;
    padding:4px 9px;border-radius:20px;cursor:pointer;
  }
  .qs-chip:hover{border-color:var(--accent);color:var(--accent);}
  .qs-fields{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:12px;color:var(--ink-faint);font-size:11px;}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:880px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);
  }
  .kpi:hover{border-color:var(--accent);transform:translateY(-1px);}
  .kpi .num{font-size:23px;font-weight:700;line-height:1;}
  .kpi .lbl{color:var(--ink-soft);font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:6px;}
  .rag{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}
  .rag.g{background:var(--green);} .rag.y{background:var(--amber);} .rag.r{background:var(--red);} .rag.n{background:var(--gray);} .rag.b{background:#3E5A9C;}

  .side-panel{padding:20px;}
  .side-panel h3{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .activity-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-row .adot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;}
  .activity-row .atxt b{font-weight:600;}
  .activity-row .atime{color:var(--ink-faint);font-size:11px;}


  /* ---------- Filters / Database ---------- */
  .filters-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .filters-bar select, .filters-bar .searchbox{
    border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--ink);
  }
  .filters-bar select{cursor:pointer;}
  .filters-bar .searchbox{flex:1;min-width:180px;position:relative;}
  .filters-bar .searchbox input{border:none;outline:none;width:100%;font-size:12.5px;}
  .filters-bar .resultcount{color:var(--ink-soft);font-size:12px;margin-left:auto;white-space:nowrap;}
  .filters-bar .clearbtn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:6px 4px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
  .data-table thead th{
    text-align:left;background:#FAFAFB;color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.3px;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .data-table tbody td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .data-table tbody tr{cursor:pointer;}
  .data-table tbody tr:hover{background:var(--accent-tint);}
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11.5px;}
  .pn-link{font-weight:600;color:var(--ink);}
  .swat{color:var(--ink-faint);font-size:11px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.approved{background:var(--green-tint);color:var(--green);}
  .badge.rejected{background:var(--red-tint);color:var(--red);}
  .badge.conditional{background:var(--amber-tint);color:var(--amber);}
  .badge.pending{background:#E8EDF7;color:#3E5A9C;}
  .badge.open{background:var(--amber-tint);color:var(--amber);}
  .badge.overdue{background:var(--red-tint);color:var(--red);}
  .badge.closed{background:var(--green-tint);color:var(--green);}
  .badge.noaction{background:var(--gray-tint);color:var(--gray);}
  .badge.resub{background:var(--amber-tint);color:var(--amber);}
  .no-action-txt{color:var(--ink-faint);font-size:12px;}

  .period-toggle{display:inline-flex;background:var(--gray-tint);border-radius:6px;padding:2px;gap:2px;}
  .period-toggle button{border:none;background:transparent;font-size:11px;font-weight:600;color:var(--ink-soft);padding:5px 10px;border-radius:5px;cursor:pointer;}
  .period-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .period-week-select{border:1px solid var(--border-strong);border-radius:6px;padding:4px 7px;font-size:11.5px;background:#fff;margin-left:6px;}
  .breakdown-row-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin:22px 0 10px;}
  .tile-row{display:grid;gap:10px;}
  .tile-row.four{grid-template-columns:repeat(4,1fr);}
  .tile-row.three{grid-template-columns:repeat(3,1fr);}
  @media(max-width:880px){.tile-row.four{grid-template-columns:repeat(2,1fr);} .tile-row.three{grid-template-columns:repeat(2,1fr);}}
  .tile{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);}
  .tile:hover{border-color:var(--accent);transform:translateY(-1px);}
  .tile .num{font-size:21px;font-weight:700;}
  .tile .lbl{color:var(--ink-soft);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:5px;}

  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state svg{opacity:.35;margin-bottom:10px;}

  /* ---------- Dashboard ---------- */
  .dash-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:880px){.dash-kpis{grid-template-columns:repeat(2,1fr);}}
  .dashcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.12s;}
  .dashcard:hover{border-color:var(--accent);transform:translateY(-1px);}
  .dashcard .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .dashcard .num{font-size:28px;font-weight:700;}
  .dashcard .lbl{color:var(--ink-soft);font-size:12px;margin-top:6px;}
  .dash-section-title{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:26px 0 10px;}

  .breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:880px){.breakdown-grid{grid-template-columns:1fr;}}
  .breakdown-card{padding:16px 18px;}
  .breakdown-card h4{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:9px;}
  .bar-row .blabel{width:120px;flex:none;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:8px;background:var(--gray-tint);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .bar-num{width:22px;text-align:right;color:var(--ink-faint);font-size:11.5px;}

  /* ---------- Case Detail ---------- */
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);font-size:12.5px;cursor:pointer;margin-bottom:14px;}
  .backlink:hover{color:var(--accent);}
  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .detail-header .titles h1{font-size:19px;margin:0 0 4px;font-weight:700;}
  .detail-header .titles .meta{color:var(--ink-soft);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;}
  .detail-header .meta .mono{color:var(--ink-faint);}
  .decision-pill{padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;text-align:center;white-space:nowrap;}

  .detail-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
  @media(max-width:920px){.detail-grid{grid-template-columns:1fr;}}

  .section-card{padding:18px 20px;margin-bottom:16px;}
  .section-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 14px;font-weight:600;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
  .info-item .k{font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
  .info-item .v{font-size:13px;font-weight:500;}
  .discussion-box{background:#FAFAFB;border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.6;}
  .followup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
  .link-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;}
  .status-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .status-tile{flex:1;min-width:150px;border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
  .status-tile .k{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;}
  .edit-input{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff;}
  .edit-input:focus{outline:none;border-color:var(--accent);}
  textarea.edit-input{resize:vertical;}

  /* Lifecycle timeline - signature element */
  .timeline-card{padding:20px 22px;}
  .timeline-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:0 0 4px;font-weight:600;}
  .timeline-card .sub{color:var(--ink-faint);font-size:11.5px;margin-bottom:18px;}
  .tl{position:relative;padding-left:26px;}
  .tl-item{position:relative;padding-bottom:22px;cursor:pointer;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{content:'';position:absolute;left:-26px;top:22px;bottom:-2px;width:2px;background:var(--border-strong);}
  .tl-item:last-child::before{display:none;}
  .tl-node{
    position:absolute;left:-33px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 0 0 1.5px var(--border-strong);
  }
  .tl-node.g{background:var(--green);box-shadow:0 0 0 1.5px var(--green);}
  .tl-node.y{background:var(--amber);box-shadow:0 0 0 1.5px var(--amber);}
  .tl-node.r{background:var(--red);box-shadow:0 0 0 1.5px var(--red);}
  .tl-node.b{background:#3E5A9C;box-shadow:0 0 0 1.5px #3E5A9C;}
  .tl-body{background:#FAFAFB;border:1px solid var(--border);border-radius:7px;padding:11px 14px;transition:.12s;}
  .tl-item.selected .tl-body{border-color:var(--accent);background:var(--accent-tint);}
  .tl-item:hover .tl-body{border-color:var(--border-strong);}
  .tl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl-week{font-weight:700;font-size:12.5px;}
  .tl-case{color:var(--ink-faint);font-size:11px;margin-left:6px;}
  .tl-note{color:var(--ink-soft);font-size:12px;margin-top:4px;}
  .tl-select-hint{font-size:10.5px;color:var(--ink-faint);margin-top:14px;text-align:center;}

  .footer-note{margin-top:28px;text-align:center;color:var(--ink-faint);font-size:11px;}

  /* ---------- Submit Case / Approvals ---------- */
  .form-card{padding:22px 24px;}
  .form-card h2{font-size:15px;margin:0 0 4px;font-weight:600;}
  .form-card p.hint{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr;}}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.span2{grid-column:1/-1;}
  .form-field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .form-field input, .form-field select, .form-field textarea{
    border:1px solid var(--border-strong);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:none;border-color:var(--accent);}
  .form-field textarea{resize:vertical;min-height:64px;}
  .form-actions{margin-top:18px;display:flex;align-items:center;gap:12px;}
  .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--border-strong);border-radius:6px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #EFC2BC;border-radius:6px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-danger:hover{background:var(--red-tint);}
  .route-note{background:#FAFAFB;border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:12px;color:var(--ink-soft);margin-top:16px;}
  .submit-banner{display:none;margin-top:14px;background:var(--green-tint);border:1px solid #BEE3D0;color:var(--green);padding:10px 12px;border-radius:6px;font-size:12.5px;font-weight:600;}
  .submit-banner.show{display:block;}

function getEarliestSelectableWednesday(){
  const naNow = getNATime();

  const diffToWed = (3 - day + 7) % 7;
  const candidate = new Date(naNow.getFullYear(), naNow.getMonth(), naNow.getDate() + diffToWed);
  const cutoff = new Date(candidate.getFullYear(), candidate.getMonth(), candidate.getDate() - 2, 23, 59, 59, 999); // Monday EOD
  if(naNow > cutoff) candidate.setDate(candidate.getDate() + 7);
  return candidate;
}

  for(let i=0;i<count;i++){

/* ---- Generated single-appearance filler cases (baseline dataset) ---- */
function seededRand(seed){ let s = seed; return ()=>{ s = (s*1103515245+12345) & 0x7fffffff; return s/0x7fffffff; }; }
function pick(arr,r){ return arr[Math.floor(r()*arr.length)]; }
function pickTags(r){
  const first = pick(ACTION_TAGS,r);
  if(r()<0.45){
    let second = pick(ACTION_TAGS,r);
    let guard=0; while(second===first && guard++<5){ second = pick(ACTION_TAGS,r); }
    return second===first ? [first] : [first, second];
  }
  return [first];
}

function generateBatch(count, weekRangeStart, weekRangeEnd, seed, swatStart){
  const r = seededRand(seed);
  const out = [];
  const decisions = ['APPROVED','APPROVED','APPROVED','CONDITIONAL APPROVAL','REJECTED','PENDING'];
  for(let i=0;i<count;i++){
    const w = weekRangeStart + Math.floor(r()*(weekRangeEnd-weekRangeStart+1));
    const dec = pick(decisions,r);
    const partType = pick(PART_TYPES,r);
    const cluster = CLUSTER_OF[partType];
    const region = pick(REGIONS,r);
    const supplier = pick(SUPPLIERS,r);
    const project = pick(PROJECTS,r);
    let caseStatus, actionStatus, followUpStatus, closureStatus, discussion;
    if(dec==='REJECTED'){
      caseStatus='Resubmission Required'; actionStatus=pick(['Open','Overdue','Closed'],r);
      discussion='Committee did not approve the recommendation as presented; cost or capacity position did not meet the target threshold and a resubmission was requested.';
    } else if(dec==='PENDING'){
      caseStatus='Open'; actionStatus=null; // not reviewed yet — no post-decision actions exist
      discussion='Pending for Sourcing Committee Review';
    } else if(dec==='CONDITIONAL APPROVAL'){
      caseStatus='Approved'; actionStatus=pick(['Open','Overdue','Closed'],r);
      discussion='Committee approved the recommendation subject to a follow-up item being closed out before production release.';
    } else {
      caseStatus= (r()<0.5?'Approved':'Closed'); actionStatus= (caseStatus==='Closed'? null : pick([null,'Closed'],r));
      discussion='Committee reviewed the sourcing recommendation and approved it without conditions; cost, quality and capacity positions were all satisfactory.';
    }
    followUpStatus = actionStatus;
    closureStatus = (actionStatus==='Closed' || actionStatus===null) ? 'Closed' : 'Open';
    const swatId = 'SWAT-'+(swatStart+i);
    const pn = String(10000000 + Math.floor(r()*89999999));
    out.push(mkCase({

const REMINDED = new Set(); // session-only: which follow-ups have had a reminder sent

/* ===================== Automatic reminders =====================
   Rules live here (Admin-editable). The daily check runs by itself whenever the Cockpit is open
   (on load and every hour after that) — it marks overdue tasks and sends the due reminders, logging each one.
   Sending is still simulated in this prototype; IT wires the same rules + log to the mail/Teams service. */
const REMINDER_DEFAULTS = { enabled:true, daysBefore:0, onDueDate:true, overdueEveryDays:1, channel:'Email + Teams', alwaysCc:'', lastRunDate:null, lastRun:null };
let REMINDER_SETTINGS = Object.assign({}, REMINDER_DEFAULTS);
try{ const saved = JSON.parse(localStorage.getItem('sc_reminder_settings_v2')||'null'); if(saved) REMINDER_SETTINGS = Object.assign({}, REMINDER_DEFAULTS, saved); }catch(e){}
function saveReminderSettings(){ try{ localStorage.setItem('sc_reminder_settings_v2', JSON.stringify(REMINDER_SETTINGS)); }catch(e){} }
const AUTO_LOG = []; // newest first: {when, trigger, swatId, task, to, cc, channel, message}
function todayISO(){ const d = getNATime(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetweenISO(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
// When will this task next get an automatic reminder? (null = never under current rules)
function nextReminderDate(t){
  const S = REMINDER_SETTINGS; if(!S.enabled) return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')) return null;
  const today = todayISO();
  const addDays = (iso,n)=>{ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const remindedToday = t.lastAutoReminderDate===today;
  const cands = [];
  if(Number(S.daysBefore)>0) cands.push(addDays(t.dueDate, -Number(S.daysBefore)));
  if(S.onDueDate) cands.push(t.dueDate);
  if(Number(S.overdueEveryDays)>0){ const k = Number(S.overdueEveryDays); for(let i=1;i<=52;i++) cands.push(addDays(t.dueDate, i*k)); }
  const future = cands.filter(d=> d>today || (d===today && !remindedToday)).sort();
  return future[0]||null;
}
// Returns {overdueMarked, sent, overdueTotal, openTotal}. force=true re-runs today's check even if it already ran.
function runDailyReminderCheck(force){
  const today = todayISO();
  const S = REMINDER_SETTINGS;
  let overdueMarked = 0, sent = 0;
  ALL_CASES.forEach(c=>{
    if(c.meetingDecision==='PENDING') return;                     // not reviewed yet — no actions exist
    (c.followUps||[]).forEach(t=>{
      if(!(t.status==='Open' || t.status==='Overdue')) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')) return;      // no usable due date
      const daysUntil = daysBetweenISO(today, t.dueDate);          // negative = overdue
      if(daysUntil < 0 && t.status==='Open'){ t.status='Overdue'; overdueMarked++; }
      if(!S.enabled) return;
      if(t.lastAutoReminderDate===today) return;                    // never twice in one day
      let trigger = null;
      if(daysUntil===Number(S.daysBefore) && Number(S.daysBefore)>0) trigger = 'Due in '+S.daysBefore+' days';
      else if(daysUntil===0 && S.onDueDate) trigger = 'Due today';
      else if(daysUntil<0 && Number(S.overdueEveryDays)>0 && ((-daysUntil) % Number(S.overdueEveryDays))===0) trigger = 'Overdue by '+(-daysUntil)+' days';
      if(!trigger) return;
      const rc = taskRecipient(t);
      const cc = [rc.cc, S.alwaysCc].filter(Boolean).join(', ');
      const channel = t.channel || S.channel;
      const entry = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), trigger, swatId:c.swatId, task:t.task, to:rc.email||'(no email on file)', cc, channel, message: reminderMessage(c,t) };
      AUTO_LOG.unshift(entry); if(AUTO_LOG.length>200) AUTO_LOG.pop();
      t.lastAutoReminderDate = today;
      t.lastReminder = { when: entry.when, channel, to: entry.to, message: entry.message, auto:true };
      REMINDED.add(t.id);
      sent++;
    });
    c.actionStatus = rollupActionStatus(c.followUps);
  });
  let overdueTotal=0, openTotal=0;
  ALL_CASES.forEach(c=>{ if(c.meetingDecision==='PENDING') return; (c.followUps||[]).forEach(t=>{ if(t.status==='Overdue') overdueTotal++; if(t.status==='Open') openTotal++; }); });
  S.lastRunDate = today;
  S.lastRun = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), auto: !force, overdueMarked, sent, overdueTotal, openTotal };
  saveReminderSettings();
  return {overdueMarked, sent, overdueTotal, openTotal};
}
function dailyCheckIfDue(){ if(REMINDER_SETTINGS.lastRunDate!==todayISO()) { const r = runDailyReminderCheck(false); if((r.sent||r.overdueMarked) && typeof render==='function' && document.getElementById('app')) render(); } }

function actionCellFor(c){ return c.meetingDecision==='PENDING' ? '<span class="no-action-txt">—</span>' : actionCell(c.actionStatus); }
function rollupActionStatus(list){
  if(!list || list.length===0) return null;
  if(list.some(t=>t.status==='Overdue')) return 'Overdue';
  if(list.some(t=>t.status==='Open')) return 'Open';
  return 'Closed';
}
// Admin-only. Removes the whole case (every weekly entry under that SWAT ID) and everything that points at it,
// so no orphan rows remain: linked submission is marked, reminder markers cleared, selection/edit state reset.
function deleteCase(swatId){
  const removed = ALL_CASES.filter(c=>c.swatId===swatId);
  if(removed.length===0) return false;
  ALL_CASES = ALL_CASES.filter(c=>c.swatId!==swatId);
  removed.forEach(c=> (c.followUps||[]).forEach(t=> REMINDED.delete(t.id)));
  SUBMISSIONS.forEach(s=>{ if(s.approvedSwatId===swatId){ s.status='Deleted'; s.rejectReason='Case '+swatId+' was deleted by an admin.'; } });
  if(state.selectedSwatId===swatId){ state.selectedSwatId=null; state.selectedEntryIndex=0; if(state.view==='detail') state.view='database'; }
  state.detailEditMode=false; state.editBuffer=null; state.pendingDeleteId=null;
  return true;
}

function latestByCase(){
  const map = new Map();
  ALL_CASES.forEach(c=>{
    const prev = map.get(c.swatId);
    if(!prev || c.weekNum > prev.weekNum || (c.weekNum===prev.weekNum && c.caseNumber>prev.caseNumber)) map.set(c.swatId, c);
  });
  return [...map.values()];
}
function historyFor(swatId){
  return ALL_CASES.filter(c=>c.swatId===swatId).sort((a,b)=> a.weekNum-b.weekNum || a.caseNumber-b.caseNumber);
}
function uniq(arr){ return [...new Set(arr)]; }

function matchesQuery(c,q){
  if(!q) return true;
  q = q.toLowerCase();
  const extraPns = partNumberLines(c).map(p=>p.partNumber+' '+p.partDescription).join(' ');
  return [c.swatId,c.partNumber,c.recommendedSupplier,c.project,c.cluster,c.region,wk(c.weekNum),c.partDescription,extraPns]
    .join(' ').toLowerCase().includes(q);
}
function matchesFilters(c,f){
  if(f.region && c.region!==f.region) return false;
  if(f.cluster && c.cluster!==f.cluster) return false;
  if(f.supplier && c.recommendedSupplier!==f.supplier) return false;
  if(f.decision && c.meetingDecision!==f.decision) return false;
  if(f.status && c.actionStatus!==f.status) return false;
  if(f.weekFrom && c.weekNum < Number(f.weekFrom)) return false;
  if(f.weekTo && c.weekNum > Number(f.weekTo)) return false;
  return true;
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ---- CSV export (replaces the old cumulative weekly-Excel habit) ---- */
function csvEscape(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  return '"' + s.replace(/"/g,'""') + '"';
}
async function saveBlobFile(blob, filename){
  // Published-artifact runtime: offer the file via the platform's downloads capability.
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{ await downloads.save({filename, data:blob}); return; }
        catch(err){ /* viewer declined, or unavailable — fall through to the direct method below */ }
      }
    }catch(err){ /* capability not obtainable — fall through */ }
  }
  // Plain-HTML fallback (works when this file is opened directly, outside the Artifact runtime).
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadCasesCsv(rows, filename){
  const anyDecided = rows.some(c=>c.meetingDecision!=='PENDING');
  const headers = ['Week','Case #','SWAT Case Number','Part Number(s)','Part Description(s)','Region','Project','Product Family','Cluster',
    'Parent PF','Part Family Code','Sourcing Type','Recommended Supplier','Presenter','Decision Level',
    'Total Peak Year Spend','Total Lifetime Spend','Sourcing Decision'].concat(anyDecided ? ['Action Status','Open Follow-up Tasks'] : []);
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(c=>{
    const pending = c.meetingDecision==='PENDING';
    const tasksSummary = pending ? '' : ((c.followUps||[]).map(t=>`${t.task} [${t.responsible}, due ${t.dueDate}, ${t.status}]`).join(' | ') || 'No action');
    const pnLines = partNumberLines(c);
    const pnSummary = pnLines.map(p=>p.partNumber).join(' | ');
    const pdSummary = pnLines.map(p=>`${p.partNumber}: ${p.partDescription} (Peak ${fmtMoney(p.peakYearSpend)}, Lifetime ${fmtMoney(p.lifetimeSpend)})`).join(' | ');
    lines.push([wk(c.weekNum),c.caseNumber,c.swatId,pnSummary,pdSummary,c.region,c.project,c.family,c.cluster,
      c.parentPF,c.partFamilyCode,c.sourcingType,c.recommendedSupplier,c.presenter,c.decisionLevel,
      c.peakYearSpend,c.lifetimeSpend,c.meetingDecision
    ].concat(anyDecided ? [(pending?'':(c.actionStatus===null?'No action':c.actionStatus)), tasksSummary] : []).map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  await saveBlobFile(blob, filename);
}

// Meeting-agenda export: color-coded header row, one row per case, open actions expanded
// horizontally (Action 1, Action 2, ...) — opens as a real spreadsheet in Excel.
function esc(v){ return (v===null||v===undefined) ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
async function downloadMeetingAgenda(rows, weekLabel, filenameSuffix){
  const anyDecided = rows.some(c=>c.meetingDecision!=='PENDING');
  const maxActions = anyDecided ? (Math.max(1, ...rows.map(c=>c.meetingDecision==='PENDING'?0:(c.followUps||[]).length), 0) || 1) : 0;
  const headerCols = ['Case #','SWAT Case Number','Part Number(s)','Part Description(s)','Region','Project','Cluster',
    'Recommended Supplier','Presenter','Decision Level','Total Peak Year Spend','Sourcing Decision'];
  if(anyDecided) headerCols.push('Action Status');
  for(let i=1;i<=maxActions;i++) headerCols.push('Action '+i);

  const headerStyle = "background:#23262B;color:#ffffff;font-weight:bold;padding:6px 8px;border:1px solid #999999;font-family:Calibri,Arial,sans-serif;font-size:11pt;white-space:nowrap;text-align:left;";
  const cellStyle = "padding:5px 8px;border:1px solid #cccccc;font-family:Calibri,Arial,sans-serif;font-size:10.5pt;vertical-align:top;";
  const titleStyle = "font-family:Calibri,Arial,sans-serif;font-size:14pt;font-weight:bold;padding:6px 0;";

  let html = '<table style="border-collapse:collapse;">';
  html += `<tr><td colspan="${headerCols.length}" style="${titleStyle}">Sourcing Committee Agenda / Meeting Minutes — ${esc(weekLabel)}</td></tr>`;
  html += '<tr>' + headerCols.map(h=>`<th style="${headerStyle}">${esc(h)}</th>`).join('') + '</tr>';
  rows.forEach(c=>{
    const pnLines = partNumberLines(c);
    const pnSummary = pnLines.map(p=>p.partNumber).join(' | ');
    const pdSummary = pnLines.map(p=>p.partNumber+': '+p.partDescription).join(' | ');
    const cells = [c.caseNumber, c.swatId, pnSummary, pdSummary, c.region, c.project, c.cluster,
      c.recommendedSupplier, c.presenter, c.decisionLevel, c.peakYearSpend, c.meetingDecision];
    if(anyDecided) cells.push(c.meetingDecision==='PENDING'?'':(c.actionStatus===null?'No action':c.actionStatus));
    const tasks = c.meetingDecision==='PENDING' ? [] : (c.followUps||[]);
    for(let i=0;i<maxActions;i++){
      const t = tasks[i];
      cells.push(t ? `${t.task} — ${t.responsible}, due ${t.dueDate} (${t.status})` : '');
    }
    html += '<tr>' + cells.map(v=>`<td style="${cellStyle}">${esc(v)}</td>`).join('') + '</tr>';
  });
  html += '</table>';

  const blob = new Blob(['\ufeff'+html], {type:'application/vnd.ms-excel'});
  await saveBlobFile(blob, `Sourcing_Committee_Agenda_${filenameSuffix}.xls`);
}

    <button class="clearbtn" id="dashExportBtn" style="border:1px solid var(--border-strong);border-radius:6px;color:var(--ink);">⬇ Export CSV (this scope)</button>

/* ============================= RENDER: APPROVALS ============================= */
function renderApprovals(){
  const pending = SUBMISSIONS.filter(s=>s.status==='Waiting for Registration Confirmation');
  const decided = SUBMISSIONS.filter(s=>s.status!=='Waiting for Registration Confirmation').sort((a,b)=> b.subId.localeCompare(a.subId));
  return `
  <div class="pagehead">
    <h1>Registration Confirmation</h1>
    <p>Confirm that a submitted case is accepted into the system, or reject it with a reason. This is <b>not</b> the Sourcing Committee decision — a confirmed case enters the Database with Sourcing Decision = Pending, and the committee decides later.</p>
  </div>

  ${pending.length===0 ? `<div class="card"><div class="empty-state">No submissions waiting for review.</div></div>` :
    pending.map(s=>`
    <div class="card appr-card">
      <div class="appr-top">
        <div>
          <div class="appr-title">${s.partNumber} — ${s.partDescription}${(s.partNumbers&&s.partNumbers.length>1)?` (+${s.partNumbers.length-1} more part number${s.partNumbers.length>2?'s':''})`:''}</div>
          <div class="who">Submitted by ${s.submitterName} (${s.submitterEmail}) · ${s.submittedAt}${s.caseId?` · <b style="color:${s.existingSwatId?'var(--accent)':'var(--green)'};">${s.existingSwatId?`Came back — existing case ${s.existingSwatId} (${s.priorEntries} previous entr${s.priorEntries===1?'y':'ies'}), will be linked to its history`:`New case ${s.caseId}`}</b>`:''}</div>
        </div>
        <span class="badge pending">Waiting for Registration Confirmation</span>
      </div>
      ${(s.partNumbers&&s.partNumbers.length>1) ? `
      <div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px;">
        <table class="data-table" style="font-size:12px;">
          <thead><tr><th>Part Number</th><th>Part Description</th><th>Peak Year Spend</th><th>Lifetime Spend</th></tr></thead>
          <tbody>${s.partNumbers.map(r=>`<tr><td class="mono">${r.partNumber}</td><td>${r.partDescription}</td><td>${fmtMoney(r.peakYearSpend)}</td><td>${fmtMoney(r.lifetimeSpend)}</td></tr>`).join('')}</tbody>
        </table>
      </div>` : ''}
      <div class="appr-grid">
        ${infoItem('Requested Meeting Date', s.meetingDateLabel||'—')}
        ${infoItem('Region', s.region)}
        ${infoItem('Project', s.project)}
        ${infoItem('Cluster', s.cluster)}
        ${infoItem('Sourcing Type', s.sourcingType)}
        ${infoItem('Recommended Supplier', s.recommendedSupplier)}
        ${infoItem('Decision Level', s.decisionLevel)}
        ${infoItem('Total Peak Year Spend', fmtMoney(s.peakYearSpend||0))}
        ${infoItem('Total Lifetime Spend', fmtMoney(s.lifetimeSpend||0))}
      </div>
      <div class="info-item"><div class="k">Comments</div><div class="v" style="font-weight:400;">${s.committeeDiscussion||'—'}</div></div>
      <div class="appr-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        ${infoItem('Family Case?', s.isFamilyCase||'—')}
        ${infoItem('Family Alignment Done?', s.familyAligned||'—')}
        ${infoItem('Family Alignment Evidence', s.familyEvidence||'—')}
        ${infoItem('Involves ECM?', s.involvesECM||'—')}
        ${infoItem('Passed CCB2?', s.ccbApproved||'—')}
      </div>
      ${state.isAdmin ? `<div class="appr-actions">
        <button class="btn-primary" data-approve="${s.subId}">Confirm Registration</button>
        <button class="btn-danger" data-reject-toggle="${s.subId}">Reject</button>
      </div>` : `<div style="font-size:11.5px;color:var(--ink-faint);margin-top:10px;">Confirm / Reject is available in Admin mode only.</div>`}
      <div class="reject-box" id="rejectBox-${s.subId}">
        <textarea id="rejectReason-${s.subId}" placeholder="Reason for returning this to the submitter (required)..."></textarea>
        <div class="form-actions">
          <button class="btn-danger" data-reject-confirm="${s.subId}">Confirm Reject &amp; Notify Submitter</button>
        </div>
      </div>
    </div>
    `).join('')}

  ${decided.length>0 ? `
  <div class="card side-panel" style="margin-top:18px;padding:20px;">
    <h3>Recently Processed Registrations</h3>
    ${decided.slice(0,8).map(s=>`
      <div class="decided-row">
        <div>${s.subId} — ${s.partDescription || s.partNumber} <span style="color:var(--ink-faint);">(${s.submitterName})</span></div>
        <span class="badge ${s.status==='Registration Confirmed'?'approved':s.status==='Deleted'?'noaction':'rejected'}">${s.status}</span>
      </div>
    `).join('')}
  </div>` : ''}
  `;
}


function renderDetail(){

  const idx = Math.min(state.selectedEntryIndex, hist.length-1);
  const c = hist[idx];
  const decClass = decisionBadgeClass(c.meetingDecision);
  const decColor = decClass==='approved'?'var(--green)':decClass==='rejected'?'var(--red)':decClass==='pending'?'#3E5A9C':'var(--amber)';
  const decBg = decClass==='approved'?'var(--green-tint)':decClass==='rejected'?'var(--red-tint)':decClass==='pending'?'#E8EDF7':'var(--amber-tint)';
  const editing = state.detailEditMode;
  const b = editing ? state.editBuffer : null;

        <h3>Committee Discussion</h3>
        ${editing ? eta('editDiscussion', b.committeeDiscussion) : `<div class="discussion-box">${c.committeeDiscussion}</div>`}
        ${(!editing && c.submitterComments) ? `<div class="info-item" style="margin-top:10px;"><div class="k">Submitter Comments (from registration)</div><div class="v" style="font-weight:400;">${c.submitterComments}</div></div>` : ''}
      </div>

      <div class="card section-card" style="margin-bottom:0;">
        <h3>Follow-up Tasks</h3>
        ${editing ? `
          ${b.followUps.length===0 ? `<div style="color:var(--ink-faint);font-size:12.5px;margin-bottom:10px;">${b.meetingDecision==='PENDING' ? 'Case is Pending for Sourcing Committee Review — follow-up tasks can be added once a Sourcing Decision is recorded.' : 'No tasks yet.'}</div>` : ''}
          ${b.followUps.map((t,i)=>`
            <div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;position:relative;">
              <button data-remove-task="${i}" class="btn-danger" style="position:absolute;top:10px;right:10px;padding:4px 9px;font-size:11px;">Remove</button>
              <div class="followup-grid" style="margin-right:80px;">
                <div class="form-field"><label>Task</label>${ef('editFuTask_'+i, t.task)}</div>
                <div class="form-field"><label>Tags (comma-separated, free text)</label>${ef('editFuTags_'+i, (t.tags||[]).join(', '))}</div>
                <div class="form-field"><label>Owner</label>${ef('editFuResp_'+i, t.responsible)}</div>
                <div class="form-field"><label>Due Date</label><input type="date" class="edit-input" id="${'editFuDue_'+i}" value="${escapeAttr(/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate||'')?t.dueDate:'')}"/></div>
                <div class="form-field"><label>Status</label>${esel('editFuStatus_'+i, t.status, ['Open','Overdue','Closed'])}</div>
                <div class="form-field"><label>Reminder to (name)</label>${ef('editFuNotify_'+i, t.notify||t.responsible||'')}</div>
                <div class="form-field"><label>Reminder email *</label>${ef('editFuEmail_'+i, t.notifyEmail||emailFor(t.notify||t.responsible))}</div>
                <div class="form-field"><label>CC (comma-separated)</label>${ef('editFuCc_'+i, t.cc||'')}</div>
                <div class="form-field"><label>Channel</label>${esel('editFuChannel_'+i, t.channel||'Email + Teams', REMINDER_CHANNELS)}</div>
                <div class="form-field span2"><label>Notes</label>${ef('editFuNotes_'+i, t.notes||'')}</div>
              </div>
            </div>
          `).join('')}
          <button class="btn-secondary" id="addTaskBtn">+ Add Follow-up Task</button>
          ${state.editError ? `<div class="block-warning" style="display:block;margin-top:14px;">⚠ ${state.editError}</div>` : ''}
          <div class="form-actions">
            <button class="btn-primary" id="saveCaseBtn">Save Changes</button>
            <button class="btn-secondary" id="cancelEditBtn">Cancel</button>
          </div>
        ` : `
          ${(!c.followUps || c.followUps.length===0) ? `<div style="color:var(--ink-faint);font-size:12.5px;">${c.meetingDecision==='PENDING' ? 'Pending for Sourcing Committee Review — no follow-up actions yet.' : 'No follow-up tasks.'}</div>` : c.followUps.map(t=>`
            <div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;">
              <div class="followup-grid">
                ${infoItem('Task', t.task)}
                ${infoItem('Tags', (t.tags && t.tags.length) ? t.tags.join(', ') : '—')}
                ${infoItem('Owner', t.responsible)}
                ${infoItem('Due Date', t.dueDate)}
                ${infoItem('Status', t.status===null ? 'No action required' : t.status)}
                ${infoItem('Reminder to', (()=>{ const rc=taskRecipient(t); return `${rc.name||'—'} &lt;${rc.email||'no email'}&gt;${rc.cc?' · cc: '+rc.cc:''} · ${rc.channel}`; })())}
              </div>
              <div class="info-item" style="margin-top:8px;"><div class="k">Notes</div><div class="v" style="font-weight:400;">${t.notes}</div></div>
            </div>
          `).join('')}
        `}
      </div>
    </div>

    <div>
      <div class="card timeline-card">
        <h3>Case Lifecycle</h3>
        <div class="sub">${hist.length} appearance${hist.length!==1?'s':''} across committee meetings · click a step to view that meeting's record</div>
        <div class="tl">
          ${hist.map((h,i)=>{
            const rag = h.meetingDecision==='REJECTED'?'r':h.meetingDecision==='CONDITIONAL APPROVAL'?'y':h.meetingDecision==='PENDING'?'b':'g';
            return `<div class="tl-item ${i===idx?'selected':''}" data-idx="${i}">
              <div class="tl-node ${rag}"></div>
              <div class="tl-body">
                <div class="tl-top">
                  <span class="tl-week">${wk(h.weekNum)}<span class="tl-case">Case #${h.caseNumber}</span></span>
                  <span class="badge ${decisionBadgeClass(h.meetingDecision)}">${h.meetingDecision}</span>
                </div>
                <div class="tl-note">${h.committeeDiscussion.slice(0,90)}${h.committeeDiscussion.length>90?'…':''}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="tl-select-hint">Viewing meeting ${idx+1} of ${hist.length}</div>
      </div>
    </div>
  </div>
  `;
}
function infoItem(k,v){ return `<div class="info-item"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

/* ============================= MASTER RENDER ============================= */
function render(){
  renderNav();
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='database') app.innerHTML = renderDatabase();
  else if(state.view==='dashboard') app.innerHTML = renderDashboard();
  else if(state.view==='followups') app.innerHTML = renderFollowups();
  else if(state.view==='detail') app.innerHTML = renderDetail();
  else if(state.view==='submit') app.innerHTML = renderSubmit();
  else if(state.view==='approvals') app.innerHTML = renderApprovals();
  wireEvents();
}

/* ============================= EVENTS ============================= */
function goToDetail(swatId){
  try{ history.replaceState(null, '', '#case/'+encodeURIComponent(swatId)); }catch(e){}
  state.selectedSwatId = swatId;
  state.selectedEntryIndex = historyFor(swatId).length-1;
  state.view='detail';
  state.detailEditMode = false;
  state.editBuffer = null;
  render();
  window.scrollTo(0,0);
}
function applyKpiFilter(key){
  if(key==='open' || key==='overdue'){
    state.view='followups'; state.followupTag=''; state.followupOwner='';
    render(); window.scrollTo(0,0); return;
  }
  state.view='database'; state.searchQuery='';
  state.filters = {year:'',weekFrom:'',weekTo:'',region:'',cluster:'',supplier:'',decision:'',status:''};
  if(key==='closedaction') state.filters.status='Closed';
  else if(key==='pending') state.filters.decision='PENDING';
  else if(key==='approved') state.filters.decision='APPROVED';
  else if(key==='rejected') state.filters.decision='REJECTED';
  else if(key==='conditional') state.filters.decision='CONDITIONAL APPROVAL';
  else if(key==='closedcases'){ /* case-level closed: no single row filter, leave unfiltered by decision/status */ }
  render();
  window.scrollTo(0,0);
}

function wireEvents(){
  document.querySelectorAll('[data-kpi]').forEach(el=>{
    el.onclick = ()=> applyKpiFilter(el.dataset.kpi);
  });
  document.querySelectorAll('[data-period]').forEach(el=>{
    el.onclick = ()=>{ state.dashPeriod = el.dataset.period; render(); };
  });
  const dws = document.getElementById('dashWeekSelect');
  if(dws) dws.onchange = ()=>{ state.dashWeek = Number(dws.value); render(); };
  const dashExportBtn = document.getElementById('dashExportBtn');
  if(dashExportBtn) dashExportBtn.onclick = ()=>{
    const periodCases = state.dashPeriod==='ytd' ? latestByCase() : ALL_CASES.filter(c=>c.weekNum===state.dashWeek);
    const label = state.dashPeriod==='ytd' ? 'ytd' : wk(state.dashWeek);
    downloadCasesCsv(periodCases, `sourcing_committee_dashboard_${label}.csv`);
  };
  const dashAgendaBtn = document.getElementById('dashAgendaBtn');
  if(dashAgendaBtn) dashAgendaBtn.onclick = ()=>{
    const periodCases = ALL_CASES.filter(c=>c.weekNum===state.dashWeek);
    downloadMeetingAgenda(periodCases, `${wk(state.dashWeek)} — ${weekDate(state.dashWeek)}`, wk(state.dashWeek));
  };

  // Home view
  const dz = document.getElementById('dropzone');
  if(dz) dz.onclick = runUploadSimulation;
  const goSubmit = document.getElementById('goToSubmit');
  if(goSubmit) goSubmit.onclick = ()=>{ state.view='submit'; render(); window.scrollTo(0,0); };
  const hsi = document.getElementById('homeSearchInput');
  if(hsi){
    hsi.oninput = (e)=>{ };
    hsi.onkeydown = (e)=>{ if(e.key==='Enter'){ state.searchQuery=hsi.value; state.view='database'; render(); } };
  }
  document.querySelectorAll('[data-qs]').forEach(el=>{
    el.onclick = ()=>{ state.searchQuery = el.dataset.qs; state.view='database'; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('.activity-row').forEach((el,i)=>{
    // recent activity click -> open that case
  });

  // Database view
  const dbSearch = document.getElementById('dbSearch');
  if(dbSearch){
    dbSearch.oninput = ()=>{ state.searchQuery = dbSearch.value; refreshDbTableOnly(); };
  }
  ['fWeekFrom','fWeekTo','fRegion','fCluster','fSupplier','fDecision','fStatus'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{
      const map={fWeekFrom:'weekFrom',fWeekTo:'weekTo',fRegion:'region',fCluster:'cluster',fSupplier:'supplier',fDecision:'decision',fStatus:'status'};
      state.filters[map[id]] = el.value;
      render();
    };
  });
  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.onclick = ()=>{
    const f = state.filters;
    const rows = ALL_CASES.filter(c=>matchesQuery(c,state.searchQuery) && matchesFilters(c,f)).sort((a,b)=> b.weekNum-a.weekNum || b.caseNumber-a.caseNumber);
    downloadCasesCsv(rows, 'sourcing_committee_export.csv');
  };
  const clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.onclick = ()=>{
    state.filters = {year:'',weekFrom:'',weekTo:'',region:'',cluster:'',supplier:'',decision:'',status:''};
    state.searchQuery='';
    render();
  };
  document.querySelectorAll('tr[data-swat]').forEach(row=>{
    row.onclick = ()=> goToDetail(row.dataset.swat);
  });

  // Admin delete (two-step: ask → confirm)
  document.querySelectorAll('[data-delete-ask]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); if(!state.isAdmin) return; state.pendingDeleteId = el.dataset.deleteAsk; render(); };
  });
  document.querySelectorAll('[data-delete-cancel]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); state.pendingDeleteId = null; render(); };
  });
  document.querySelectorAll('[data-delete-confirm]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); if(!state.isAdmin) return; deleteCase(el.dataset.deleteConfirm); render(); window.scrollTo(0,0); };
  });

  // Follow-ups tracker
  const fTag = document.getElementById('fFollowupTag');
  if(fTag) fTag.onchange = ()=>{ state.followupTag = fTag.value; render(); };
  const fOwner = document.getElementById('fFollowupOwner');
  if(fOwner) fOwner.onchange = ()=>{ state.followupOwner = fOwner.value; render(); };
  const sortDueTh = document.getElementById('sortDueTh');
  if(sortDueTh) sortDueTh.onclick = ()=>{ state.followupSortDir = state.followupSortDir==='asc'?'desc':'asc'; render(); };
  document.querySelectorAll('[data-swat-link]').forEach(el=>{
    el.onclick = ()=> goToDetail(el.dataset.swatLink);
  });
  const rsSave = document.getElementById('rsSave');
  if(rsSave) rsSave.onclick = ()=>{
    if(!state.isAdmin) return;
    const g = id => (document.getElementById(id)||{}).value;
    REMINDER_SETTINGS.enabled = g('rsEnabled')==='1';
    REMINDER_SETTINGS.onDueDate = true;
    REMINDER_SETTINGS.overdueEveryDays = Math.max(1, Number(g('rsOverdueEvery'))||1);
    REMINDER_SETTINGS.channel = g('rsChannel') || 'Email + Teams';
    REMINDER_SETTINGS.alwaysCc = (g('rsAlwaysCc')||'').trim();
    saveReminderSettings();
    render();
    runDailyReminderCheck(true); render();
    const m = document.getElementById('rsMsg'); if(m) m.textContent = 'Saved — reminders re-checked with the new rules.';
  };
  document.querySelectorAll('[data-remind-open]').forEach(el=>{
    el.onclick = ()=>{ const id = el.dataset.remindOpen; state.remindOpenId = (state.remindOpenId===id) ? null : id; render(); };
  });
  document.querySelectorAll('[data-remind-send]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.remindSend;
      let task = null;
      ALL_CASES.forEach(c=> (c.followUps||[]).forEach(t=>{ if(t.id===id) task=t; }));
      if(!task) return;
      const g = k => (document.getElementById(k+'_'+id)||{}).value || '';
      const email = g('rmEmail').trim();
      const err = document.getElementById('rmErr_'+id);
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ if(err) err.textContent='Enter a valid recipient email before sending.'; return; }
      task.notify = g('rmName').trim() || task.responsible;
      task.notifyEmail = email;
      task.cc = g('rmCc').trim();
      task.channel = g('rmChannel') || 'Email + Teams';
      const owner = ALL_CASES.find(c=>(c.followUps||[]).some(t=>t.id===id));
      task.lastReminder = { when: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), channel: task.channel, to: email, message: owner ? reminderMessage(owner, task) : '' };
      REMINDED.add(id);
      state.remindOpenId = null;
      render();
    };
  });

  // Detail view
  const back = document.getElementById('backToDb');
  if(back) back.onclick = ()=>{ state.view='database'; render(); window.scrollTo(0,0); };
  document.querySelectorAll('.tl-item').forEach(el=>{
    el.onclick = ()=>{ state.selectedEntryIndex = Number(el.dataset.idx); state.detailEditMode=false; state.editBuffer=null; render(); };
  });
  const editCaseBtn = document.getElementById('editCaseBtn');
  if(editCaseBtn) editCaseBtn.onclick = ()=>{
    const hist = historyFor(state.selectedSwatId);
    const idx = Math.min(state.selectedEntryIndex, hist.length-1);
    const c = hist[idx];
    state.editBuffer = {
      partNumbers: JSON.parse(JSON.stringify(partNumberLines(c))),
      region:c.region, project:c.project, family:c.family,
      cluster:c.cluster, parentPF:c.parentPF, partFamilyCode:c.partFamilyCode, sourcingType:c.sourcingType,
      recommendedSupplier:c.recommendedSupplier, presenter:c.presenter, decisionLevel:c.decisionLevel,
      leadTime:c.leadTime,
      committeeDiscussion:c.committeeDiscussion, meetingDecision:c.meetingDecision,
      sourcingPresentationLink:c.sourcingPresentationLink||'',
      finalDocLink:c.finalDocLink||'',
      followUps: JSON.parse(JSON.stringify(c.followUps||[])),
    };
    state.editError = null;
    state.detailEditMode = true;
    render();
  };
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ state.detailEditMode = false; state.editBuffer = null; state.editError = null; render(); };

  function syncEditBufferFromDom(){
    const b = state.editBuffer;
    if(!b) return;
    const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
    const setIf = (key, id) => { const v = val(id); if(v!==undefined) b[key]=v; };
    setIf('region','editRegion'); setIf('project','editProject'); setIf('family','editFamily');
    setIf('cluster','editCluster'); setIf('parentPF','editParentPF'); setIf('partFamilyCode','editPartFamilyCode');
    setIf('sourcingType','editSourcingType'); setIf('recommendedSupplier','editSupplier'); setIf('presenter','editPresenter');
    setIf('decisionLevel','editDecisionLevel'); setIf('leadTime','editLeadTime');
    setIf('committeeDiscussion','editDiscussion'); setIf('meetingDecision','editDecision'); setIf('sourcingPresentationLink','editPresentationLink');
    setIf('finalDocLink','editFinalDocLink');
    b.partNumbers.forEach((p,i)=>{
      const pn = val('editPnNumber_'+i); if(pn!==undefined) p.partNumber=pn;
      const pd = val('editPnDesc_'+i); if(pd!==undefined) p.partDescription=pd;
      const peak = val('editPnPeak_'+i); if(peak!==undefined) p.peakYearSpend=Number(peak)||0;
      const life = val('editPnLife_'+i); if(life!==undefined) p.lifetimeSpend=Number(life)||0;
    });
    b.followUps.forEach((t,i)=>{
      const task = val('editFuTask_'+i); if(task!==undefined) t.task=task;
      const tags = val('editFuTags_'+i); if(tags!==undefined) t.tags = tags.split(',').map(s=>s.trim()).filter(Boolean);
      const resp = val('editFuResp_'+i); if(resp!==undefined) t.responsible=resp;
      const due = val('editFuDue_'+i); if(due!==undefined) t.dueDate=due;
      const status = val('editFuStatus_'+i); if(status!==undefined) t.status=status;
      const notes = val('editFuNotes_'+i); if(notes!==undefined) t.notes=notes;
      const notify = val('editFuNotify_'+i); if(notify!==undefined) t.notify=notify;
      const em = val('editFuEmail_'+i); if(em!==undefined) t.notifyEmail=em.trim();
      const cc = val('editFuCc_'+i); if(cc!==undefined) t.cc=cc;
      const ch = val('editFuChannel_'+i); if(ch!==undefined) t.channel=ch;
    });
  }
  const addPnLineBtn = document.getElementById('addPnLineBtn');
  if(addPnLineBtn) addPnLineBtn.onclick = ()=>{
    syncEditBufferFromDom();
    state.editBuffer.partNumbers.push({partNumber:'', partDescription:'', peakYearSpend:0, lifetimeSpend:0});
    render();
  };
  document.querySelectorAll('[data-remove-pnl]').forEach(el=>{
    el.onclick = ()=>{
      syncEditBufferFromDom();
      state.editBuffer.partNumbers.splice(Number(el.dataset.removePnl), 1);
      render();
    };
  });
  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.onclick = ()=>{
    syncEditBufferFromDom();
    state.editBuffer.followUps.push({id:'FU-NEW-'+Date.now(), task:'', tags:[], responsible:'', dueDate:'', notes:'', status:'Open', notify:'', notifyEmail:'', cc:'', channel:'Email + Teams'});
    render();
  };
  document.querySelectorAll('[data-remove-task]').forEach(el=>{
    el.onclick = ()=>{
      syncEditBufferFromDom();
      state.editBuffer.followUps.splice(Number(el.dataset.removeTask), 1);
      render();
    };
  });
  const saveCaseBtn = document.getElementById('saveCaseBtn');
  if(saveCaseBtn) saveCaseBtn.onclick = ()=>{
    syncEditBufferFromDom();
    const hist = historyFor(state.selectedSwatId);
    const idx = Math.min(state.selectedEntryIndex, hist.length-1);
    const c = hist[idx];
    const b = state.editBuffer;
    const isUrl = v => /^https?:\/\/\S+$/i.test(v);
    b.finalDocLink = (b.finalDocLink||'').trim();
    b.sourcingPresentationLink = (b.sourcingPresentationLink||'').trim();
    // Rule 1: recording a Sourcing Decision (anything other than Pending) requires the Sourcing Presentation Link.
    // A newly registered case sits at Pending and is exempt until an admin records a decision.
    if(b.meetingDecision!=='PENDING'){
      if(!b.sourcingPresentationLink){ state.editError = 'A Sourcing Decision cannot be saved without the Sourcing Presentation Link. Enter the link, then save the decision.'; render(); return; }
      if(!isUrl(b.sourcingPresentationLink)){ state.editError = 'The Sourcing Presentation Link must be a full URL (starting with http:// or https://).'; render(); return; }
    }
    // Rule 0: a Pending case has not been reviewed — it cannot carry post-decision follow-up tasks.
    if(b.meetingDecision==='PENDING' && b.followUps.length>0){ state.editError = 'A case that is Pending for Sourcing Committee Review cannot have follow-up tasks. Record the Sourcing Decision first, or remove the tasks.'; render(); return; }
    // Rule 2: closing the case (every follow-up action closed) requires the Final PPT / Supporting Document Link.
    const newActionStatus = rollupActionStatus(b.followUps);
    if(newActionStatus==='Closed'){
      if(!b.finalDocLink){ state.editError = 'All follow-up actions are now Closed, which closes the case — enter the Final PPT / Supporting Document Link first.'; render(); return; }
      if(!isUrl(b.finalDocLink)){ state.editError = 'The Final PPT / Supporting Document Link must be a full URL (starting with http:// or https://).'; render(); return; }
    }
    state.editError = null;
    const totalPeak = b.partNumbers.reduce((s,p)=>s+(Number(p.peakYearSpend)||0),0);
    const totalLife = b.partNumbers.reduce((s,p)=>s+(Number(p.lifetimeSpend)||0),0);
    Object.assign(c, {
      partNumber:b.partNumbers[0].partNumber, partDescription:b.partNumbers[0].partDescription,
      partNumbers: b.partNumbers.length>1 ? b.partNumbers : null,
      region:b.region, project:b.project, family:b.family,
      cluster:b.cluster, parentPF:b.parentPF, partFamilyCode:b.partFamilyCode, sourcingType:b.sourcingType,
      recommendedSupplier:b.recommendedSupplier, presenter:b.presenter, decisionLevel:b.decisionLevel,
      peakYearSpend:totalPeak, leadTime:b.leadTime, lifetimeSpend:totalLife,
      committeeDiscussion:b.committeeDiscussion, meetingDecision:b.meetingDecision, sourcingPresentationLink:b.sourcingPresentationLink,
      finalDocLink:b.finalDocLink,
      followUps: b.followUps
    });
    c.actionStatus = c.meetingDecision==='PENDING' ? null : rollupActionStatus(c.followUps);
    state.detailEditMode = false;
    state.editBuffer = null;
    render();
    window.scrollTo(0,0);
  };

  // Global header search
  const gs = document.getElementById('globalSearch');
  if(gs){
    gs.value = '';
    gs.onkeydown = (e)=>{ if(e.key==='Enter'){ state.searchQuery = gs.value; state.view='database'; render(); window.scrollTo(0,0); } };
  }

  // Submit Case
  const submitBtn = document.getElementById('submitCaseBtn');

  // Part Numbers (repeatable rows) — appended/removed via direct DOM ops so other
  // typed fields on the form are never lost the way a full re-render would lose them.
  if(document.getElementById('partNumbersContainer')){
    if(state.pnRowCounter===undefined) state.pnRowCounter = 0;
    function wirePnRow(i){
      const removeBtn = document.querySelector(`[data-remove-pn="${i}"]`);
      if(removeBtn) removeBtn.onclick = ()=>{
        const row = document.querySelector(`[data-pn-row="${i}"]`);
        if(row) row.remove();
        recomputePnTotals();
      };
      document.querySelectorAll(`[data-pn-row="${i}"] .pn-spend`).forEach(inp=> inp.oninput = recomputePnTotals);
    }
    function recomputePnTotals(){
      let totalPeak=0, totalLife=0;
      document.querySelectorAll('.pn-row').forEach(row=>{
        const peakEl = row.querySelector('[data-pn-field="peakYearSpend"]');
        const lifeEl = row.querySelector('[data-pn-field="lifetimeSpend"]');
        totalPeak += Number(peakEl && peakEl.value)||0;
        totalLife += Number(lifeEl && lifeEl.value)||0;
      });
      const pd = document.getElementById('totalPeakDisplay'); if(pd) pd.textContent = fmtMoney(totalPeak);
      const ld = document.getElementById('totalLifetimeDisplay'); if(ld) ld.textContent = fmtMoney(totalLife);
    }
    wirePnRow(0);
    const addPnBtn = document.getElementById('addPartNumberBtn');
    if(addPnBtn) addPnBtn.onclick = ()=>{
      state.pnRowCounter++;
      document.getElementById('partNumbersContainer').insertAdjacentHTML('beforeend', partNumberRowHtml(state.pnRowCounter));
      wirePnRow(state.pnRowCounter);
    };
  }

  const caseNoEl = document.getElementById('fExistingSwat');
  if(caseNoEl) caseNoEl.oninput = ()=>{
    const h = document.getElementById('caseNoHint'); if(!h) return;
    const st = caseNoStatus(caseNoEl.value);
    if(!st){ h.style.color='var(--ink-faint)'; h.textContent='Required for every case. If this number is already in the Database, this registration is automatically linked to that case\'s history (it came back). Otherwise it is registered as a new case under this number.'; return; }
    if(st.existing){ h.style.color='var(--accent)'; h.textContent=`↩ ${st.id} is already in the Database (${st.priorEntries} previous entr${st.priorEntries===1?'y':'ies'}) — this registration will be linked to its history as a comeback.`; }
    else { h.style.color='var(--green)'; h.textContent=`✓ ${st.id} is not in the Database yet — it will be registered as a new case under this number.`; }
  };
  const qFamily = document.getElementById('qFamily');
  if(qFamily) qFamily.onchange = ()=>{
    const block = document.getElementById('familyBlock');
    block.style.display = qFamily.value==='Yes' ? 'block' : 'none';
    if(qFamily.value!=='Yes'){
      document.getElementById('qFamilyAligned').value='';
      document.getElementById('familyBlockWarning').style.display='none';
      document.getElementById('familyEvidenceField').style.display='none';
    }
  };
  const qFamilyAligned = document.getElementById('qFamilyAligned');
  if(qFamilyAligned) qFamilyAligned.onchange = ()=>{
    document.getElementById('familyBlockWarning').style.display = qFamilyAligned.value==='No' ? 'block' : 'none';
    document.getElementById('familyEvidenceField').style.display = qFamilyAligned.value==='Yes' ? 'flex' : 'none';
  };
  const qECM = document.getElementById('qECM');
  if(qECM) qECM.onchange = ()=>{
    const block = document.getElementById('ecmBlock');
    block.style.display = qECM.value==='Yes' ? 'block' : 'none';
    if(qECM.value!=='Yes'){
      document.getElementById('qCCB').value='';
    }
  };
  const qCCB = document.getElementById('qCCB');
  if(qCCB) qCCB.onchange = ()=>{
    document.getElementById('ecmBlockWarning').style.display = qCCB.value==='No' ? 'block' : 'none';
  };
  if(submitBtn) submitBtn.onclick = ()=>{
    const val = id=> (document.getElementById(id)||{}).value || '';
    const banner = document.getElementById('submitBanner');
    const showError = (msg)=>{
      banner.textContent = msg;
      banner.style.background = 'var(--red-tint)'; banner.style.color='var(--red)'; banner.style.borderColor='#EFC2BC';
      banner.classList.add('show');
    };
    const name = val('fSubmitter'), email = val('fSubmitterEmail'), supplier = val('fSupplierIn');
    const pnRows = [...document.querySelectorAll('.pn-row')].map(row=>({
      partNumber: (row.querySelector('[data-pn-field="partNumber"]')||{}).value || '',
      partDescription: (row.querySelector('[data-pn-field="partDescription"]')||{}).value || '',
      peakYearSpend: Number((row.querySelector('[data-pn-field="peakYearSpend"]')||{}).value)||0,
      lifetimeSpend: Number((row.querySelector('[data-pn-field="lifetimeSpend"]')||{}).value)||0,
    }));
    if(!name || !email || !supplier){
      showError('⚠ Please fill in Name, Email and Recommended Supplier before submitting.');
      return;
    }
    if(pnRows.length===0 || pnRows.some(r=>!r.partNumber || !r.partDescription)){
      showError('⚠ Please fill in Part Number and Part Description for every part number row before submitting.');
      return;
    }
    const spendMissing = [...document.querySelectorAll('.pn-row')].some(row=>{
      const pk = (row.querySelector('[data-pn-field="peakYearSpend"]')||{}).value, lf = (row.querySelector('[data-pn-field="lifetimeSpend"]')||{}).value;
      return pk==='' || pk===undefined || lf==='' || lf===undefined;
    });
    if(spendMissing){ showError('⚠ Please enter Peak Year Spend and Lifetime Spend for every part number (enter 0 if not applicable).'); return; }
    const caseNo = caseNoStatus(val('fExistingSwat'));
    if(!caseNo){ showError('⚠ Please enter the SWAT Case # or Supplyon Case #. Every case has one — it is required.'); return; }
    if(SUBMISSIONS.some(x=>x.caseId===caseNo.id && x.status==='Waiting for Registration Confirmation')){ showError('⚠ '+caseNo.id+' already has a registration waiting for confirmation. Please wait for that one to be processed.'); return; }
    const existingSwat = caseNo.existing ? caseNo.id : '';
    const famAns = val('qFamily'), famAligned = val('qFamilyAligned'), famEvidence = val('qFamilyEvidence');
    const ecmAns = val('qECM'), ccbAns = val('qCCB');
    if(!famAns){ showError('⚠ Please answer "Is this a Family Case?" before submitting.'); return; }
    if(!ecmAns){ showError('⚠ Please answer "Does this case involve an Engineering Change (ECM)?" before submitting.'); return; }
    if(famAns==='Yes'){
      if(!famAligned){ showError('⚠ Please answer whether Family Alignment has been completed.'); return; }
      if(famAligned==='No'){ showError('⚠ This case cannot be registered until Family Alignment is completed.'); return; }
      if(famAligned==='Yes' && !famEvidence){ showError('⚠ Please provide a link to the Family Alignment evidence.'); return; }
    }
    if(ecmAns==='Yes'){
      if(!ccbAns){ showError('⚠ Please answer whether this case has passed CCB2.'); return; }
      if(ccbAns==='No'){ showError('⚠ This case cannot be registered until it has passed CCB2 (Change Control Board 2).'); return; }
    }
    const meetingDateStr = val('fMeetingDate');
    const meetingDateObj = meetingDateStr ? new Date(meetingDateStr+'T00:00:00') : getEarliestSelectableWednesday();
    const totalPeak = pnRows.reduce((s,r)=>s+r.peakYearSpend,0);
    const totalLife = pnRows.reduce((s,r)=>s+r.lifetimeSpend,0);
    const sub = {
      subId: nextSubId(),
      submittedAt: new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}),
      submitterName:name, submitterEmail:email, status:'Waiting for Registration Confirmation', rejectReason:'',
      caseId: caseNo.id, existingSwatId: existingSwat || '', priorEntries: caseNo.priorEntries,
      partNumbers: pnRows,
      partNumber:pnRows[0].partNumber, partDescription:pnRows[0].partDescription,
      region:val('fRegionIn'), project:val('fProjectIn'), family:val('fFamily'),
      cluster:val('fClusterIn'), parentPF:val('fParentPF'), partFamilyCode:val('fPartFamilyCode'),
      sourcingType:val('fSourcingType'), recommendedSupplier:supplier, presenter:name, decisionLevel:val('fDecisionLevelIn'),
      peakYearSpend:totalPeak, leadTime:val('fLeadTime'), lifetimeSpend:totalLife,
      committeeDiscussion:val('fDiscussionIn'),
      meetingDateLabel: formatDateLong(meetingDateObj), meetingDateISO: meetingDateStr || meetingDateObj.toISOString().slice(0,10), meetingWeekNum: dateToWeekNum(meetingDateObj),
      isFamilyCase:famAns, familyAligned:famAligned||'—', familyEvidence:famEvidence||'—',
      involvesECM:ecmAns, ccbApproved:ccbAns||'—'
    };
    SUBMISSIONS.push(sub);
    render();
    window.scrollTo(0,0);
    setTimeout(()=>{
      const banner2 = document.getElementById('submitBanner');
      if(banner2){ banner2.textContent = `✓ Submitted for Registration (${sub.subId}) — Waiting for the Registration Confirmation. The SBS Procurement approver has been notified.`; banner2.classList.add('show'); }
    }, 30);
  };

  // Approvals
  document.querySelectorAll('[data-approve]').forEach(el=>{
    el.onclick = ()=>{
      if(!state.isAdmin) return;
      const sub = SUBMISSIONS.find(s=>s.subId===el.dataset.approve);
      if(!sub || sub.status!=='Waiting for Registration Confirmation') return;
      sub.status='Registration Confirmed';
      sub.approvedSwatId = sub.caseId || sub.existingSwatId || nextSwatId();
      const w = sub.meetingWeekNum || Math.max(...ALL_CASES.map(c=>c.weekNum));
      const existingForWeek = ALL_CASES.filter(c=>c.weekNum===w);
      const caseNumber = existingForWeek.length ? Math.max(...existingForWeek.map(c=>c.caseNumber))+1 : 1;
      ALL_CASES.push(mkCase({
        weekNum:w, caseNumber,
        swatId: sub.approvedSwatId, partNumber:sub.partNumber, partDescription:sub.partDescription,
        partNumbers: (sub.partNumbers && sub.partNumbers.length>1) ? sub.partNumbers : null,
        region:sub.region, project:sub.project, family:sub.family, cluster:sub.cluster,
        parentPF:sub.parentPF, partFamilyCode:sub.partFamilyCode, sourcingType:sub.sourcingType,
        recommendedSupplier:sub.recommendedSupplier, presenter:sub.presenter, decisionLevel:sub.decisionLevel,
        peakYearSpend:sub.peakYearSpend, leadTime:sub.leadTime, lifetimeSpend:sub.lifetimeSpend,
        committeeDiscussion: 'Pending for Sourcing Committee Review',
        submitterComments: sub.committeeDiscussion || '',
        meetingDecision:'PENDING', caseStatus:'Open', actionStatus:null,
        meetingDateLabel: sub.meetingDateLabel || null,
        createdDate: sub.submittedAt || null,
        followUps:[],
        closure:{status:'Open',closureDate:'—',closureComment:'Awaiting committee review.',closureEvidence:'—'}
      }));
      // Jump straight to the SAME case that was just confirmed so it's never "lost".
      state.flash = sub.existingSwatId ? `✓ Registration confirmed for ${sub.subId}. ${sub.approvedSwatId} came back — this registration was linked to its history as a new lifecycle entry (Sourcing Decision = Pending, waiting for Sourcing Committee review).` : `✓ Registration confirmed for ${sub.subId}. New case ${sub.approvedSwatId} is now in the Database with Sourcing Decision = Pending — waiting for Sourcing Committee review.`;
      goToDetail(sub.approvedSwatId);
    };
  });
  document.querySelectorAll('[data-reject-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const box = document.getElementById('rejectBox-'+el.dataset.rejectToggle);
      if(box) box.classList.toggle('show');
    };
  });
  document.querySelectorAll('[data-reject-confirm]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.rejectConfirm;
      const reasonEl = document.getElementById('rejectReason-'+id);
      const reason = reasonEl ? reasonEl.value.trim() : '';
      if(!reason){ reasonEl.style.borderColor='var(--red)'; reasonEl.placeholder='A reason is required before returning this to the submitter.'; return; }
      const sub = SUBMISSIONS.find(s=>s.subId===id);
      if(!state.isAdmin || !sub || sub.status!=='Waiting for Registration Confirmation') return;
      sub.status='Rejected'; sub.rejectReason=reason;
      render();
      window.scrollTo(0,0);
    };
  });
}
function refreshDbTableOnly(){
  // lightweight re-render preserving focus in search box
  const scrollY = window.scrollY;
  const app = document.getElementById('app');
  app.innerHTML = renderDatabase();
  wireEvents();
  document.getElementById('dbSearch').focus();
  const v = document.getElementById('dbSearch').value;
  document.getElementById('dbSearch').value=v;
  document.getElementById('dbSearch').selectionStart = document.getElementById('dbSearch').selectionEnd = v.length;
  window.scrollTo(0,scrollY);
}

function runUploadSimulation(){
  if(state.uploaded) { return; }
  const dzTitle = document.getElementById('dzTitle');
  const progress = document.getElementById('uploadProgress');
  progress.classList.add('show');
  dzTitle.textContent = '2026_W34_Sourcing_Committee.xlsx';
  const steps = ['step1','step2','step3','step4'];
  let i=0;
  function next(){
    if(i>0){
      const prev = document.getElementById(steps[i-1]);
      prev.classList.remove('active'); prev.classList.add('done');
      prev.querySelector('.dot').innerHTML='';
    }
    if(i < steps.length){
      const cur = document.getElementById(steps[i]);
      cur.classList.add('active');
      cur.querySelector('.dot').innerHTML = '<span class="spinner"></span>';
      i++;
      setTimeout(next, 650);
    } else {
      document.getElementById('uploadSuccess').classList.add('show');
      // add new batch of 18 cases simulating the new weekly file
      const newBatch = generateBatch(18, 34, 34, Date.now()%100000, 20500);
      normalizePendingCases(newBatch);
      seedFinalDocLinks(newBatch);
      seedPresentationLinks(newBatch);
      ALL_CASES = [...ALL_CASES, ...newBatch];
      state.uploaded = true;
      setTimeout(()=>{ render(); window.scrollTo(0,0); }, 900);
    }
  }
  next();
}

dailyCheckIfDue();
setInterval(dailyCheckIfDue, 60*60*1000); // re-check hourly while the Cockpit stays open (catches the date rolling over)
render();
// Direct case links (e.g. from a reminder): #case/SWAT-12345
function openFromHash(){
  const m = /^#case\/(.+)$/.exec(location.hash||'');
  if(m){ const id = decodeURIComponent(m[1]); if(ALL_CASES.some(c=>c.swatId===id)) goToDetail(id); }
}
openFromHash();
window.addEventListener('hashchange', openFromHash);
</script>
